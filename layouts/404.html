{{ define "main" }}
<article class="error-page">
  <p class="error-code">404</p>
  <h1>Page not found</h1>
  <p class="error-copy">
    That URL does not map to a page in this Hugo site. The note may have moved, the
    path may be mistyped, or the page may never have existed.
  </p>
  <div class="error-actions">
    <a href="/" class="error-action-primary">Go home</a>
    <a href="/terms/" class="error-action-secondary">Browse terms</a>
    <a href="/subjects/" class="error-action-secondary">Browse subjects</a>
  </div>
</article>
{{ end }}
