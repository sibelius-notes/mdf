{{ define "main" }}
<article class="search-page" data-pagefind-ignore>
  <h1>Search</h1>
  <input type="text" id="search-input" placeholder="Search all course notes..." autofocus>
  <div id="search-results"></div>
</article>

<script>
(function() {
  var input = document.getElementById('search-input');
  var resultsEl = document.getElementById('search-results');
  var pf = null;
  var pfLoading = false;

  // Safely render Pagefind excerpts: only <mark> tags are preserved via DOM, all else is plain text.
  function renderExcerpt(html) {
    var frag = document.createDocumentFragment();
    var parts = html.split(/(<mark>[\s\S]*?<\/mark>)/);
    parts.forEach(function(part) {
      if (part.startsWith('<mark>') && part.endsWith('</mark>')) {
        var mark = document.createElement('mark');
        mark.textContent = part.slice(6, -7);
        frag.appendChild(mark);
      } else {
        frag.appendChild(document.createTextNode(part));
      }
    });
    return frag;
  }

  async function initPagefind() {
    if (pf || pfLoading) return;
    pfLoading = true;
    try {
      pf = await import('/pagefind/pagefind.js');
      await pf.init();
    } catch (e) {
      console.error('Pagefind failed to load:', e);
      pf = null;
    }
    pfLoading = false;
  }

  initPagefind();

  var debounceTimer;
  input.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(doSearch, 200);
  });

  async function doSearch() {
    var query = input.value.trim();
    resultsEl.textContent = '';
    if (query.length < 2) return;

    await initPagefind();
    if (!pf) {
      var err = document.createElement('p');
      err.className = 'no-results';
      err.textContent = 'Search index unavailable — run: npx pagefind --site public';
      resultsEl.appendChild(err);
      return;
    }

    var search = await pf.search(query);
    if (search.results.length === 0) {
      var noRes = document.createElement('p');
      noRes.className = 'no-results';
      noRes.textContent = 'No results found.';
      resultsEl.appendChild(noRes);
      return;
    }

    var top = search.results.slice(0, 30);
    var dataItems = await Promise.all(top.map(function(r) { return r.data(); }));

    dataItems.forEach(function(data) {
      var link = document.createElement('a');
      link.href = data.url;
      link.className = 'search-result';

      var titleSpan = document.createElement('span');
      titleSpan.className = 'sr-title';
      titleSpan.textContent = data.meta.title || data.url;
      link.appendChild(titleSpan);

      if (data.excerpt) {
        var snippetSpan = document.createElement('span');
        snippetSpan.className = 'sr-snippet';
        snippetSpan.appendChild(renderExcerpt(data.excerpt));
        link.appendChild(snippetSpan);
      }

      resultsEl.appendChild(link);
    });
  }
})();
</script>
{{ end }}
