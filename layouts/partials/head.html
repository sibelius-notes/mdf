<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
{{ $pageTitle := .Site.Title }}
{{ if eq .Kind "404" }}
  {{ $pageTitle = printf "404 Page Not Found | %s" .Site.Title }}
{{ else if not .IsHome }}
  {{ $pageTitle = printf "%s | %s" .Title .Site.Title }}
{{ end }}
<title>{{ $pageTitle }}</title>
<link rel="icon" href="/favicon.ico">

<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    renderMathInElement(document.body, {
      delimiters: [
        {left: "\\[", right: "\\]", display: true},
        {left: "\\(", right: "\\)", display: false}
      ],
      throwOnError: false
    });
    // Replace KaTeX-rendered math in TOC links with plain text from the heading
    var toc = document.getElementById("TableOfContents");
    if (toc) {
      toc.querySelectorAll('a[href^="#"]').forEach(function(link) {
        var id = link.getAttribute("href").slice(1);
        var heading = document.getElementById(id);
        if (heading) link.textContent = heading.textContent;
      });
    }
  });
</script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/style.css">
<script>
  // Apply saved theme before paint to avoid flash
  (function() {
    var t = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
