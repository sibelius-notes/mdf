<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <rect width="500" height="400" fill="white"/>
  <defs>
    <marker id="biArrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2266AA"/>
    </marker>
    <marker id="biArrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#CC3333"/>
    </marker>
    <marker id="biArrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#228B22"/>
    </marker>
    <marker id="biArrowTan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#996633"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="250" y="28" font-family="serif" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Boundary-Induced Orientation</text>

  <!-- Manifold M (blob shape) -->
  <path d="M 100,120 Q 80,100 100,80 Q 150,50 250,55 Q 350,50 400,80 Q 420,100 410,140 Q 420,200 400,250 Q 350,310 250,320 Q 150,310 100,260 Q 75,220 80,180 Q 75,150 100,120 Z" fill="#e8eef8" fill-opacity="0.5" stroke="#333" stroke-width="2.5"/>

  <!-- Label M -->
  <text x="270" y="170" font-family="serif" font-style="italic" font-size="28" fill="#333">M</text>

  <!-- Boundary ∂M (the outline is the boundary, highlight a portion) -->
  <!-- Boundary orientation arrows along the boundary curve -->
  <g>
    <!-- Arrow along boundary at bottom -->
    <line x1="180" y1="318" x2="220" y2="320" stroke="#228B22" stroke-width="2.5" marker-end="url(#biArrowGreen)"/>
    <!-- Arrow along boundary at right -->
    <line x1="410" y1="180" x2="415" y2="220" stroke="#228B22" stroke-width="2.5" marker-end="url(#biArrowGreen)"/>
    <!-- Arrow along boundary at top -->
    <line x1="300" y1="53" x2="260" y2="54" stroke="#228B22" stroke-width="2.5" marker-end="url(#biArrowGreen)"/>
    <!-- Arrow along boundary at left -->
    <line x1="82" y1="200" x2="80" y2="165" stroke="#228B22" stroke-width="2.5" marker-end="url(#biArrowGreen)"/>
  </g>

  <!-- Label ∂M -->
  <text x="440" y="140" font-family="serif" font-size="18" fill="#228B22">∂M</text>

  <!-- Outward normal vectors ν along boundary -->
  <!-- Normal at bottom -->
  <line x1="200" y1="320" x2="200" y2="355" stroke="#CC3333" stroke-width="2.5" marker-end="url(#biArrowRed)"/>
  <!-- Normal at right -->
  <line x1="418" y1="200" x2="453" y2="200" stroke="#CC3333" stroke-width="2.5" marker-end="url(#biArrowRed)"/>
  <!-- Normal at top -->
  <line x1="280" y1="53" x2="280" y2="20" stroke="#CC3333" stroke-width="2.5" marker-end="url(#biArrowRed)"/>
  <!-- Normal at left -->
  <line x1="80" y1="180" x2="47" y2="180" stroke="#CC3333" stroke-width="2.5" marker-end="url(#biArrowRed)"/>

  <!-- ν labels -->
  <text x="206" y="365" font-family="serif" font-style="italic" font-size="16" fill="#CC3333">ν</text>
  <text x="458" y="205" font-family="serif" font-style="italic" font-size="16" fill="#CC3333">ν</text>
  <text x="286" y="18" font-family="serif" font-style="italic" font-size="16" fill="#CC3333">ν</text>
  <text x="30" y="185" font-family="serif" font-style="italic" font-size="16" fill="#CC3333">ν</text>

  <!-- Oriented frame near boundary (zoomed detail) -->
  <g transform="translate(350,270)">
    <!-- ν (outward normal, first vector) -->
    <line x1="0" y1="0" x2="35" y2="25" stroke="#CC3333" stroke-width="3" marker-end="url(#biArrowRed)"/>
    <text x="38" y="35" font-family="serif" font-style="italic" font-size="14" fill="#CC3333">ν</text>
    <text x="50" y="37" font-family="serif" font-size="10" fill="#CC3333">(1st)</text>

    <!-- Tangent along ∂M (second vector) -->
    <line x1="0" y1="0" x2="-10" y2="35" stroke="#228B22" stroke-width="3" marker-end="url(#biArrowGreen)"/>
    <text x="-30" y="45" font-family="serif" font-style="italic" font-size="14" fill="#228B22">τ</text>
    <text x="-18" y="47" font-family="serif" font-size="10" fill="#228B22">(2nd)</text>

    <!-- Small dot at origin -->
    <circle cx="0" cy="0" r="3" fill="#333"/>
  </g>

  <!-- Convention text -->
  <text x="250" y="385" font-family="serif" font-size="14" fill="#555" text-anchor="middle">"outward normal first" convention for induced orientation</text>
</svg>