<svg xmlns="http://www.w3.org/2000/svg" width="550" height="300" viewBox="0 0 550 300">
  <rect width="550" height="300" fill="white"/>

  <!-- Axes for function graph -->
  <line x1="40" y1="180" x2="510" y2="180" stroke="#333" stroke-width="1.2"/>
  <line x1="40" y1="190" x2="40" y2="20" stroke="#333" stroke-width="1.2" marker-end="url(#arr2)"/>

  <defs>
    <marker id="arr2" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#333"/>
    </marker>
  </defs>

  <!-- y=1 dashed line (the sum) -->
  <line x1="40" y1="60" x2="510" y2="60" stroke="#333" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="515" y="64" font-family="serif" font-size="13" fill="#333">&amp;#x2211; = 1</text>

  <!-- Height label -->
  <text x="30" y="64" font-family="serif" font-size="13" fill="#333" text-anchor="end">1</text>
  <text x="30" y="184" font-family="serif" font-size="13" fill="#333" text-anchor="end">0</text>

  <!-- psi_1 (blue) - leftmost bump -->
  <path d="M 50 180 C 50 180, 70 180, 90 170 C 110 155, 120 80, 140 60 C 160 60, 180 60, 200 60 C 220 80, 230 155, 250 170 C 270 180, 290 180, 290 180" fill="none" stroke="#2266cc" stroke-width="2.2"/>

  <!-- psi_2 (red) - middle bump -->
  <path d="M 150 180 C 150 180, 170 180, 190 170 C 210 155, 220 80, 240 60 C 260 60, 290 60, 310 60 C 330 80, 340 155, 360 170 C 380 180, 400 180, 400 180" fill="none" stroke="#cc3333" stroke-width="2.2"/>

  <!-- psi_3 (green) - rightmost bump -->
  <path d="M 270 180 C 270 180, 290 180, 310 170 C 330 155, 340 80, 360 60 C 380 60, 400 60, 420 60 C 440 80, 450 155, 470 170 C 490 180, 510 180, 510 180" fill="none" stroke="#228833" stroke-width="2.2"/>

  <!-- Function labels -->
  <text x="170" y="45" font-family="serif" font-style="italic" font-size="15" fill="#2266cc">&amp;#x03C8;<tspan font-size="11" baseline-shift="sub">1</tspan></text>
  <text x="275" y="45" font-family="serif" font-style="italic" font-size="15" fill="#cc3333">&amp;#x03C8;<tspan font-size="11" baseline-shift="sub">2</tspan></text>
  <text x="390" y="45" font-family="serif" font-style="italic" font-size="15" fill="#228833">&amp;#x03C8;<tspan font-size="11" baseline-shift="sub">3</tspan></text>

  <!-- Open sets below -->
  <line x1="40" y1="240" x2="510" y2="240" stroke="#333" stroke-width="1.5"/>

  <!-- U_1 bracket -->
  <line x1="50" y1="235" x2="50" y2="245" stroke="#2266cc" stroke-width="2"/>
  <line x1="290" y1="235" x2="290" y2="245" stroke="#2266cc" stroke-width="2"/>
  <line x1="50" y1="250" x2="290" y2="250" stroke="#2266cc" stroke-width="3" stroke-opacity="0.3"/>
  <rect x="50" y="247" width="240" height="6" fill="#2266cc" fill-opacity="0.15" rx="2"/>
  <text x="170" y="270" font-family="serif" font-style="italic" font-size="14" fill="#2266cc" text-anchor="middle">U<tspan font-size="10" baseline-shift="sub">1</tspan></text>

  <!-- U_2 bracket -->
  <line x1="150" y1="235" x2="150" y2="245" stroke="#cc3333" stroke-width="2"/>
  <line x1="400" y1="235" x2="400" y2="245" stroke="#cc3333" stroke-width="2"/>
  <rect x="150" y="256" width="250" height="6" fill="#cc3333" fill-opacity="0.15" rx="2"/>
  <text x="275" y="280" font-family="serif" font-style="italic" font-size="14" fill="#cc3333" text-anchor="middle">U<tspan font-size="10" baseline-shift="sub">2</tspan></text>

  <!-- U_3 bracket -->
  <line x1="270" y1="235" x2="270" y2="245" stroke="#228833" stroke-width="2"/>
  <line x1="510" y1="235" x2="510" y2="245" stroke="#228833" stroke-width="2"/>
  <rect x="270" y="265" width="240" height="6" fill="#228833" fill-opacity="0.15" rx="2"/>
  <text x="390" y="290" font-family="serif" font-style="italic" font-size="14" fill="#228833" text-anchor="middle">U<tspan font-size="10" baseline-shift="sub">3</tspan></text>
</svg>