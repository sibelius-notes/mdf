<svg xmlns="http://www.w3.org/2000/svg" width="450" height="350" viewBox="0 0 450 350">
  <rect width="450" height="350" fill="white"/>

  <defs>
    <marker id="cvArr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#cc2222"/>
    </marker>
  </defs>

  <!-- Stack of parallel hyperplanes (tilted for perspective) -->
  <!-- Plane 1 (leftmost) -->
  <line x1="80" y1="60" x2="80" y2="310" stroke="#2255aa" stroke-width="1.8" stroke-opacity="0.7"/>
  <!-- Plane 2 -->
  <line x1="140" y1="60" x2="140" y2="310" stroke="#2255aa" stroke-width="1.8" stroke-opacity="0.7"/>
  <!-- Plane 3 -->
  <line x1="200" y1="60" x2="200" y2="310" stroke="#2255aa" stroke-width="1.8" stroke-opacity="0.7"/>
  <!-- Plane 4 -->
  <line x1="260" y1="60" x2="260" y2="310" stroke="#2255aa" stroke-width="1.8" stroke-opacity="0.7"/>
  <!-- Plane 5 -->
  <line x1="320" y1="60" x2="320" y2="310" stroke="#2255aa" stroke-width="1.8" stroke-opacity="0.7"/>
  <!-- Plane 6 -->
  <line x1="380" y1="60" x2="380" y2="310" stroke="#2255aa" stroke-width="1.8" stroke-opacity="0.7"/>

  <!-- Shading between planes for depth -->
  <rect x="80" y="60" width="60" height="250" fill="#2255aa" fill-opacity="0.03"/>
  <rect x="200" y="60" width="60" height="250" fill="#2255aa" fill-opacity="0.03"/>
  <rect x="320" y="60" width="60" height="250" fill="#2255aa" fill-opacity="0.03"/>

  <!-- Vector v as red arrow piercing through planes -->
  <line x1="60" y1="200" x2="395" y2="140" stroke="#cc2222" stroke-width="2.8" marker-end="url(#cvArr)"/>

  <!-- Origin dot -->
  <circle cx="60" cy="200" r="4" fill="#333"/>

  <!-- v label -->
  <text x="405" y="138" font-family="serif" font-style="italic" font-size="20" fill="#cc2222">v</text>

  <!-- omega label (on one of the planes) -->
  <text x="195" y="50" font-family="serif" font-style="italic" font-size="20" fill="#2255aa">&amp;#x03C9;</text>

  <!-- "level sets of omega" annotation -->
  <text x="230" y="335" font-family="serif" font-size="13" fill="#2255aa" text-anchor="middle">level sets of <tspan font-style="italic">&amp;#x03C9;</tspan></text>

  <!-- Count pierced planes: mark the intersections -->
  <circle cx="104" cy="192" r="3" fill="#cc6600"/>
  <circle cx="164" cy="181" r="3" fill="#cc6600"/>
  <circle cx="224" cy="170" r="3" fill="#cc6600"/>
  <circle cx="284" cy="159" r="3" fill="#cc6600"/>
  <circle cx="344" cy="148" r="3" fill="#cc6600"/>

  <!-- omega(v) label with count -->
  <text x="300" y="110" font-family="serif" font-size="16" fill="#333"><tspan font-style="italic">&amp;#x03C9;</tspan>(<tspan font-style="italic">v</tspan>) = 5</text>
  <text x="300" y="128" font-family="serif" font-size="12" fill="#666">(planes pierced)</text>

  <!-- Annotation bracket showing the count -->
  <path d="M 295 115 L 284 145" fill="none" stroke="#999" stroke-width="1"/>

  <!-- omega in V* label -->
  <text x="60" y="40" font-family="serif" font-size="16" fill="#333"><tspan font-style="italic">&amp;#x03C9;</tspan> &amp;#x2208; <tspan font-style="italic">V</tspan>*</text>
</svg>