<svg xmlns="http://www.w3.org/2000/svg" width="450" height="350" viewBox="0 0 450 350">
  <rect width="450" height="350" fill="white"/>

  <!-- Manifold M as a curved surface -->
  <path d="M30,240 Q60,200 130,210 Q200,220 270,200 Q340,180 400,210 Q430,225 430,250 Q430,280 370,290 Q300,300 220,295 Q140,290 80,280 Q30,270 30,240Z" fill="#f0f4ff" stroke="#333" stroke-width="2"/>
  <text x="400" y="300" font-family="serif" font-style="italic" font-size="18" fill="#333">M</text>

  <!-- Open set U on manifold (shaded region) -->
  <ellipse cx="220" cy="245" rx="70" ry="25" fill="#d5f5e3" fill-opacity="0.5" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="280" y="260" font-family="serif" font-style="italic" font-size="16" fill="#27ae60">U</text>

  <!-- Point p -->
  <circle cx="220" cy="245" r="3.5" fill="#c0392b"/>
  <text x="228" y="250" font-family="serif" font-style="italic" font-size="15" fill="#c0392b">p</text>

  <!-- Graph of bump function above the manifold -->
  <!-- The profile: flat at 1 near p, dropping to 0 outside U -->
  <!-- Ground reference line (height 0) -->
  <line x1="80" y1="230" x2="360" y2="198" stroke="#aaa" stroke-width="0.5" stroke-dasharray="2,3"/>

  <!-- Bump function profile -->
  <path d="M80,230 Q100,228 130,225 Q150,220 170,160 Q185,100 200,85 L240,78 Q260,85 275,100 Q290,160 310,195 Q330,200 360,198" fill="none" stroke="#8e44ad" stroke-width="2.5"/>

  <!-- Flat top region -->
  <line x1="200" y1="85" x2="240" y2="78" stroke="#8e44ad" stroke-width="2.5"/>

  <!-- Height = 1 marker -->
  <line x1="175" y1="82" x2="200" y2="82" stroke="#aaa" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="158" y="86" font-family="serif" font-size="12" fill="#555">1</text>

  <!-- Height = 0 markers -->
  <text x="65" y="234" font-family="serif" font-size="12" fill="#555">0</text>
  <text x="362" y="202" font-family="serif" font-size="12" fill="#555">0</text>

  <!-- Vertical dashed lines connecting bump to manifold -->
  <line x1="220" y1="82" x2="220" y2="245" stroke="#aaa" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="160" y1="180" x2="160" y2="240" stroke="#aaa" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="290" y1="165" x2="290" y2="230" stroke="#aaa" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Label ψ on the function graph -->
  <text x="310" y="175" font-family="serif" font-style="italic" font-size="16" fill="#8e44ad">&#x03C8;</text>

  <!-- ψ ≡ 1 annotation at flat top -->
  <text x="195" y="65" font-family="serif" font-style="italic" font-size="13" fill="#8e44ad">&#x03C8;</text>
  <text x="208" y="65" font-family="serif" font-size="13" fill="#8e44ad"> &#x2261; 1</text>

  <!-- ψ ≡ 0 annotations at sides -->
  <text x="60" y="215" font-family="serif" font-style="italic" font-size="13" fill="#8e44ad">&#x03C8;</text>
  <text x="73" y="215" font-family="serif" font-size="13" fill="#8e44ad"> &#x2261; 0</text>
  <text x="360" y="185" font-family="serif" font-style="italic" font-size="13" fill="#8e44ad">&#x03C8;</text>
  <text x="373" y="185" font-family="serif" font-size="13" fill="#8e44ad"> &#x2261; 0</text>

  <!-- Subtitle -->
  <text x="225" y="335" font-family="serif" font-size="14" fill="#555" text-anchor="middle">Bump function &#x03C8;: </text>
  <text x="320" y="335" font-family="serif" font-style="italic" font-size="14" fill="#555">M</text>
  <text x="335" y="335" font-family="serif" font-size="14" fill="#555"> &#x2192; [0, 1]</text>
</svg>