<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350" viewBox="0 0 500 350">
  <rect width="500" height="350" fill="white"/>

  <!-- Half-disk (manifold with boundary) -->
  <path d="M 80 220 A 120 120 0 0 1 320 220" fill="#e8edf5" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="220" x2="320" y2="220" stroke="#cc2222" stroke-width="3"/>

  <!-- Interior label M -->
  <text x="200" y="175" font-family="serif" font-style="italic" font-size="22" fill="#333" text-anchor="middle">M</text>

  <!-- Boundary label dM -->
  <text x="200" y="250" font-family="serif" font-size="18" fill="#cc2222" text-anchor="middle">&amp;#x2202;<tspan font-style="italic">M</tspan></text>

  <!-- Neighborhood near boundary -->
  <rect x="160" y="200" width="80" height="40" fill="#ffe8b0" fill-opacity="0.5" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="4,3" rx="3"/>

  <!-- Arrow from neighborhood to H^n diagram -->
  <path d="M 240 225 C 280 230, 310 230, 340 200" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- H^n upper half-space representation -->
  <rect x="350" y="140" width="120" height="70" fill="#ffe8b0" fill-opacity="0.4" stroke="#b8860b" stroke-width="1.5" rx="2"/>
  <line x1="345" y1="210" x2="475" y2="210" stroke="#333" stroke-width="1.5"/>
  <!-- Hatching below the line to indicate "below" -->
  <line x1="355" y1="215" x2="350" y2="220" stroke="#999" stroke-width="0.8"/>
  <line x1="370" y1="215" x2="365" y2="220" stroke="#999" stroke-width="0.8"/>
  <line x1="385" y1="215" x2="380" y2="220" stroke="#999" stroke-width="0.8"/>
  <line x1="400" y1="215" x2="395" y2="220" stroke="#999" stroke-width="0.8"/>
  <line x1="415" y1="215" x2="410" y2="220" stroke="#999" stroke-width="0.8"/>
  <line x1="430" y1="215" x2="425" y2="220" stroke="#999" stroke-width="0.8"/>
  <line x1="445" y1="215" x2="440" y2="220" stroke="#999" stroke-width="0.8"/>
  <line x1="460" y1="215" x2="455" y2="220" stroke="#999" stroke-width="0.8"/>

  <!-- H^n label -->
  <text x="410" y="185" font-family="serif" font-style="italic" font-size="18" fill="#333" text-anchor="middle">H<tspan font-size="13" baseline-shift="super" font-style="italic">n</tspan></text>

  <!-- Looks like label -->
  <text x="310" y="260" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle">"looks like"</text>

  <!-- Title -->
  <text x="200" y="30" font-family="serif" font-size="18" fill="#333" text-anchor="middle">Manifold with Boundary: <tspan font-style="italic">B</tspan><tspan font-size="13" baseline-shift="super">2</tspan></text>

  <!-- Point on boundary -->
  <circle cx="200" cy="220" r="3" fill="#cc2222"/>

  <!-- B^2 label -->
  <text x="160" y="140" font-family="serif" font-style="italic" font-size="16" fill="#666">B<tspan font-size="11" baseline-shift="super">2</tspan></text>
</svg>