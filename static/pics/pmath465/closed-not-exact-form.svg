<svg xmlns="http://www.w3.org/2000/svg" width="450" height="400" viewBox="0 0 450 400">
  <rect width="450" height="400" fill="white"/>
  <defs>
    <marker id="loopArr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0,0 L 8,3 L 0,6" fill="none" stroke="#CC4444" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Coordinate axes (faint) -->
  <line x1="225" y1="20" x2="225" y2="360" stroke="#ddd" stroke-width="1"/>
  <line x1="20" y1="195" x2="430" y2="195" stroke="#ddd" stroke-width="1"/>

  <!-- Radial lines representing theta level sets -->
  <line x1="225" y1="195" x2="400" y2="60" stroke="#bbb" stroke-width="0.8"/>
  <line x1="225" y1="195" x2="420" y2="195" stroke="#bbb" stroke-width="0.8"/>
  <line x1="225" y1="195" x2="400" y2="330" stroke="#bbb" stroke-width="0.8"/>
  <line x1="225" y1="195" x2="225" y2="30" stroke="#bbb" stroke-width="0.8"/>
  <line x1="225" y1="195" x2="50" y2="60" stroke="#bbb" stroke-width="0.8"/>
  <line x1="225" y1="195" x2="30" y2="195" stroke="#bbb" stroke-width="0.8"/>
  <line x1="225" y1="195" x2="50" y2="330" stroke="#bbb" stroke-width="0.8"/>
  <line x1="225" y1="195" x2="225" y2="360" stroke="#bbb" stroke-width="0.8"/>
  <line x1="225" y1="195" x2="350" y2="45" stroke="#bbb" stroke-width="0.8"/>
  <line x1="225" y1="195" x2="100" y2="45" stroke="#bbb" stroke-width="0.8"/>
  <line x1="225" y1="195" x2="350" y2="345" stroke="#bbb" stroke-width="0.8"/>
  <line x1="225" y1="195" x2="100" y2="345" stroke="#bbb" stroke-width="0.8"/>

  <!-- Hole at origin -->
  <circle cx="225" cy="195" r="8" fill="white" stroke="#CC4444" stroke-width="2.5"/>
  <text x="235" y="205" font-family="serif" font-size="13" fill="#CC4444">0</text>

  <!-- Closed loop around origin -->
  <circle cx="225" cy="195" r="80" fill="none" stroke="#CC4444" stroke-width="2.5"/>
  <!-- Arrow on the loop (at top) -->
  <path d="M 220,115 L 230,115" stroke="#CC4444" stroke-width="2.5" marker-end="url(#loopArr)"/>

  <!-- Label the loop -->
  <text x="310" y="140" font-family="serif" font-size="16" font-style="italic" fill="#CC4444">γ</text>

  <!-- dtheta arrows (tangential covector field) shown at a few spots -->
  <!-- These are small stacks perpendicular to radial direction (i.e., tangential) -->
  <g transform="translate(305,195) rotate(0)">
    <line x1="-4" y1="-8" x2="-4" y2="8" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="4" y1="-8" x2="4" y2="8" stroke="#4477CC" stroke-width="1.3"/>
  </g>
  <g transform="translate(225,115) rotate(90)">
    <line x1="-4" y1="-8" x2="-4" y2="8" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="4" y1="-8" x2="4" y2="8" stroke="#4477CC" stroke-width="1.3"/>
  </g>
  <g transform="translate(145,195) rotate(0)">
    <line x1="-4" y1="-8" x2="-4" y2="8" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="4" y1="-8" x2="4" y2="8" stroke="#4477CC" stroke-width="1.3"/>
  </g>
  <g transform="translate(225,275) rotate(90)">
    <line x1="-4" y1="-8" x2="-4" y2="8" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="4" y1="-8" x2="4" y2="8" stroke="#4477CC" stroke-width="1.3"/>
  </g>

  <!-- Label dtheta -->
  <text x="315" y="175" font-family="serif" font-size="16" font-style="italic" fill="#4477CC">dθ</text>

  <!-- Title -->
  <text x="60" y="30" font-family="serif" font-size="17" fill="#333">R</text>
  <text x="73" y="30" font-family="serif" font-size="14" fill="#333" baseline-shift="super">2</text>
  <text x="85" y="30" font-family="serif" font-size="17" fill="#333"> \ {0}</text>

  <!-- Integral result -->
  <text x="40" y="375" font-family="serif" font-size="18" fill="#333">∮</text>
  <text x="55" y="380" font-family="serif" font-size="12" font-style="italic" fill="#CC4444">γ</text>
  <text x="70" y="375" font-family="serif" font-size="16" font-style="italic" fill="#4477CC">dθ</text>
  <text x="95" y="375" font-family="serif" font-size="16" fill="#333"> = 2π</text>

  <!-- Closed but not exact note -->
  <text x="200" y="370" font-family="serif" font-size="14" fill="#888">d(dθ) = 0, but dθ ≠ df</text>

  <!-- "hole" label -->
  <text x="240" y="225" font-family="serif" font-size="12" fill="#CC4444">hole</text>

  <!-- Integral = 2pi annotation -->
  <text x="310" y="115" font-family="serif" font-size="15" fill="#339944" font-weight="bold">∫ = 2π</text>
</svg>