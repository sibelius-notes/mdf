<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <rect width="500" height="400" fill="white"/>

  <!-- Base manifold M as a curve -->
  <path d="M 50,320 Q 150,280 250,310 Q 350,340 450,300" fill="none" stroke="#333" stroke-width="3"/>

  <!-- Label M -->
  <text x="460" y="310" font-family="serif" font-size="20" font-style="italic" fill="#333">M</text>

  <!-- Fiber at point 1 (x~130) -->
  <line x1="130" y1="295" x2="130" y2="80" stroke="#4477CC" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="130" cy="295" r="4" fill="#CC4444"/>
  <!-- Covector arrows on fiber 1 -->
  <line x1="120" y1="200" x2="140" y2="200" stroke="#4477CC" stroke-width="1.5"/>
  <line x1="120" y1="180" x2="140" y2="180" stroke="#4477CC" stroke-width="1.5"/>
  <line x1="120" y1="160" x2="140" y2="160" stroke="#4477CC" stroke-width="1.5"/>
  <line x1="120" y1="220" x2="140" y2="220" stroke="#4477CC" stroke-width="1.5"/>
  <line x1="120" y1="240" x2="140" y2="240" stroke="#4477CC" stroke-width="1.5"/>

  <!-- Fiber at point 2 (x~250) -->
  <line x1="250" y1="310" x2="250" y2="95" stroke="#4477CC" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="250" cy="310" r="4" fill="#CC4444"/>
  <line x1="240" y1="210" x2="260" y2="210" stroke="#4477CC" stroke-width="1.5"/>
  <line x1="240" y1="190" x2="260" y2="190" stroke="#4477CC" stroke-width="1.5"/>
  <line x1="240" y1="170" x2="260" y2="170" stroke="#4477CC" stroke-width="1.5"/>
  <line x1="240" y1="230" x2="260" y2="230" stroke="#4477CC" stroke-width="1.5"/>
  <line x1="240" y1="250" x2="260" y2="250" stroke="#4477CC" stroke-width="1.5"/>

  <!-- Fiber at point 3 (x~370) -->
  <line x1="370" y1="325" x2="370" y2="110" stroke="#4477CC" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="370" cy="325" r="4" fill="#CC4444"/>
  <line x1="360" y1="225" x2="380" y2="225" stroke="#4477CC" stroke-width="1.5"/>
  <line x1="360" y1="205" x2="380" y2="205" stroke="#4477CC" stroke-width="1.5"/>
  <line x1="360" y1="185" x2="380" y2="185" stroke="#4477CC" stroke-width="1.5"/>
  <line x1="360" y1="245" x2="380" y2="245" stroke="#4477CC" stroke-width="1.5"/>
  <line x1="360" y1="265" x2="380" y2="265" stroke="#4477CC" stroke-width="1.5"/>

  <!-- Shaded region for T*M -->
  <path d="M 80,80 Q 180,60 280,75 Q 380,90 460,70 L 460,300 Q 380,340 280,310 Q 180,280 80,300 Z" fill="rgba(68,119,204,0.08)" stroke="none"/>

  <!-- Label T*_pM -->
  <text x="142" y="150" font-family="serif" font-size="15" fill="#4477CC">T*</text>
  <text x="157" y="155" font-family="serif" font-size="11" fill="#4477CC" font-style="italic">p</text>
  <text x="165" y="150" font-family="serif" font-size="15" fill="#4477CC" font-style="italic">M</text>

  <!-- Label T*M -->
  <text x="350" y="50" font-family="serif" font-size="22" fill="#4477CC" font-style="italic">T*M</text>

  <!-- Projection arrow pi* -->
  <path d="M 460,200 Q 480,250 465,290" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="472" y="250" font-family="serif" font-size="16" fill="#888" font-style="italic">π*</text>

  <!-- Label p -->
  <text x="245" y="340" font-family="serif" font-size="15" fill="#CC4444" font-style="italic">p</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0,0 L 8,3 L 0,6" fill="none" stroke="#888" stroke-width="1"/>
    </marker>
  </defs>
</svg>