<svg xmlns="http://www.w3.org/2000/svg" width="450" height="300" viewBox="0 0 450 300">
  <rect width="450" height="300" fill="white"/>

  <!-- Axes -->
  <line x1="40" y1="250" x2="410" y2="250" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="225" y1="270" x2="225" y2="30" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- Shaded region where psi=1 -->
  <rect x="175" y="80" width="100" height="170" fill="#cce0ff" fill-opacity="0.4"/>

  <!-- Bump function curve -->
  <!-- Left zero region -->
  <line x1="50" y1="250" x2="105" y2="250" stroke="#2255aa" stroke-width="2.5"/>
  <!-- Left transition: smooth rise from (105,250) to (175,80) -->
  <path d="M 105 250 C 105 250, 120 250, 135 230 C 150 200, 165 100, 175 80" fill="none" stroke="#2255aa" stroke-width="2.5"/>
  <!-- Flat top where psi=1 -->
  <line x1="175" y1="80" x2="275" y2="80" stroke="#2255aa" stroke-width="2.5"/>
  <!-- Right transition: smooth fall from (275,80) to (345,250) -->
  <path d="M 275 80 C 285 100, 300 200, 315 230 C 330 250, 345 250, 345 250" fill="none" stroke="#2255aa" stroke-width="2.5"/>
  <!-- Right zero region -->
  <line x1="345" y1="250" x2="400" y2="250" stroke="#2255aa" stroke-width="2.5"/>

  <!-- Dashed line at height 1 -->
  <line x1="40" y1="80" x2="410" y2="80" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Tick marks and labels on x-axis -->
  <line x1="105" y1="246" x2="105" y2="254" stroke="#333" stroke-width="1.5"/>
  <text x="105" y="270" font-family="serif" font-size="14" fill="#333" text-anchor="middle">-2</text>

  <line x1="175" y1="246" x2="175" y2="254" stroke="#333" stroke-width="1.5"/>
  <text x="175" y="270" font-family="serif" font-size="14" fill="#333" text-anchor="middle">-1</text>

  <line x1="275" y1="246" x2="275" y2="254" stroke="#333" stroke-width="1.5"/>
  <text x="275" y="270" font-family="serif" font-size="14" fill="#333" text-anchor="middle">1</text>

  <line x1="345" y1="246" x2="345" y2="254" stroke="#333" stroke-width="1.5"/>
  <text x="345" y="270" font-family="serif" font-size="14" fill="#333" text-anchor="middle">2</text>

  <!-- y-axis labels -->
  <text x="215" y="270" font-family="serif" font-size="14" fill="#333" text-anchor="end">0</text>
  <text x="218" y="84" font-family="serif" font-size="14" fill="#333" text-anchor="end">1</text>

  <!-- Axis labels -->
  <text x="415" y="254" font-family="serif" font-style="italic" font-size="16" fill="#333">x</text>
  <text x="230" y="28" font-family="serif" font-style="italic" font-size="16" fill="#333">y</text>

  <!-- Function label -->
  <text x="330" y="55" font-family="serif" font-style="italic" font-size="18" fill="#2255aa">&amp;#x03C8;</text>

  <!-- psi=1 label -->
  <text x="225" y="70" font-family="serif" font-size="13" fill="#555" text-anchor="middle"><tspan font-style="italic">&amp;#x03C8;</tspan> = 1</text>

  <!-- psi=0 labels -->
  <text x="72" y="245" font-family="serif" font-size="12" fill="#888"><tspan font-style="italic">&amp;#x03C8;</tspan> = 0</text>
  <text x="362" y="245" font-family="serif" font-size="12" fill="#888"><tspan font-style="italic">&amp;#x03C8;</tspan> = 0</text>
</svg>