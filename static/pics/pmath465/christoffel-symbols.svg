<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <rect width="500" height="400" fill="white"/>

  <!-- Curved surface -->
  <path d="M 30 300 Q 80 180 180 200 Q 280 220 380 160 Q 430 130 480 180" fill="rgba(210,215,225,0.3)" stroke="#999" stroke-width="1.5"/>
  <path d="M 30 300 Q 100 290 200 280 Q 300 270 380 240 Q 430 220 480 180" fill="rgba(190,200,215,0.25)" stroke="#999" stroke-width="1"/>

  <!-- Surface fill -->
  <path d="M 30 300 Q 80 180 180 200 Q 280 220 380 160 Q 430 130 480 180 L 480 180 Q 430 220 380 240 Q 300 270 200 280 Q 100 290 30 300 Z" fill="rgba(200,210,225,0.2)" stroke="none"/>

  <!-- Coordinate grid lines (u-direction) -->
  <path d="M 80 250 Q 150 230 220 238 Q 300 248 380 210" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4,3"/>
  <path d="M 90 225 Q 160 205 230 213 Q 310 223 390 185" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4,3"/>
  <path d="M 100 200 Q 170 180 240 188 Q 320 198 400 160" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Coordinate grid lines (v-direction) -->
  <path d="M 140 260 Q 145 230 150 200 Q 155 180 160 165" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4,3"/>
  <path d="M 220 250 Q 228 222 235 200 Q 240 185 245 170" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4,3"/>
  <path d="M 300 235 Q 310 210 320 190 Q 325 175 330 160" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Point p -->
  <circle cx="180" cy="222" r="4" fill="#333"/>
  <text x="163" y="245" font-family="serif" font-size="15" font-style="italic" fill="#333">p</text>

  <!-- Basis vector ∂/∂u at p (along u-direction) -->
  <line x1="180" y1="222" x2="240" y2="212" stroke="#2255cc" stroke-width="2.5"/>
  <polygon points="240,212 232,217 231,210" fill="#2255cc"/>
  <text x="215" y="203" font-family="serif" font-size="13" fill="#2255cc">∂/∂<tspan font-style="italic">u</tspan></text>

  <!-- Basis vector ∂/∂v at p (along v-direction) -->
  <line x1="180" y1="222" x2="185" y2="180" stroke="#cc2255" stroke-width="2.5"/>
  <polygon points="185,180 181,189 189,188" fill="#cc2255"/>
  <text x="190" y="175" font-family="serif" font-size="13" fill="#cc2255">∂/∂<tspan font-style="italic">v</tspan></text>

  <!-- Neighboring point along u -->
  <circle cx="280" cy="208" r="3" fill="#555"/>

  <!-- ∂/∂v at neighboring point (changed) -->
  <line x1="280" y1="208" x2="290" y2="165" stroke="#cc2255" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="290,165 286,174 294,173" fill="#cc2255" opacity="0.6"/>

  <!-- Covariant derivative vector ∇_{∂u}(∂v) decomposed -->
  <!-- Tangential component -->
  <line x1="280" y1="208" x2="310" y2="195" stroke="#009900" stroke-width="2.5"/>
  <polygon points="310,195 302,200 302,193" fill="#009900"/>
  <text x="315" y="192" font-family="serif" font-size="11" fill="#009900">tangential</text>

  <!-- Normal component -->
  <line x1="280" y1="208" x2="275" y2="175" stroke="#ff8800" stroke-width="2" stroke-dasharray="3,2"/>
  <polygon points="275,175 271,184 279,183" fill="#ff8800"/>
  <text x="248" y="168" font-family="serif" font-size="11" fill="#ff8800">normal</text>

  <!-- Brace or arrow showing full derivative -->
  <text x="340" y="220" font-family="serif" font-size="12" fill="#333">∇<tspan font-size="9" dy="3">∂<tspan font-style="italic">u</tspan></tspan><tspan dy="-3">(∂/∂</tspan><tspan font-style="italic">v</tspan>)</text>

  <!-- Bottom: Christoffel symbol explanation -->
  <rect x="40" y="295" width="420" height="90" rx="8" fill="#f8f8f4" stroke="#999" stroke-width="1"/>

  <text x="250" y="318" text-anchor="middle" font-family="serif" font-size="14" fill="#333">
    Tangential part encodes Christoffel symbols:
  </text>
  <text x="250" y="345" text-anchor="middle" font-family="serif" font-size="15" fill="#333">
    ∇<tspan font-size="10" dy="3">∂<tspan font-style="italic">i</tspan></tspan><tspan dy="-3"> (∂/∂</tspan><tspan font-style="italic">x</tspan><tspan font-size="10" dy="-4">j</tspan><tspan dy="4">) = Γ</tspan><tspan font-size="10" dy="-6" font-style="italic">k</tspan><tspan dy="0" font-size="10" dx="-10">ij</tspan><tspan dy="-3" dx="3"> ∂/∂</tspan><tspan font-style="italic">x</tspan><tspan font-size="10" dy="-4" font-style="italic">k</tspan>
  </text>
  <text x="250" y="372" text-anchor="middle" font-family="serif" font-size="12" fill="#666">
    Γ<tspan font-size="9" dy="-4" font-style="italic">k</tspan><tspan dy="0" font-size="9" dx="-6" font-style="italic">ij</tspan><tspan dy="3" dx="2"> = connection coefficients in coordinates (</tspan><tspan font-style="italic">u</tspan>, <tspan font-style="italic">v</tspan>)
  </text>
</svg>