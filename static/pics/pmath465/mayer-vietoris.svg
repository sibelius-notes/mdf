<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350">
  <rect width="600" height="350" fill="white"/>

  <!-- Manifold M as oval -->
  <ellipse cx="300" cy="100" rx="200" ry="70" fill="none" stroke="#333" stroke-width="2"/>

  <!-- U region (left, blue) -->
  <path d="M 140 55 A 200 70 0 0 0 140 145 L 340 145 L 340 55 Z" fill="rgba(100,150,220,0.25)" stroke="none"/>
  <ellipse cx="300" cy="100" rx="200" ry="70" fill="none" stroke="none"/>
  <!-- clip U to ellipse shape -->
  <defs>
    <clipPath id="ellipseClip">
      <ellipse cx="300" cy="100" rx="200" ry="70"/>
    </clipPath>
  </defs>
  <rect x="100" y="30" width="240" height="140" fill="rgba(100,150,220,0.25)" clip-path="url(#ellipseClip)"/>

  <!-- V region (right, red) -->
  <rect x="260" y="30" width="240" height="140" fill="rgba(220,100,100,0.25)" clip-path="url(#ellipseClip)"/>

  <!-- Overlap U∩V (purple) -->
  <rect x="260" y="30" width="80" height="140" fill="rgba(150,80,180,0.3)" clip-path="url(#ellipseClip)"/>

  <!-- Redraw manifold outline -->
  <ellipse cx="300" cy="100" rx="200" ry="70" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Dashed lines for U and V boundaries -->
  <line x1="260" y1="35" x2="260" y2="165" stroke="#336" stroke-width="1.5" stroke-dasharray="5,4" clip-path="url(#ellipseClip)"/>
  <line x1="340" y1="35" x2="340" y2="165" stroke="#633" stroke-width="1.5" stroke-dasharray="5,4" clip-path="url(#ellipseClip)"/>

  <!-- Labels for top diagram -->
  <text x="300" y="22" text-anchor="middle" font-family="serif" font-size="18" font-style="italic" fill="#333">M</text>
  <text x="200" y="105" text-anchor="middle" font-family="serif" font-size="17" font-style="italic" fill="#2255aa">U</text>
  <text x="400" y="105" text-anchor="middle" font-family="serif" font-size="17" font-style="italic" fill="#aa3333">V</text>
  <text x="300" y="105" text-anchor="middle" font-family="serif" font-size="14" font-style="italic" fill="#663399">U∩V</text>

  <!-- Separator -->
  <line x1="50" y1="185" x2="550" y2="185" stroke="#ccc" stroke-width="1"/>

  <!-- Mayer-Vietoris long exact sequence -->
  <text x="20" y="215" font-family="serif" font-size="13" fill="#333" font-weight="bold">Mayer-Vietoris sequence:</text>

  <!-- The sequence: → H^k(M) → H^k(U) ⊕ H^k(V) → H^k(U∩V) → H^{k+1}(M) → -->
  <text x="30" y="265" font-family="serif" font-size="16" fill="#333">…</text>

  <!-- Arrow -->
  <line x1="50" y1="261" x2="75" y2="261" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#333" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- H^k(M) -->
  <text x="85" y="258" font-family="serif" font-size="16" font-style="italic" fill="#333">H</text>
  <text x="96" y="253" font-family="serif" font-size="11" font-style="italic" fill="#333">k</text>
  <text x="104" y="258" font-family="serif" font-size="16" fill="#333">(</text>
  <text x="110" y="258" font-family="serif" font-size="16" font-style="italic" fill="#333">M</text>
  <text x="125" y="258" font-family="serif" font-size="16" fill="#333">)</text>

  <!-- Arrow -->
  <line x1="135" y1="261" x2="160" y2="261" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- H^k(U) ⊕ H^k(V) -->
  <text x="170" y="258" font-family="serif" font-size="16" font-style="italic" fill="#2255aa">H</text>
  <text x="181" y="253" font-family="serif" font-size="11" font-style="italic" fill="#2255aa">k</text>
  <text x="189" y="258" font-family="serif" font-size="16" fill="#2255aa">(</text>
  <text x="195" y="258" font-family="serif" font-size="16" font-style="italic" fill="#2255aa">U</text>
  <text x="207" y="258" font-family="serif" font-size="16" fill="#2255aa">)</text>
  <text x="218" y="258" font-family="serif" font-size="16" fill="#333">⊕</text>
  <text x="238" y="258" font-family="serif" font-size="16" font-style="italic" fill="#aa3333">H</text>
  <text x="249" y="253" font-family="serif" font-size="11" font-style="italic" fill="#aa3333">k</text>
  <text x="257" y="258" font-family="serif" font-size="16" fill="#aa3333">(</text>
  <text x="263" y="258" font-family="serif" font-size="16" font-style="italic" fill="#aa3333">V</text>
  <text x="274" y="258" font-family="serif" font-size="16" fill="#aa3333">)</text>

  <!-- Arrow -->
  <line x1="285" y1="261" x2="310" y2="261" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- H^k(U∩V) -->
  <text x="320" y="258" font-family="serif" font-size="16" font-style="italic" fill="#663399">H</text>
  <text x="331" y="253" font-family="serif" font-size="11" font-style="italic" fill="#663399">k</text>
  <text x="339" y="258" font-family="serif" font-size="16" fill="#663399">(</text>
  <text x="345" y="258" font-family="serif" font-size="16" font-style="italic" fill="#663399">U</text>
  <text x="357" y="258" font-family="serif" font-size="14" fill="#663399">∩</text>
  <text x="371" y="258" font-family="serif" font-size="16" font-style="italic" fill="#663399">V</text>
  <text x="382" y="258" font-family="serif" font-size="16" fill="#663399">)</text>

  <!-- Arrow -->
  <line x1="395" y1="261" x2="420" y2="261" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- H^{k+1}(M) -->
  <text x="430" y="258" font-family="serif" font-size="16" font-style="italic" fill="#333">H</text>
  <text x="441" y="250" font-family="serif" font-size="10" font-style="italic" fill="#333">k+1</text>
  <text x="462" y="258" font-family="serif" font-size="16" fill="#333">(</text>
  <text x="468" y="258" font-family="serif" font-size="16" font-style="italic" fill="#333">M</text>
  <text x="483" y="258" font-family="serif" font-size="16" fill="#333">)</text>

  <!-- Arrow -->
  <line x1="495" y1="261" x2="520" y2="261" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <text x="530" y="265" font-family="serif" font-size="16" fill="#333">…</text>

  <!-- connecting map label -->
  <text x="300" y="310" text-anchor="middle" font-family="serif" font-size="13" fill="#666">connecting homomorphism δ*</text>
  <path d="M 370 295 Q 410 280 408 265" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
</svg>