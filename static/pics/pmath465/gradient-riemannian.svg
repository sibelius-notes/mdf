<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <rect width="500" height="350" fill="white"/>

  <text x="250" y="25" text-anchor="middle" font-family="serif" font-size="18" font-weight="bold" fill="#222">Gradient via Riemannian Metric</text>

  <defs>
    <marker id="grArr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#cc3322"/>
    </marker>
    <marker id="dfArr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2255aa"/>
    </marker>
  </defs>

  <!-- Level curves -->
  <g transform="translate(180, 185)">
    <ellipse cx="0" cy="0" rx="20" ry="15" fill="none" stroke="#66aa55" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="45" ry="35" fill="none" stroke="#66aa55" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="75" ry="58" fill="none" stroke="#66aa55" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="110" ry="85" fill="none" stroke="#66aa55" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="145" ry="110" fill="none" stroke="#66aa55" stroke-width="1.5"/>

    <!-- Level labels -->
    <text x="25" y="-2" font-family="serif" font-size="11" fill="#55883a" font-style="italic">c</text>
    <text x="48" y="-20" font-family="serif" font-size="11" fill="#55883a" font-style="italic">c+1</text>
    <text x="78" y="-42" font-family="serif" font-size="11" fill="#55883a" font-style="italic">c+2</text>
  </g>

  <!-- Gradient arrows (perpendicular to level curves) -->
  <!-- Right -->
  <line x1="225" y1="185" x2="270" y2="185" stroke="#cc3322" stroke-width="2" marker-end="url(#grArr)"/>
  <!-- Upper right -->
  <line x1="215" y1="155" x2="248" y2="130" stroke="#cc3322" stroke-width="2" marker-end="url(#grArr)"/>
  <!-- Top -->
  <line x1="180" y1="145" x2="180" y2="105" stroke="#cc3322" stroke-width="2" marker-end="url(#grArr)"/>
  <!-- Left -->
  <line x1="135" y1="185" x2="95" y2="185" stroke="#cc3322" stroke-width="2" marker-end="url(#grArr)"/>
  <!-- Bottom -->
  <line x1="180" y1="225" x2="180" y2="260" stroke="#cc3322" stroke-width="2" marker-end="url(#grArr)"/>
  <!-- Lower left -->
  <line x1="148" y1="215" x2="118" y2="240" stroke="#cc3322" stroke-width="2" marker-end="url(#grArr)"/>

  <!-- Detailed point showing df and grad f -->
  <g transform="translate(255, 150)">
    <!-- Point -->
    <circle cx="0" cy="0" r="3" fill="#333"/>
    <text x="5" y="-8" font-family="serif" font-size="12" fill="#333" font-style="italic">p</text>

    <!-- grad f as vector arrow -->
    <line x1="0" y1="0" x2="55" y2="-30" stroke="#cc3322" stroke-width="2.5" marker-end="url(#grArr)"/>
    <text x="58" y="-32" font-family="serif" font-size="14" fill="#cc3322">grad <tspan font-style="italic">f</tspan></text>

    <!-- df as stacked lines (covector) -->
    <g transform="rotate(-28)">
      <line x1="20" y1="-12" x2="20" y2="12" stroke="#2255aa" stroke-width="1.5"/>
      <line x1="30" y1="-12" x2="30" y2="12" stroke="#2255aa" stroke-width="1.5"/>
      <line x1="40" y1="-12" x2="40" y2="12" stroke="#2255aa" stroke-width="1.5"/>
      <line x1="50" y1="-12" x2="50" y2="12" stroke="#2255aa" stroke-width="1.5"/>
    </g>
    <text x="25" y="30" font-family="serif" font-size="14" fill="#2255aa" font-style="italic">df</text>
  </g>

  <!-- Labels -->
  <text x="65" y="310" font-family="serif" font-size="13" fill="#55883a">Level curves <tspan font-style="italic">f</tspan> = <tspan font-style="italic">c</tspan></text>

  <!-- Musical isomorphism -->
  <text x="300" y="300" text-anchor="middle" font-family="serif" font-size="14" fill="#555">
    grad <tspan font-style="italic">f</tspan> = (<tspan font-style="italic">df</tspan>)<tspan font-size="12" baseline-shift="super">&sharp;</tspan>
  </text>
  <text x="300" y="320" text-anchor="middle" font-family="serif" font-size="13" fill="#888">
    &langle;grad <tspan font-style="italic">f</tspan>, <tspan font-style="italic">v</tspan>&rangle; = <tspan font-style="italic">df</tspan>(<tspan font-style="italic">v</tspan>)
  </text>
  <text x="300" y="340" text-anchor="middle" font-family="serif" font-size="12" fill="#aaa">(metric duality)</text>
</svg>