<svg xmlns="http://www.w3.org/2000/svg" width="650" height="380" viewBox="0 0 650 380">
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c0392b"/>
    </marker>
    <marker id="arr-black" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arr-purple" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#8e44ad"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a8a6e"/>
    </marker>
  </defs>

  <rect width="650" height="380" fill="white"/>

  <!-- ===== LEFT: Manifold M ===== -->
  <path d="M 50,200 C 60,130 110,90 160,120 C 210,150 230,95 270,140 C 285,170 275,230 245,250 C 215,270 185,280 145,265 C 105,250 60,270 50,200 Z"
        fill="#e8e8e8" stroke="#555" stroke-width="2" fill-opacity="0.6"/>

  <!-- Curvature lines on M -->
  <path d="M 90,185 C 120,160 160,150 190,160" stroke="#bbb" stroke-width="0.8" fill="none"/>
  <path d="M 100,215 C 140,195 180,185 220,200" stroke="#bbb" stroke-width="0.8" fill="none"/>

  <!-- Tangent plane at p on M -->
  <polygon points="100,115 215,95 240,170 125,190"
           fill="#aed6f1" fill-opacity="0.4" stroke="#2980b9" stroke-width="1.3" stroke-dasharray="5,3"/>

  <!-- Point p -->
  <circle cx="168" cy="148" r="4.5" fill="#c0392b" stroke="#8b0000" stroke-width="1.5"/>

  <!-- Tangent vector v_p in T_pM -->
  <line x1="168" y1="148" x2="225" y2="125" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arr-red)"/>

  <!-- Label: M -->
  <text x="250" y="270" font-family="serif" font-size="22" font-style="italic" fill="#333">M</text>

  <!-- Label: p -->
  <text x="152" y="172" font-family="serif" font-size="17" font-style="italic" fill="#8b0000">p</text>

  <!-- Label: T_pM -->
  <text x="95" y="105" font-family="serif" font-size="16" fill="#2471a3">
    <tspan font-style="italic">T</tspan><tspan font-size="12" dy="3">p</tspan><tspan font-size="16" dy="-3" font-style="italic">M</tspan>
  </text>

  <!-- Label: v_p -->
  <text x="228" y="118" font-family="serif" font-size="15" font-style="italic" fill="#c0392b">v<tspan font-size="11" dy="3">p</tspan></text>

  <!-- ===== RIGHT: Manifold N ===== -->
  <path d="M 400,210 C 405,130 445,85 500,110 C 555,135 580,90 610,135 C 625,165 620,235 590,255 C 560,275 530,290 490,275 C 450,260 410,280 400,210 Z"
        fill="#e8e8e8" stroke="#555" stroke-width="2" fill-opacity="0.6"/>

  <!-- Curvature lines on N -->
  <path d="M 440,190 C 470,165 510,155 540,165" stroke="#bbb" stroke-width="0.8" fill="none"/>
  <path d="M 445,220 C 485,200 530,190 570,205" stroke="#bbb" stroke-width="0.8" fill="none"/>

  <!-- Tangent plane at F(p) on N -->
  <polygon points="445,110 565,90 590,170 470,190"
           fill="#abebc6" fill-opacity="0.4" stroke="#1a8a6e" stroke-width="1.3" stroke-dasharray="5,3"/>

  <!-- Point F(p) -->
  <circle cx="515" cy="145" r="4.5" fill="#1a8a6e" stroke="#0e5c46" stroke-width="1.5"/>

  <!-- Pushforward image vector (F_*)_p(v_p) in T_{F(p)}N -->
  <line x1="515" y1="145" x2="575" y2="118" stroke="#1a8a6e" stroke-width="2.2" marker-end="url(#arr-teal)"/>

  <!-- Label: N -->
  <text x="595" y="275" font-family="serif" font-size="22" font-style="italic" fill="#333">N</text>

  <!-- Label: F(p) -->
  <text x="492" y="174" font-family="serif" font-size="16" font-style="italic" fill="#0e5c46">F<tspan font-size="16">(</tspan>p<tspan font-size="16">)</tspan></text>

  <!-- Label: T_{F(p)}N -->
  <text x="440" y="100" font-family="serif" font-size="15" fill="#1a8a6e">
    <tspan font-style="italic">T</tspan><tspan font-size="10" dy="3">F(p)</tspan><tspan font-size="15" dy="-3" font-style="italic">N</tspan>
  </text>

  <!-- Label: (F_*)_p(v_p) -->
  <text x="565" y="108" font-family="serif" font-size="13" fill="#1a8a6e">
    <tspan font-style="italic">(F</tspan><tspan font-size="10" dy="-5">*</tspan><tspan font-size="13" dy="5">)</tspan><tspan font-size="10" dy="3">p</tspan><tspan font-size="13" dy="-3">(v</tspan><tspan font-size="10" dy="3">p</tspan><tspan font-size="13" dy="-3">)</tspan>
  </text>

  <!-- ===== Curved arrow F: M → N ===== -->
  <path d="M 250,175 C 290,90 360,80 400,155"
        fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr-black)"/>

  <!-- Label: F -->
  <text x="310" y="85" font-family="serif" font-size="20" font-style="italic" fill="#333">F</text>

  <!-- ===== Straight arrow F_*: T_pM → T_{F(p)}N (pushforward) ===== -->
  <path d="M 230,138 C 290,310 380,310 460,160"
        fill="none" stroke="#8e44ad" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arr-purple)"/>

  <!-- Label: F_* (pushforward) -->
  <text x="310" y="310" font-family="serif" font-size="18" fill="#8e44ad" text-anchor="middle">
    <tspan font-style="italic">F</tspan><tspan font-size="13" dy="-6">*</tspan>
  </text>

  <!-- Title -->
  <text x="325" y="360" font-family="serif" font-size="18" fill="#333" text-anchor="middle">Pushforward (Differential) of a Smooth Map</text>
</svg>