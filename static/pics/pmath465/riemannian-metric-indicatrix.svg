<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <rect width="500" height="400" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#333" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Curved surface M -->
  <path d="M60,280 Q120,100 250,180 Q380,260 440,120" fill="none" stroke="#333" stroke-width="2.5"/>
  <path d="M60,280 Q100,310 160,300 Q220,290 280,270 Q340,250 400,200 Q420,170 440,120" fill="#e8e8f0" fill-opacity="0.4" stroke="none"/>
  <path d="M60,280 Q120,100 250,180 Q380,260 440,120" fill="none" stroke="#333" stroke-width="2.5"/>
  <path d="M60,280 Q100,310 160,300 Q220,290 280,270 Q340,250 400,200 Q420,170 440,120" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Label M -->
  <text x="430" y="100" font-family="serif" font-style="italic" font-size="22" fill="#333" font-weight="bold">M</text>

  <!-- Indicatrix ellipses at various points on the surface -->
  <!-- Point 1: near left -->
  <g transform="translate(110,215)">
    <ellipse cx="0" cy="0" rx="22" ry="12" fill="#cc3333" fill-opacity="0.15" stroke="#cc3333" stroke-width="1.5" transform="rotate(-25)"/>
    <circle cx="0" cy="0" r="2" fill="#333"/>
  </g>

  <!-- Point 2: middle-left -->
  <g transform="translate(195,175)">
    <ellipse cx="0" cy="0" rx="18" ry="14" fill="#2266cc" fill-opacity="0.15" stroke="#2266cc" stroke-width="1.5" transform="rotate(10)"/>
    <circle cx="0" cy="0" r="2" fill="#333"/>
  </g>

  <!-- Point 3: center -->
  <g transform="translate(280,210)">
    <ellipse cx="0" cy="0" rx="25" ry="10" fill="#cc3333" fill-opacity="0.15" stroke="#cc3333" stroke-width="1.5" transform="rotate(-40)"/>
    <circle cx="0" cy="0" r="2" fill="#333"/>
  </g>

  <!-- Point 4: right -->
  <g transform="translate(370,190)">
    <ellipse cx="0" cy="0" rx="14" ry="20" fill="#2266cc" fill-opacity="0.15" stroke="#2266cc" stroke-width="1.5" transform="rotate(30)"/>
    <circle cx="0" cy="0" r="2" fill="#333"/>
  </g>

  <!-- Point 5: far left -->
  <g transform="translate(80,260)">
    <ellipse cx="0" cy="0" rx="16" ry="16" fill="#339944" fill-opacity="0.15" stroke="#339944" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#333"/>
  </g>

  <!-- Label g -->
  <text x="30" y="45" font-family="serif" font-style="italic" font-size="20" fill="#333">g</text>
  <text x="48" y="50" font-family="serif" font-size="14" fill="#555"> = Riemannian metric</text>

  <!-- Annotation arrow to an ellipse -->
  <line x1="350" y1="310" x2="290" y2="220" stroke="#666" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <text x="290" y="330" font-family="serif" font-size="13" fill="#555">unit ball in</text>
  <text x="290" y="348" font-family="serif" font-style="italic" font-size="14" fill="#555">T</text>
  <text x="300" y="352" font-family="serif" font-style="italic" font-size="10" fill="#555">p</text>
  <text x="308" y="348" font-family="serif" font-style="italic" font-size="14" fill="#555">M</text>

  <!-- Note about varying metric -->
  <text x="30" y="380" font-family="serif" font-size="13" fill="#666">Shape and orientation of indicatrix vary from point to point</text>
</svg>