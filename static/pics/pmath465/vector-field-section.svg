  <line x1="195" y1="198" x2="217" y2="198" stroke="#2255aa" stroke-width="1.5" marker-end="url(#vfArr)"/>
  <line x1="265" y1="198" x2="287" y2="202" stroke="#2255aa" stroke-width="1.5" marker-end="url(#vfArr)"/>
  <line x1="335" y1="205" x2="354" y2="215" stroke="#2255aa" stroke-width="1.5" marker-end="url(#vfArr)"/>

  <!-- Row 5 -->
  <line x1="80" y1="250" x2="96" y2="242" stroke="#2255aa" stroke-width="1.5" marker-end="url(#vfArr)"/>
  <line x1="145" y1="245" x2="166" y2="242" stroke="#2255aa" stroke-width="1.5" marker-end="url(#vfArr)"/>
