  <line x1="130" y1="155" x2="152" y2="148" stroke="#2255aa" stroke-width="1.5" marker-end="url(#vfArr)"/>
  <line x1="200" y1="150" x2="222" y2="147" stroke="#2255aa" stroke-width="1.5" marker-end="url(#vfArr)"/>
  <line x1="270" y1="148" x2="292" y2="150" stroke="#2255aa" stroke-width="1.5" marker-end="url(#vfArr)"/>
  <line x1="340" y1="155" x2="360" y2="162" stroke="#2255aa" stroke-width="1.5" marker-end="url(#vfArr)"/>

