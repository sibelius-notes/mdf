  <line x1="195" y1="283" x2="215" y2="286" stroke="#2255aa" stroke-width="1.5" marker-end="url(#vfArr)"/>
  <line x1="265" y1="288" x2="282" y2="294" stroke="#2255aa" stroke-width="1.5" marker-end="url(#vfArr)"/>
  <line x1="330" y1="280" x2="342" y2="290" stroke="#2255aa" stroke-width="1.5" marker-end="url(#vfArr)"/>

  <!-- Label -->
  <text x="225" y="340" font-family="serif" font-size="16" fill="#333" text-anchor="middle">Smooth Vector Field on <tspan font-style="italic">M</tspan></text>
