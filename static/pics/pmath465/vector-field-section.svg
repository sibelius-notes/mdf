<svg xmlns="http://www.w3.org/2000/svg" width="450" height="350" viewBox="0 0 450 350">
  <rect width="450" height="350" fill="white"/>

  <defs>
    <marker id="vfArr" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 5 2, 0 4" fill="#2255aa"/>
    </marker>
  </defs>

  <!-- Surface M - an elliptical blob -->
  <ellipse cx="225" cy="185" rx="185" ry="140" fill="#f0f0f0" stroke="#333" stroke-width="2"/>

  <!-- Smooth vector field arrows - dipole-like pattern -->
  <!-- Row 1 (top area) -->
  <line x1="120" y1="80" x2="140" y2="75" stroke="#2255aa" stroke-width="1.5" marker-end="url(#vfArr)"/>
  <line x1="180" y1="70" x2="200" y2="68" stroke="#2255aa" stroke-width="1.5" marker-end="url(#vfArr)"/>
  <line x1="240" y1="65" x2="260" y2="66" stroke="#2255aa" stroke-width="1.5" marker-end="url(#vfArr)"/>
  <line x1="300" y1="75" x2="318" y2="80" stroke="#2255aa" stroke-width="1.5" marker-end="url(#vfArr)"/>

  <!-- Row 2 -->
  <line x1="80" y1="120" x2="100" y2="112" stroke="#2255aa" stroke-width="1.5" marker-end="url(#vfArr)"/>
