<svg xmlns="http://www.w3.org/2000/svg" width="500" height="250" viewBox="0 0 500 250">
  <rect width="500" height="250" fill="white"/>

  <!-- Title -->
  <text x="250" y="28" font-family="serif" font-size="16" fill="#333" text-anchor="middle">The Line with Two Origins (Non-Hausdorff)</text>

  <!-- First copy R_1 -->
  <line x1="40" y1="90" x2="460" y2="90" stroke="#2255aa" stroke-width="2"/>
  <!-- Origin 0_1 highlighted -->
  <circle cx="250" cy="90" r="6" fill="#2255aa" stroke="#1a3d7a" stroke-width="1.5"/>
  <text x="250" y="75" font-family="serif" font-size="15" fill="#2255aa" text-anchor="middle">0<tspan font-size="10" baseline-shift="sub">1</tspan></text>
  <!-- R_1 label -->
  <text x="470" y="95" font-family="serif" font-style="italic" font-size="16" fill="#2255aa">R<tspan font-size="11" baseline-shift="sub">1</tspan></text>

  <!-- Second copy R_2 -->
  <line x1="40" y1="160" x2="460" y2="160" stroke="#cc2222" stroke-width="2"/>
  <!-- Origin 0_2 highlighted -->
  <circle cx="250" cy="160" r="6" fill="#cc2222" stroke="#8b1a1a" stroke-width="1.5"/>
  <text x="250" y="185" font-family="serif" font-size="15" fill="#cc2222" text-anchor="middle">0<tspan font-size="10" baseline-shift="sub">2</tspan></text>
  <!-- R_2 label -->
  <text x="470" y="165" font-family="serif" font-style="italic" font-size="16" fill="#cc2222">R<tspan font-size="11" baseline-shift="sub">2</tspan></text>

  <!-- Gluing indicators: vertical dashes connecting corresponding points away from origin -->
  <line x1="80" y1="93" x2="80" y2="157" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="130" y1="93" x2="130" y2="157" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="180" y1="93" x2="180" y2="157" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- No gluing at origin (250) -->
  <line x1="320" y1="93" x2="320" y2="157" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="370" y1="93" x2="370" y2="157" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="420" y1="93" x2="420" y2="157" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- "identified" labels -->
  <text x="130" y="135" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">glued</text>
  <text x="370" y="135" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">glued</text>

  <!-- "not identified" near origins -->
  <text x="250" y="135" font-family="sans-serif" font-size="11" fill="#cc6600" text-anchor="middle">not glued</text>

  <!-- Curly brace or X between the two origins -->
  <line x1="244" y1="96" x2="244" y2="154" stroke="#cc6600" stroke-width="1.5"/>
  <line x1="256" y1="96" x2="256" y2="154" stroke="#cc6600" stroke-width="1.5"/>

  <!-- Caption -->
  <text x="250" y="225" font-family="serif" font-size="13" fill="#555" text-anchor="middle">Points <tspan font-style="italic">x</tspan> &amp;#x2260; 0 on <tspan font-style="italic">R</tspan><tspan font-size="10" baseline-shift="sub">1</tspan> and <tspan font-style="italic">R</tspan><tspan font-size="10" baseline-shift="sub">2</tspan> are identified; the two origins are distinct.</text>
</svg>