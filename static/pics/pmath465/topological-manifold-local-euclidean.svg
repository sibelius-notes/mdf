<svg xmlns="http://www.w3.org/2000/svg" width="450" height="350" viewBox="0 0 450 350">
  <rect width="450" height="350" fill="white"/>

  <defs>
    <marker id="mArr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- Blob-shaped manifold M -->
  <path d="M 50 180 C 40 130, 70 70, 120 60 C 170 50, 200 80, 210 100 C 220 80, 240 55, 270 65 C 310 80, 300 130, 280 160 C 260 195, 250 230, 200 240 C 150 250, 80 230, 50 180 Z" fill="#e8edf5" stroke="#333" stroke-width="2"/>

  <!-- Label M -->
  <text x="90" y="240" font-family="serif" font-style="italic" font-size="22" fill="#333">M</text>

  <!-- Open set U around point p (small ellipse) -->
  <ellipse cx="180" cy="140" rx="45" ry="35" fill="#ffe8b0" fill-opacity="0.5" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Point p -->
  <circle cx="180" cy="140" r="4" fill="#333"/>
  <text x="168" y="162" font-family="serif" font-style="italic" font-size="16" fill="#333">p</text>

  <!-- U label -->
  <text x="200" y="120" font-family="serif" font-style="italic" font-size="16" fill="#b8860b">U</text>

  <!-- Arrow phi from U to phi(U) -->
  <path d="M 225 130 C 260 110, 290 90, 310 100" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#mArr)"/>
  <text x="270" y="95" font-family="serif" font-style="italic" font-size="18" fill="#333">φ</text>

  <!-- R^n as a flat rectangle -->
  <rect x="310" y="60" width="120" height="100" fill="#f8f8f8" stroke="#333" stroke-width="1.5" rx="2"/>

  <!-- phi(U) as a blob inside R^n -->
  <ellipse cx="370" cy="115" rx="40" ry="30" fill="#ffe8b0" fill-opacity="0.4" stroke="#b8860b" stroke-width="1.5"/>

  <!-- phi(U) label -->
  <text x="355" y="120" font-family="serif" font-style="italic" font-size="14" fill="#b8860b">φ(<tspan font-style="italic">U</tspan>)</text>

  <!-- R^n label -->
  <text x="395" y="80" font-family="serif" font-size="16" fill="#333">R<tspan font-size="11" baseline-shift="super" font-style="italic">n</tspan></text>

  <!-- Grid lines in R^n to suggest Euclidean space -->
  <line x1="310" y1="90" x2="430" y2="90" stroke="#ddd" stroke-width="0.8"/>
  <line x1="310" y1="120" x2="430" y2="120" stroke="#ddd" stroke-width="0.8"/>
  <line x1="310" y1="150" x2="430" y2="150" stroke="#ddd" stroke-width="0.8"/>
  <line x1="340" y1="60" x2="340" y2="160" stroke="#ddd" stroke-width="0.8"/>
  <line x1="370" y1="60" x2="370" y2="160" stroke="#ddd" stroke-width="0.8"/>
  <line x1="400" y1="60" x2="400" y2="160" stroke="#ddd" stroke-width="0.8"/>

  <!-- phi(p) point -->
  <circle cx="370" cy="115" r="3" fill="#333"/>

  <!-- "homeomorphism" label -->
  <text x="280" y="150" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">homeomorphism</text>

  <!-- Title -->
  <text x="225" y="320" font-family="serif" font-size="15" fill="#333" text-anchor="middle">Local Euclidean Property of a Topological Manifold</text>
</svg>