<svg xmlns="http://www.w3.org/2000/svg" width="550" height="300" viewBox="0 0 550 300">
  <rect width="550" height="300" fill="white"/>
  <defs>
    <marker id="mArr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#333" stroke-width="1"/>
    </marker>
    <marker id="mArrBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#2266cc" stroke-width="1.2"/>
    </marker>
    <marker id="mArrRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#cc3333" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="160" y="25" font-family="serif" font-size="18" fill="#333" font-weight="bold">Musical Isomorphisms</text>

  <!-- LEFT SIDE: flat map v -> v^flat -->
  <text x="70" y="55" font-family="serif" font-size="16" fill="#333" font-weight="bold">Flat  ♭</text>

  <!-- Vector v (arrow) -->
  <g transform="translate(50,120)">
    <line x1="0" y1="0" x2="70" y2="-30" stroke="#2266cc" stroke-width="3" marker-end="url(#mArrBlue)"/>
    <text x="30" y="-35" font-family="serif" font-style="italic" font-size="18" fill="#2266cc" font-weight="bold">v</text>
    <text x="-5" y="20" font-family="serif" font-size="12" fill="#666">(vector)</text>
  </g>

  <!-- Flat arrow -->
  <g transform="translate(140,100)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#333" stroke-width="2" marker-end="url(#mArr)"/>
    <text x="8" y="-8" font-family="serif" font-size="20" fill="#333">♭</text>
  </g>

  <!-- Covector v^flat (stack of lines) -->
  <g transform="translate(200,80)">
    <line x1="0" y1="0" x2="50" y2="25" stroke="#cc3333" stroke-width="1.5"/>
    <line x1="8" y1="-10" x2="58" y2="15" stroke="#cc3333" stroke-width="1.5"/>
    <line x1="16" y1="-20" x2="66" y2="5" stroke="#cc3333" stroke-width="1.5"/>
    <line x1="24" y1="-30" x2="74" y2="-5" stroke="#cc3333" stroke-width="1.5"/>
    <line x1="32" y1="-40" x2="82" y2="-15" stroke="#cc3333" stroke-width="1.5"/>
    <text x="25" y="45" font-family="serif" font-style="italic" font-size="16" fill="#cc3333">v</text>
    <text x="33" y="45" font-family="serif" font-size="16" fill="#cc3333">♭</text>
    <text x="15" y="60" font-family="serif" font-size="12" fill="#666">(covector)</text>
  </g>

  <!-- Divider -->
  <line x1="275" y1="40" x2="275" y2="260" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- RIGHT SIDE: sharp map omega -> omega^sharp -->
  <text x="350" y="55" font-family="serif" font-size="16" fill="#333" font-weight="bold">Sharp  ♯</text>

  <!-- Covector omega (stack of lines) -->
  <g transform="translate(310,80)">
    <line x1="0" y1="0" x2="45" y2="30" stroke="#cc3333" stroke-width="1.5"/>
    <line x1="10" y1="-10" x2="55" y2="20" stroke="#cc3333" stroke-width="1.5"/>
    <line x1="20" y1="-20" x2="65" y2="10" stroke="#cc3333" stroke-width="1.5"/>
    <line x1="30" y1="-30" x2="75" y2="0" stroke="#cc3333" stroke-width="1.5"/>
    <line x1="40" y1="-40" x2="85" y2="-10" stroke="#cc3333" stroke-width="1.5"/>
    <text x="25" y="50" font-family="serif" font-style="italic" font-size="16" fill="#cc3333">ω</text>
    <text x="5" y="65" font-family="serif" font-size="12" fill="#666">(covector)</text>
  </g>

  <!-- Sharp arrow -->
  <g transform="translate(405,100)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#333" stroke-width="2" marker-end="url(#mArr)"/>
    <text x="8" y="-8" font-family="serif" font-size="20" fill="#333">♯</text>
  </g>

  <!-- Vector omega^sharp (arrow) -->
  <g transform="translate(455,120)">
    <line x1="0" y1="0" x2="60" y2="-25" stroke="#2266cc" stroke-width="3" marker-end="url(#mArrBlue)"/>
    <text x="20" y="-30" font-family="serif" font-style="italic" font-size="16" fill="#2266cc">ω</text>
    <text x="34" y="-30" font-family="serif" font-size="16" fill="#2266cc">♯</text>
    <text x="5" y="20" font-family="serif" font-size="12" fill="#666">(vector)</text>
  </g>

  <!-- Metric g as mediating object -->
  <rect x="200" y="200" rx="10" ry="10" width="150" height="50" fill="#f0f0e0" stroke="#999" stroke-width="1.5"/>
  <text x="230" y="232" font-family="serif" font-size="18" fill="#333">Metric </text>
  <text x="295" y="232" font-family="serif" font-style="italic" font-size="20" fill="#333" font-weight="bold">g</text>

  <!-- Arrows from g to both maps -->
  <line x1="240" y1="200" x2="155" y2="110" stroke="#999" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#mArr)"/>
  <line x1="310" y1="200" x2="420" y2="110" stroke="#999" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#mArr)"/>

  <!-- Formulas -->
  <text x="50" y="280" font-family="serif" font-style="italic" font-size="13" fill="#555">v</text>
  <text x="58" y="280" font-family="serif" font-size="13" fill="#555">♭(w) = g(v, w)</text>
  <text x="330" y="280" font-family="serif" font-style="italic" font-size="13" fill="#555">g(ω</text>
  <text x="354" y="280" font-family="serif" font-size="13" fill="#555">♯, w) = ω(w)</text>
</svg>