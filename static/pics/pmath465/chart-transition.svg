<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450">
  <defs>
    <!-- Blob clip for manifold -->
    <clipPath id="manifoldClip">
      <path d="M200,60 C260,30 370,25 420,55 C470,85 480,120 460,150 C440,180 370,190 310,185 C250,180 190,170 170,140 C150,110 150,85 200,60Z"/>
    </clipPath>
    <!-- Arrowhead marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#333">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="white"/>

  <!-- ==================== MANIFOLD M ==================== -->

  <!-- Manifold blob outline (drawn first as background) -->
  <path d="M200,60 C260,30 370,25 420,55 C470,85 480,120 460,150 C440,180 370,190 310,185 C250,180 190,170 170,140 C150,110 150,85 200,60Z"
        fill="#f5f5f5" stroke="#333" stroke-width="2"/>

  <!-- U_alpha region (blue, left-biased ellipse on manifold) -->
  <ellipse cx="290" cy="115" rx="95" ry="60"
           fill="rgba(70,130,220,0.25)" stroke="rgba(70,130,220,0.7)" stroke-width="1.5"
           clip-path="url(#manifoldClip)"/>

  <!-- U_beta region (orange/red, right-biased ellipse on manifold) -->
  <ellipse cx="370" cy="115" rx="90" ry="55"
           fill="rgba(220,100,50,0.25)" stroke="rgba(220,100,50,0.7)" stroke-width="1.5"
           clip-path="url(#manifoldClip)"/>

  <!-- Overlap region U_alpha ∩ U_beta (purple, intersection area) -->
  <clipPath id="clipAlpha">
    <ellipse cx="290" cy="115" rx="95" ry="60"/>
  </clipPath>
  <ellipse cx="370" cy="115" rx="90" ry="55"
           fill="rgba(140,60,180,0.3)" stroke="none"
           clip-path="url(#clipAlpha)"/>

  <!-- Re-draw manifold outline on top -->
  <path d="M200,60 C260,30 370,25 420,55 C470,85 480,120 460,150 C440,180 370,190 310,185 C250,180 190,170 170,140 C150,110 150,85 200,60Z"
        fill="none" stroke="#333" stroke-width="2"/>

  <!-- Labels on manifold -->
  <text x="440" y="50" font-family="serif" font-size="18" font-style="italic" fill="#333">M</text>
  <text x="230" y="95" font-family="serif" font-size="14" font-style="italic" fill="rgba(40,90,180,1)">U</text>
  <text x="244" y="99" font-family="serif" font-size="10" fill="rgba(40,90,180,1)">&#x03B1;</text>
  <text x="395" y="95" font-family="serif" font-size="14" font-style="italic" fill="rgba(190,70,30,1)">U</text>
  <text x="409" y="99" font-family="serif" font-size="10" fill="rgba(190,70,30,1)">&#x03B2;</text>

  <!-- Overlap label -->
  <text x="315" y="140" font-family="serif" font-size="11" font-style="italic" fill="rgba(110,30,150,1)" text-anchor="middle">U</text>
  <text x="323" y="144" font-family="serif" font-size="8" fill="rgba(110,30,150,1)">&#x03B1;</text>
  <text x="329" y="140" font-family="serif" font-size="11" fill="rgba(110,30,150,1)" text-anchor="middle">&#x2229;</text>
  <text x="340" y="140" font-family="serif" font-size="11" font-style="italic" fill="rgba(110,30,150,1)">U</text>
  <text x="352" y="144" font-family="serif" font-size="8" fill="rgba(110,30,150,1)">&#x03B2;</text>

  <!-- ==================== R^n PLANES ==================== -->

  <!-- Left R^n plane: phi_alpha(U_alpha) -->
  <rect x="30" y="290" width="180" height="130" fill="#fafafa" stroke="#333" stroke-width="1.5" rx="3"/>
  <!-- Grid lines for coordinate feel -->
  <line x1="30" y1="330" x2="210" y2="330" stroke="#ddd" stroke-width="0.5"/>
  <line x1="30" y1="370" x2="210" y2="370" stroke="#ddd" stroke-width="0.5"/>
  <line x1="90" y1="290" x2="90" y2="420" stroke="#ddd" stroke-width="0.5"/>
  <line x1="150" y1="290" x2="150" y2="420" stroke="#ddd" stroke-width="0.5"/>

  <!-- Highlighted image of U_alpha (blue region) -->
  <ellipse cx="120" cy="355" rx="70" ry="50"
           fill="rgba(70,130,220,0.2)" stroke="rgba(70,130,220,0.6)" stroke-width="1.2"/>

  <!-- Highlighted overlap image in left plane (purple) -->
  <ellipse cx="155" cy="350" rx="35" ry="35"
           fill="rgba(140,60,180,0.25)" stroke="rgba(140,60,180,0.5)" stroke-width="1.2" stroke-dasharray="4,2"/>

  <!-- Left plane label -->
  <text x="120" y="440" font-family="serif" font-size="14" text-anchor="middle" fill="#333">&#x211D;</text>
  <text x="132" y="434" font-family="serif" font-size="10" font-style="italic" fill="#333">n</text>

  <!-- Right R^n plane: phi_beta(U_beta) -->
  <rect x="390" y="290" width="180" height="130" fill="#fafafa" stroke="#333" stroke-width="1.5" rx="3"/>
  <!-- Grid lines -->
  <line x1="390" y1="330" x2="570" y2="330" stroke="#ddd" stroke-width="0.5"/>
  <line x1="390" y1="370" x2="570" y2="370" stroke="#ddd" stroke-width="0.5"/>
  <line x1="450" y1="290" x2="450" y2="420" stroke="#ddd" stroke-width="0.5"/>
  <line x1="510" y1="290" x2="510" y2="420" stroke="#ddd" stroke-width="0.5"/>

  <!-- Highlighted image of U_beta (orange region) -->
  <ellipse cx="480" cy="355" rx="65" ry="48"
           fill="rgba(220,100,50,0.2)" stroke="rgba(220,100,50,0.6)" stroke-width="1.2"/>

  <!-- Highlighted overlap image in right plane (purple) -->
  <ellipse cx="445" cy="350" rx="35" ry="35"
           fill="rgba(140,60,180,0.25)" stroke="rgba(140,60,180,0.5)" stroke-width="1.2" stroke-dasharray="4,2"/>

  <!-- Right plane label -->
  <text x="480" y="440" font-family="serif" font-size="14" text-anchor="middle" fill="#333">&#x211D;</text>
  <text x="492" y="434" font-family="serif" font-size="10" font-style="italic" fill="#333">n</text>

  <!-- ==================== ARROWS ==================== -->

  <!-- Arrow from U_alpha down to left R^n plane -->
  <path d="M260,170 C230,220 160,260 130,285"
        fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- phi_alpha label -->
  <text x="172" y="225" font-family="serif" font-size="15" font-style="italic" fill="#333">&#x03C6;</text>
  <text x="184" y="229" font-family="serif" font-size="10" fill="#333">&#x03B1;</text>

  <!-- Arrow from U_beta down to right R^n plane -->
  <path d="M390,170 C420,220 460,260 475,285"
        fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- phi_beta label -->
  <text x="425" y="225" font-family="serif" font-size="15" font-style="italic" fill="#333">&#x03C6;</text>
  <text x="437" y="229" font-family="serif" font-size="10" fill="#333">&#x03B2;</text>

  <!-- Horizontal transition map arrow between the two R^n copies -->
  <line x1="215" y1="355" x2="385" y2="355"
        stroke="#333" stroke-width="1.8" marker-end="url(#arrowhead)"/>

  <!-- Transition map label: phi_beta^{-1} composed with phi_alpha -->
  <text x="300" y="345" font-family="serif" font-size="13" text-anchor="middle" fill="#333">
    <tspan font-style="italic">&#x03C6;</tspan><tspan font-size="9" dy="4">&#x03B1;</tspan><tspan dy="-4"> &#x2218; </tspan><tspan font-style="italic">&#x03C6;</tspan><tspan font-size="9" dy="4">&#x03B2;</tspan><tspan font-size="9" dy="-8">&#x2212;1</tspan>
  </text>

  <!-- Small labels for the image regions -->
  <text x="120" y="310" font-family="serif" font-size="11" font-style="italic" text-anchor="middle" fill="rgba(40,90,180,0.9)">&#x03C6;</text>
  <text x="130" y="314" font-family="serif" font-size="8" fill="rgba(40,90,180,0.9)">&#x03B1;</text>
  <text x="137" y="310" font-family="serif" font-size="11" fill="rgba(40,90,180,0.9)">(</text>
  <text x="141" y="310" font-family="serif" font-size="11" font-style="italic" fill="rgba(40,90,180,0.9)">U</text>
  <text x="153" y="314" font-family="serif" font-size="8" fill="rgba(40,90,180,0.9)">&#x03B1;</text>
  <text x="160" y="310" font-family="serif" font-size="11" fill="rgba(40,90,180,0.9)">)</text>

  <text x="480" y="310" font-family="serif" font-size="11" font-style="italic" text-anchor="middle" fill="rgba(190,70,30,0.9)">&#x03C6;</text>
  <text x="490" y="314" font-family="serif" font-size="8" fill="rgba(190,70,30,0.9)">&#x03B2;</text>
  <text x="497" y="310" font-family="serif" font-size="11" fill="rgba(190,70,30,0.9)">(</text>
  <text x="501" y="310" font-family="serif" font-size="11" font-style="italic" fill="rgba(190,70,30,0.9)">U</text>
  <text x="513" y="314" font-family="serif" font-size="8" fill="rgba(190,70,30,0.9)">&#x03B2;</text>
  <text x="520" y="310" font-family="serif" font-size="11" fill="rgba(190,70,30,0.9)">)</text>
</svg>