<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350">
  <rect width="600" height="350" fill="white"/>
  <defs>
    <marker id="aV" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="none" stroke="#2255aa" stroke-width="1"/>
    </marker>
    <marker id="aW" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="none" stroke="#cc3333" stroke-width="1"/>
    </marker>
    <marker id="aG" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="none" stroke="#228833" stroke-width="1"/>
    </marker>
  </defs>

  <text x="300" y="25" text-anchor="middle" font-family="serif" font-size="15" font-weight="bold" fill="#222">Commuting vs Non-Commuting Flows</text>

  <!-- (a) Commuting: [V,W] = 0 -->
  <text x="150" y="50" text-anchor="middle" font-family="serif" font-size="14" fill="#333" font-weight="bold">(a) [V, W] = 0</text>

  <!-- Closed rectangle -->
  <!-- p -->
  <circle cx="60" cy="250" r="4" fill="#333"/>
  <text x="48" y="268" font-family="serif" font-size="14" fill="#333" font-style="italic">p</text>

  <!-- p -> flow V for epsilon -> A -->
  <line x1="60" y1="250" x2="200" y2="210" stroke="#2255aa" stroke-width="2.5" marker-end="url(#aV)"/>
  <text x="120" y="218" font-family="serif" font-size="13" fill="#2255aa" font-style="italic">V</text>
  <text x="145" y="242" font-family="serif" font-size="12" fill="#2255aa" font-style="italic">&epsilon;</text>
  <circle cx="210" cy="207" r="4" fill="#333"/>

  <!-- A -> flow W for epsilon -> B (top-right) -->
  <line x1="210" y1="207" x2="240" y2="110" stroke="#cc3333" stroke-width="2.5" marker-end="url(#aW)"/>
  <text x="232" y="150" font-family="serif" font-size="13" fill="#cc3333" font-style="italic">W</text>
  <text x="218" y="150" font-family="serif" font-size="12" fill="#cc3333" font-style="italic">&epsilon;</text>
  <circle cx="245" cy="105" r="4" fill="#333"/>

  <!-- p -> flow W for epsilon -> C -->
  <line x1="60" y1="250" x2="90" y2="153" stroke="#cc3333" stroke-width="2.5" marker-end="url(#aW)"/>
  <text x="62" y="195" font-family="serif" font-size="13" fill="#cc3333" font-style="italic">W</text>
  <text x="82" y="195" font-family="serif" font-size="12" fill="#cc3333" font-style="italic">&epsilon;</text>
  <circle cx="95" cy="148" r="4" fill="#333"/>

  <!-- C -> flow V for epsilon -> B (same point!) -->
  <line x1="95" y1="148" x2="235" y2="108" stroke="#2255aa" stroke-width="2.5" marker-end="url(#aV)"/>
  <text x="160" y="118" font-family="serif" font-size="13" fill="#2255aa" font-style="italic">V</text>
  <text x="175" y="140" font-family="serif" font-size="12" fill="#2255aa" font-style="italic">&epsilon;</text>

  <!-- Label: same endpoint -->
  <text x="260" y="100" font-family="serif" font-size="12" fill="#228833" font-weight="bold">same point!</text>

  <!-- Divider -->
  <line x1="300" y1="45" x2="300" y2="340" stroke="#ccc" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- (b) Non-commuting: [V,W] != 0 -->
  <text x="450" y="50" text-anchor="middle" font-family="serif" font-size="14" fill="#333" font-weight="bold">(b) [V, W] &ne; 0</text>

  <!-- p -->
  <circle cx="340" cy="250" r="4" fill="#333"/>
  <text x="328" y="268" font-family="serif" font-size="14" fill="#333" font-style="italic">p</text>

  <!-- Path 1: p -> V -> W -->
  <line x1="340" y1="250" x2="480" y2="210" stroke="#2255aa" stroke-width="2.5" marker-end="url(#aV)"/>
  <text x="400" y="218" font-family="serif" font-size="13" fill="#2255aa" font-style="italic">V</text>
  <circle cx="490" cy="207" r="3" fill="#333"/>

  <line x1="490" y1="207" x2="520" y2="110" stroke="#cc3333" stroke-width="2.5" marker-end="url(#aW)"/>
  <text x="512" y="155" font-family="serif" font-size="13" fill="#cc3333" font-style="italic">W</text>
  <circle cx="525" cy="105" r="4" fill="#2255aa"/>
  <text x="532" y="100" font-family="serif" font-size="11" fill="#2255aa">q</text>
  <text x="541" y="104" font-family="serif" font-size="8" fill="#2255aa">1</text>

  <!-- Path 2: p -> W -> V -->
  <line x1="340" y1="250" x2="370" y2="153" stroke="#cc3333" stroke-width="2.5" marker-end="url(#aW)"/>
  <text x="343" y="195" font-family="serif" font-size="13" fill="#cc3333" font-style="italic">W</text>
  <circle cx="375" cy="148" r="3" fill="#333"/>

  <line x1="375" y1="148" x2="510" y2="120" stroke="#2255aa" stroke-width="2.5" marker-end="url(#aV)"/>
  <text x="440" y="125" font-family="serif" font-size="13" fill="#2255aa" font-style="italic">V</text>
  <circle cx="520" cy="117" r="4" fill="#cc3333"/>
  <text x="528" y="125" font-family="serif" font-size="11" fill="#cc3333">q</text>
  <text x="537" y="129" font-family="serif" font-size="8" fill="#cc3333">2</text>

  <!-- Gap arrow -->
  <line x1="525" y1="105" x2="520" y2="117" stroke="#228833" stroke-width="2.5" marker-end="url(#aG)"/>

  <!-- Gap label -->
  <text x="420" y="290" text-anchor="middle" font-family="serif" font-size="13" fill="#228833">gap &asymp; &epsilon;</text>
  <text x="450" y="294" font-family="serif" font-size="9" fill="#228833">2</text>
  <text x="456" y="290" font-family="serif" font-size="13" fill="#228833">[</text>
  <text x="462" y="290" font-family="serif" font-size="13" fill="#228833" font-style="italic">V</text>
  <text x="472" y="290" font-family="serif" font-size="13" fill="#228833">,</text>
  <text x="478" y="290" font-family="serif" font-size="13" fill="#228833" font-style="italic">W</text>
  <text x="490" y="290" font-family="serif" font-size="13" fill="#228833">]</text>

  <!-- Bracket pointing to gap -->
  <line x1="523" y1="105" x2="490" y2="280" stroke="#228833" stroke-width="1" stroke-dasharray="3,3"/>
</svg>