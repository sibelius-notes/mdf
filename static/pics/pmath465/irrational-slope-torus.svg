<svg xmlns="http://www.w3.org/2000/svg" width="450" height="400" viewBox="0 0 450 400">
  <rect width="450" height="400" fill="white"/>
  <defs>
    <clipPath id="torusClip">
      <ellipse cx="225" cy="180" rx="180" ry="120"/>
    </clipPath>
  </defs>

  <!-- Torus body: outer ellipse -->
  <ellipse cx="225" cy="180" rx="180" ry="120" fill="#f5f0ff" stroke="#333" stroke-width="2"/>

  <!-- Inner hole of torus (approximated as an ellipse) -->
  <ellipse cx="225" cy="180" rx="60" ry="35" fill="white" stroke="#333" stroke-width="2"/>

  <!-- 3D effect: bottom arc of the hole (in front) -->
  <path d="M 165,185 Q 195,210 225,215 Q 255,210 285,185" fill="none" stroke="#333" stroke-width="2"/>
  <!-- Top arc of hole (behind, dashed) -->
  <path d="M 165,175 Q 195,150 225,145 Q 255,150 285,175" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Dense winding curve (irrational slope line on torus) -->
  <!-- Multiple wrapping lines to suggest dense winding -->
  <g clip-path="url(#torusClip)">
    <!-- Winding lines - these wrap around suggesting the dense curve -->
    <path d="M 45,160 Q 100,100 160,130 Q 200,145 225,155 Q 260,130 300,110 Q 360,100 405,160"
          fill="none" stroke="#CC4444" stroke-width="1.3" opacity="0.8"/>
    <path d="M 50,190 Q 110,130 170,155 Q 210,168 225,175 Q 260,155 310,140 Q 370,130 400,185"
          fill="none" stroke="#CC4444" stroke-width="1.3" opacity="0.8"/>
    <path d="M 55,220 Q 120,160 175,180 Q 215,192 225,195 Q 265,180 320,165 Q 375,155 395,210"
          fill="none" stroke="#CC4444" stroke-width="1.3" opacity="0.8"/>
    <path d="M 65,245 Q 130,190 180,205 Q 215,215 225,218 Q 270,205 325,195 Q 370,190 385,235"
          fill="none" stroke="#CC4444" stroke-width="1.3" opacity="0.8"/>
    <path d="M 80,265 Q 140,215 185,228 Q 215,238 230,240 Q 270,230 330,220 Q 370,215 375,255"
          fill="none" stroke="#CC4444" stroke-width="1.3" opacity="0.7"/>
    <path d="M 100,280 Q 160,240 195,248 Q 220,255 235,255 Q 275,248 335,240 Q 365,235 365,270"
          fill="none" stroke="#CC4444" stroke-width="1.3" opacity="0.6"/>
    <path d="M 45,145 Q 95,85 155,115 Q 198,132 222,140 Q 258,118 298,98 Q 355,85 405,145"
          fill="none" stroke="#CC4444" stroke-width="1.3" opacity="0.7"/>
    <path d="M 48,175 Q 105,115 165,142 Q 205,156 224,165 Q 258,142 305,125 Q 365,115 402,172"
          fill="none" stroke="#CC4444" stroke-width="1.3" opacity="0.75"/>
    <path d="M 52,205 Q 115,148 172,168 Q 210,180 224,185 Q 262,168 315,153 Q 372,143 398,198"
          fill="none" stroke="#CC4444" stroke-width="1.3" opacity="0.75"/>
    <path d="M 58,232 Q 125,178 178,195 Q 212,206 226,210 Q 268,196 322,183 Q 370,175 390,225"
          fill="none" stroke="#CC4444" stroke-width="1.3" opacity="0.7"/>
  </g>

  <!-- Re-draw inner hole border to be on top -->
  <ellipse cx="225" cy="180" rx="60" ry="35" fill="white" stroke="#333" stroke-width="2"/>
  <path d="M 165,185 Q 195,210 225,215 Q 255,210 285,185" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M 165,175 Q 195,150 225,145 Q 255,150 285,175" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Torus label -->
  <text x="195" y="30" font-family="serif" font-size="20" fill="#333" font-style="italic">T</text>
  <text x="207" y="26" font-family="serif" font-size="14" fill="#333" baseline-shift="super">2</text>

  <!-- Curve label -->
  <text x="360" y="155" font-family="serif" font-size="16" fill="#CC4444" font-style="italic">γ</text>

  <!-- Caption -->
  <text x="45" y="345" font-family="serif" font-size="14" fill="#333">Injective immersion, dense image,</text>
  <text x="45" y="368" font-family="serif" font-size="14" fill="#333">not an embedding.</text>

  <!-- Slope note -->
  <text x="45" y="392" font-family="serif" font-size="13" fill="#888">Line of irrational slope on the torus</text>
</svg>