<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <rect width="500" height="400" fill="white"/>
  <defs>
    <marker id="rlsArr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0,0 L 8,3 L 0,6" fill="none" stroke="#CC4444" stroke-width="1.2"/>
    </marker>
    <marker id="rlsBlk" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0,0 L 8,3 L 0,6" fill="none" stroke="#333" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- 3D-ish coordinate box for M (R^3) -->
  <!-- Back face -->
  <path d="M 50,80 L 350,80 L 400,40 L 100,40 Z" fill="#f8f8ff" stroke="#ccc" stroke-width="1"/>
  <!-- Left face -->
  <path d="M 50,80 L 50,320 L 100,280 L 100,40 Z" fill="#f0f0ff" stroke="#ccc" stroke-width="1"/>
  <!-- Bottom face -->
  <path d="M 50,320 L 350,320 L 400,280 L 100,280 Z" fill="#eeeeff" stroke="#ccc" stroke-width="1"/>
  <!-- Front face -->
  <path d="M 50,80 L 350,80 L 350,320 L 50,320 Z" fill="none" stroke="#999" stroke-width="1.5"/>

  <!-- M label -->
  <text x="380" y="35" font-family="serif" font-size="20" font-style="italic" fill="#333">M</text>

  <!-- Level set S = F^{-1}(c) as an elliptical surface inside -->
  <ellipse cx="220" cy="200" rx="120" ry="60" fill="rgba(68,119,204,0.15)" stroke="#4477CC" stroke-width="2.5" transform="rotate(-5,220,200)"/>

  <!-- Label S -->
  <text x="310" y="170" font-family="serif" font-size="18" fill="#4477CC" font-style="italic">S = F</text>
  <text x="350" y="170" font-family="serif" font-size="12" fill="#4477CC" baseline-shift="super">-1</text>
  <text x="363" y="170" font-family="serif" font-size="18" fill="#4477CC">(</text>
  <text x="370" y="170" font-family="serif" font-size="18" fill="#4477CC" font-style="italic">c</text>
  <text x="380" y="170" font-family="serif" font-size="18" fill="#4477CC">)</text>

  <!-- Point p on S -->
  <circle cx="220" cy="200" r="5" fill="#CC4444"/>
  <text x="228" y="218" font-family="serif" font-size="16" font-style="italic" fill="#CC4444">p</text>

  <!-- Tangent plane T_pS (shown as a parallelogram at p, tangent to S) -->
  <path d="M 160,180 L 280,180 L 290,220 L 170,220 Z" fill="rgba(51,153,68,0.12)" stroke="#339944" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Label T_pS -->
  <text x="245" y="230" font-family="serif" font-size="14" fill="#339944" font-style="italic">T</text>
  <text x="254" y="234" font-family="serif" font-size="10" fill="#339944" font-style="italic">p</text>
  <text x="262" y="230" font-family="serif" font-size="14" fill="#339944" font-style="italic">S</text>
  <text x="275" y="230" font-family="serif" font-size="12" fill="#339944"> = ker(F</text>
  <text x="325" y="233" font-family="serif" font-size="9" fill="#339944">*</text>
  <text x="332" y="230" font-family="serif" font-size="12" fill="#339944">)</text>

  <!-- Gradient nabla F (perpendicular to tangent plane, pointing up-ish) -->
  <line x1="220" y1="200" x2="220" y2="120" stroke="#CC4444" stroke-width="2.5" marker-end="url(#rlsArr)"/>
  <text x="225" y="115" font-family="serif" font-size="14" fill="#CC4444">&#x2207;F</text>

  <!-- F arrow going to R on the right side -->
  <!-- Value line for R -->
  <line x1="440" y1="80" x2="440" y2="320" stroke="#888" stroke-width="1.5"/>
  <text x="448" y="75" font-family="serif" font-size="16" fill="#888">R</text>

  <!-- Mark c on the R line -->
  <line x1="435" y1="200" x2="445" y2="200" stroke="#CC4444" stroke-width="2"/>
  <text x="450" y="205" font-family="serif" font-size="15" font-style="italic" fill="#CC4444">c</text>

  <!-- Arrow from S to c -->
  <path d="M 340,195 Q 390,195 432,200" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#rlsBlk)"/>
  <text x="370" y="188" font-family="serif" font-size="16" font-style="italic" fill="#333">F</text>

  <!-- "regular value" label -->
  <text x="440" y="230" font-family="serif" font-size="11" fill="#888">(regular</text>
  <text x="440" y="244" font-family="serif" font-size="11" fill="#888"> value)</text>
</svg>