<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <rect width="600" height="300" fill="white"/>

  <!-- Dividing line -->
  <line x1="300" y1="30" x2="300" y2="270" stroke="#ddd" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- === Left: Embedded === -->
  <text x="75" y="30" font-family="serif" font-size="16" fill="#333" font-weight="bold">(a) Embedded</text>

  <!-- R^2 background -->
  <rect x="20" y="50" width="250" height="210" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="5"/>
  <text x="240" y="68" font-family="serif" font-size="13" fill="#aaa">R</text>
  <text x="250" y="64" font-family="serif" font-size="10" fill="#aaa" baseline-shift="super">2</text>

  <!-- Clean smooth curve, no self-intersection -->
  <path d="M 50,200 Q 80,120 120,100 Q 170,80 200,130 Q 230,180 250,160"
        fill="none" stroke="#4477CC" stroke-width="3"/>

  <!-- Arrow showing direction -->
  <circle cx="120" cy="100" r="3" fill="#4477CC"/>
  <circle cx="200" cy="130" r="3" fill="#4477CC"/>

  <!-- Label -->
  <text x="65" y="270" font-family="serif" font-size="14" fill="#4477CC" font-style="italic">embedded submanifold</text>

  <!-- === Right: Immersed (not embedded) === -->
  <text x="340" y="30" font-family="serif" font-size="16" fill="#333" font-weight="bold">(b) Immersed (not embedded)</text>

  <!-- R^2 background -->
  <rect x="320" y="50" width="260" height="210" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="5"/>
  <text x="550" y="68" font-family="serif" font-size="13" fill="#aaa">R</text>
  <text x="560" y="64" font-family="serif" font-size="10" fill="#aaa" baseline-shift="super">2</text>

  <!-- Figure-eight -->
  <!-- Upper loop -->
  <path d="M 450,155 C 500,155 540,90 450,70 C 360,90 400,155 450,155"
        fill="none" stroke="#CC4444" stroke-width="3"/>
  <!-- Lower loop -->
  <path d="M 450,155 C 400,155 360,220 450,240 C 540,220 500,155 450,155"
        fill="none" stroke="#CC4444" stroke-width="3"/>

  <!-- Self-intersection highlight -->
  <circle cx="450" cy="155" r="8" fill="none" stroke="#CC4444" stroke-width="2.5"/>
  <circle cx="450" cy="155" r="3" fill="#CC4444"/>

  <!-- Arrow pointing to self-intersection -->
  <line x1="500" y1="170" x2="460" y2="160" stroke="#888" stroke-width="1"/>
  <text x="500" y="178" font-family="serif" font-size="12" fill="#888">self-intersection</text>

  <!-- Label -->
  <text x="345" y="270" font-family="serif" font-size="14" fill="#CC4444" font-style="italic">immersed, not embedded</text>
</svg>