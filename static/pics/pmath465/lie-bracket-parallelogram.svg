<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <rect width="500" height="400" fill="white"/>

  <defs>
    <marker id="aB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2255aa"/>
    </marker>
    <marker id="aR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#cc2222"/>
    </marker>
    <marker id="aG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#228833"/>
    </marker>
    <marker id="aK" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- Starting point p -->
  <circle cx="100" cy="300" r="5" fill="#333"/>
  <text x="82" y="318" font-family="serif" font-style="italic" font-size="20" fill="#333">p</text>

  <!-- Path 1: X then Y -->
  <!-- p -> q1 along X (blue) -->
  <line x1="100" y1="300" x2="290" y2="260" stroke="#2255aa" stroke-width="2.5" marker-end="url(#aB)"/>
  <circle cx="300" cy="258" r="4" fill="#2255aa"/>
  <text x="195" y="265" font-family="serif" font-style="italic" font-size="16" fill="#2255aa">X</text>
  <text x="310" y="258" font-family="serif" font-size="13" fill="#2255aa">q<tspan font-size="10" baseline-shift="sub">1</tspan></text>

  <!-- q1 -> r1 along Y (red) -->
  <line x1="300" y1="258" x2="370" y2="108" stroke="#cc2222" stroke-width="2.5" marker-end="url(#aR)"/>
  <circle cx="375" cy="100" r="4" fill="#cc2222"/>
  <text x="348" y="170" font-family="serif" font-style="italic" font-size="16" fill="#cc2222">Y</text>
  <text x="385" y="100" font-family="serif" font-size="13" fill="#cc2222">r<tspan font-size="10" baseline-shift="sub">1</tspan></text>

  <!-- Path 2: Y then X -->
  <!-- p -> q2 along Y (red, lighter) -->
  <line x1="100" y1="300" x2="155" y2="155" stroke="#cc2222" stroke-width="2.5" stroke-opacity="0.7" marker-end="url(#aR)"/>
  <circle cx="158" cy="148" r="4" fill="#cc2222"/>
  <text x="115" y="220" font-family="serif" font-style="italic" font-size="16" fill="#cc2222">Y</text>
  <text x="140" y="142" font-family="serif" font-size="13" fill="#cc2222">q<tspan font-size="10" baseline-shift="sub">2</tspan></text>

  <!-- q2 -> r2 along X (blue, lighter) -->
  <line x1="158" y1="148" x2="348" y2="108" stroke="#2255aa" stroke-width="2.5" stroke-opacity="0.7" marker-end="url(#aB)"/>
  <circle cx="355" cy="106" r="4" fill="#2255aa"/>
  <text x="250" y="115" font-family="serif" font-style="italic" font-size="16" fill="#2255aa">X</text>
  <text x="345" y="125" font-family="serif" font-size="13" fill="#2255aa">r<tspan font-size="10" baseline-shift="sub">2</tspan></text>

  <!-- Gap between r1 and r2 -->
  <line x1="357" y1="104" x2="373" y2="100" stroke="#228833" stroke-width="3" marker-end="url(#aG)" stroke-dasharray="4,2"/>

  <!-- Gap label -->
  <text x="390" y="70" font-family="serif" font-style="italic" font-size="16" fill="#228833">&amp;#x03B5;<tspan font-size="13" baseline-shift="super">2</tspan>[<tspan font-style="italic">X</tspan>, <tspan font-style="italic">Y</tspan>]</text>
  <path d="M 388 73 L 378 90" fill="none" stroke="#228833" stroke-width="1" marker-end="url(#aG)"/>

  <!-- Dashed "ideal" closing edges -->
  <line x1="300" y1="258" x2="355" y2="106" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="158" y1="148" x2="375" y2="100" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- Title -->
  <text x="250" y="30" font-family="serif" font-size="16" fill="#333" text-anchor="middle">Lie Bracket: Failure of Flows to Commute</text>

  <!-- Epsilon labels on edges -->
  <text x="185" y="293" font-family="serif" font-style="italic" font-size="13" fill="#555">&amp;#x03B5;</text>
  <text x="118" y="235" font-family="serif" font-style="italic" font-size="13" fill="#555">&amp;#x03B5;</text>
</svg>