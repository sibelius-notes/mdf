<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350" viewBox="0 0 500 350">
  <rect width="500" height="350" fill="white"/>

  <!-- S^n as a circle -->
  <circle cx="130" cy="130" r="80" fill="none" stroke="#333" stroke-width="2"/>

  <!-- North pole -->
  <circle cx="130" cy="50" r="4" fill="#cc3333"/>
  <text x="145" y="48" font-family="serif" font-size="14" font-style="italic" fill="#cc3333">N</text>

  <!-- South pole -->
  <circle cx="130" cy="210" r="4" fill="#3333cc"/>
  <text x="145" y="218" font-family="serif" font-size="14" font-style="italic" fill="#3333cc">S</text>

  <!-- S^n label -->
  <text x="130" y="130" text-anchor="middle" font-family="serif" font-size="18" font-style="italic" fill="#333">S</text>
  <text x="140" y="122" font-family="serif" font-size="12" font-style="italic" fill="#333">n</text>

  <!-- U region description -->
  <text x="260" y="45" font-family="serif" font-size="14" fill="#2266aa">
    <tspan font-style="italic">U</tspan> = <tspan font-style="italic">S</tspan><tspan font-size="10" dy="-4">n</tspan><tspan dy="4"> \ {</tspan><tspan font-style="italic" fill="#cc3333">N</tspan>}
  </text>
  <text x="260" y="65" font-family="serif" font-size="13" fill="#2266aa">
    &#x2243; <tspan font-style="italic">&#x211D;</tspan><tspan font-size="10" dy="-4">n</tspan><tspan dy="4"> (contractible)</tspan>
  </text>

  <!-- V region description -->
  <text x="260" y="105" font-family="serif" font-size="14" fill="#aa2266">
    <tspan font-style="italic">V</tspan> = <tspan font-style="italic">S</tspan><tspan font-size="10" dy="-4">n</tspan><tspan dy="4"> \ {</tspan><tspan font-style="italic" fill="#3333cc">S</tspan>}
  </text>
  <text x="260" y="125" font-family="serif" font-size="13" fill="#aa2266">
    &#x2243; <tspan font-style="italic">&#x211D;</tspan><tspan font-size="10" dy="-4">n</tspan><tspan dy="4"> (contractible)</tspan>
  </text>

  <!-- Intersection -->
  <text x="260" y="165" font-family="serif" font-size="14" fill="#663399">
    <tspan font-style="italic">U</tspan> &#x2229; <tspan font-style="italic">V</tspan> &#x2243; <tspan font-style="italic">S</tspan><tspan font-size="10" dy="-4">n&#x2212;1</tspan><tspan dy="4"> &#xD7; &#x211D;</tspan>
  </text>
  <text x="260" y="185" font-family="serif" font-size="13" fill="#663399">
    &#x2243; <tspan font-style="italic">S</tspan><tspan font-size="10" dy="-4">n&#x2212;1</tspan><tspan dy="4"> (equator belt)</tspan>
  </text>

  <!-- U shading on sphere: everything except N -->
  <path d="M 50 130 A 80 80 0 1 1 210 130 A 80 80 0 0 1 50 130" fill="rgba(100,150,220,0.15)" stroke="none"/>
  <!-- Small exclusion around N -->
  <circle cx="130" cy="50" r="10" fill="white" stroke="#cc3333" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Equator belt (U∩V) -->
  <path d="M 50 130 Q 90 145 130 148 Q 170 145 210 130 Q 170 115 130 112 Q 90 115 50 130" fill="rgba(150,80,180,0.2)" stroke="#663399" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Separator -->
  <line x1="30" y1="240" x2="470" y2="240" stroke="#ccc" stroke-width="1"/>

  <!-- Result box -->
  <rect x="50" y="255" width="400" height="75" rx="8" fill="#f5f5f0" stroke="#999" stroke-width="1.5"/>
  <text x="250" y="278" text-anchor="middle" font-family="serif" font-size="15" font-weight="bold" fill="#333">Result:</text>
  <text x="250" y="305" text-anchor="middle" font-family="serif" font-size="16" fill="#333">
    <tspan font-style="italic">H</tspan><tspan font-size="11" dy="-5">k</tspan><tspan dy="5">(</tspan><tspan font-style="italic">S</tspan><tspan font-size="11" dy="-5">n</tspan><tspan dy="5">) = </tspan>
  </text>
  <text x="250" y="305" text-anchor="middle" font-family="serif" font-size="16" fill="#333">
    <tspan dx="60">&#x211D;  if </tspan><tspan font-style="italic">k</tspan> = 0 or <tspan font-style="italic">k</tspan> = <tspan font-style="italic">n</tspan>;  0  otherwise
  </text>
</svg>