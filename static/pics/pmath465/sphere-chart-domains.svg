<svg xmlns="http://www.w3.org/2000/svg" width="450" height="400" viewBox="0 0 450 400">
  <rect width="450" height="400" fill="white"/>

  <defs>
    <clipPath id="sphereClip">
      <circle cx="225" cy="200" r="140"/>
    </clipPath>
  </defs>

  <!-- U_N region (everything except N): blue, covers bottom -->
  <circle cx="225" cy="200" r="140" fill="#cce0ff" fill-opacity="0.4" stroke="none"/>

  <!-- U_S region (everything except S): red, covers top -->
  <circle cx="225" cy="200" r="140" fill="#ffcccc" fill-opacity="0.4" stroke="none"/>

  <!-- Overlap region U_N cap U_S: the equatorial band (purple) -->
  <!-- This is the sphere minus both poles; visualized as the middle band -->
  <rect x="85" y="100" width="280" height="200" fill="#d8b0e8" fill-opacity="0.35" clip-path="url(#sphereClip)"/>

  <!-- Sphere outline -->
  <circle cx="225" cy="200" r="140" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Equator (dashed) -->
  <ellipse cx="225" cy="200" rx="140" ry="35" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- North pole N -->
  <circle cx="225" cy="60" r="5" fill="white" stroke="#333" stroke-width="2"/>
  <text x="245" y="55" font-family="serif" font-style="italic" font-size="18" fill="#333">N</text>

  <!-- South pole S -->
  <circle cx="225" cy="340" r="5" fill="white" stroke="#333" stroke-width="2"/>
  <text x="245" y="350" font-family="serif" font-style="italic" font-size="18" fill="#333">S</text>

  <!-- U_N label (blue) -->
  <text x="340" y="300" font-family="serif" font-style="italic" font-size="16" fill="#2255aa">U<tspan font-size="11" baseline-shift="sub">N</tspan></text>
  <text x="340" y="318" font-family="serif" font-size="12" fill="#2255aa">= S<tspan font-size="9" baseline-shift="super">2</tspan> \ {<tspan font-style="italic">N</tspan>}</text>

  <!-- U_S label (red) -->
  <text x="55" y="110" font-family="serif" font-style="italic" font-size="16" fill="#cc2222">U<tspan font-size="11" baseline-shift="sub">S</tspan></text>
  <text x="55" y="128" font-family="serif" font-size="12" fill="#cc2222">= S<tspan font-size="9" baseline-shift="super">2</tspan> \ {<tspan font-style="italic">S</tspan>}</text>

  <!-- Overlap label (purple) -->
  <text x="55" y="210" font-family="serif" font-style="italic" font-size="14" fill="#7733aa">U<tspan font-size="10" baseline-shift="sub">N</tspan> ∩ U<tspan font-size="10" baseline-shift="sub">S</tspan></text>

  <!-- Title -->
  <text x="225" y="25" font-family="serif" font-size="16" fill="#333" text-anchor="middle">Chart Domains on <tspan font-style="italic">S</tspan><tspan font-size="12" baseline-shift="super">2</tspan></text>

  <!-- S^2 label on sphere -->
  <text x="225" y="390" font-family="serif" font-style="italic" font-size="18" fill="#333" text-anchor="middle">S<tspan font-size="13" baseline-shift="super">2</tspan></text>
</svg>