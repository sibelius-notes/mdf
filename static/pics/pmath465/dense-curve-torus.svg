<svg xmlns="http://www.w3.org/2000/svg" width="450" height="400" viewBox="0 0 450 400">
  <rect width="450" height="400" fill="white"/>

  <defs>
    <!-- Clipping for the torus region -->
    <clipPath id="torusClip">
      <path d="M225,80 Q340,80 380,190 Q400,260 380,310 Q340,380 225,380 Q110,380 70,310 Q50,260 70,190 Q110,80 225,80Z"/>
    </clipPath>
  </defs>

  <!-- Torus outline - outer -->
  <ellipse cx="225" cy="220" rx="175" ry="150" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Torus hole (inner) -->
  <ellipse cx="225" cy="220" rx="60" ry="45" fill="white" stroke="#333" stroke-width="2"/>

  <!-- Torus shading -->
  <path d="M50,220 Q50,100 225,70 Q400,100 400,220 Q400,340 225,370 Q50,340 50,220Z" fill="#f5f0ff" fill-opacity="0.4" stroke="none"/>

  <!-- Top rim highlight -->
  <path d="M165,178 Q225,155 285,178" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Bottom rim -->
  <path d="M165,265 Q225,288 285,265" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Dense winding curve with irrational slope -->
  <!-- Multiple windings around the torus -->
  <g stroke="#c0392b" stroke-width="1.2" fill="none" opacity="0.8">
    <!-- Winding 1 -->
    <path d="M225,70 Q310,85 370,140 Q400,190 385,260 Q360,330 300,360 Q240,375 180,360 Q110,330 75,260 Q55,190 80,140 Q120,85 200,72"/>
    <!-- Winding 2 (slightly offset) -->
    <path d="M200,72 Q280,78 350,125 Q395,175 395,240 Q385,310 330,355 Q270,380 210,370 Q140,345 90,280 Q60,210 75,150 Q100,92 175,75"/>
    <!-- Winding 3 -->
    <path d="M175,75 Q255,72 335,110 Q385,158 398,225 Q395,295 355,345 Q300,378 235,378 Q170,370 115,325 Q70,265 60,195 Q62,130 110,90 Q150,72 160,78"/>
    <!-- Winding 4 -->
    <path d="M160,78 Q230,68 320,100 Q380,148 400,215 Q400,280 375,335 Q325,375 260,380 Q195,378 140,345 Q85,295 62,225 Q55,155 85,105 Q130,72 150,80"/>
    <!-- Winding 5 -->
    <path d="M150,80 Q215,66 310,92 Q370,135 395,200 Q405,265 385,325 Q345,370 280,382 Q215,382 155,358 Q100,315 70,245 Q52,175 72,115 Q108,76 145,82"/>
    <!-- Winding 6 -->
    <path d="M145,82 Q205,64 305,88 Q365,125 392,192 Q408,255 392,318 Q360,365 295,380 Q230,385 165,365 Q108,330 76,258 Q55,185 68,120 Q95,78 140,84"/>
    <!-- Winding 7 -->
    <path d="M140,84 Q195,62 298,82 Q358,115 388,185 Q410,248 398,312 Q370,360 310,378 Q245,388 178,372 Q118,340 82,270 Q58,198 65,128 Q88,80 138,86"/>
    <!-- Winding 8 -->
    <path d="M138,86 Q190,60 292,78 Q355,108 385,178 Q412,240 402,305 Q378,358 320,376 Q258,390 190,378 Q125,350 88,282 Q60,208 62,135 Q80,82 135,88"/>
  </g>

  <!-- Fill the hole white to clean up -->
  <ellipse cx="225" cy="220" rx="58" ry="43" fill="white" stroke="none"/>
  <ellipse cx="225" cy="220" rx="60" ry="45" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Labels -->
  <text x="210" y="225" font-family="serif" font-style="italic" font-size="16" fill="#333">T</text>
  <text x="222" y="218" font-family="serif" font-size="11" fill="#333">2</text>

  <!-- "dense image" label -->
  <text x="320" y="390" font-family="serif" font-size="13" fill="#c0392b">dense image</text>

  <!-- "irrational slope line" label -->
  <text x="260" y="55" font-family="serif" font-size="13" fill="#c0392b">irrational slope line</text>
</svg>