<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <rect width="600" height="200" fill="white"/>

  <!-- d^2 = 0 above -->
  <text x="300" y="22" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#cc3322">
    <tspan font-style="italic">d</tspan><tspan font-size="11" baseline-shift="super">2</tspan> = 0
  </text>

  <!-- Top row: general de Rham complex -->
  <g transform="translate(0, 55)">
    <!-- Omega^0 -->
    <rect x="20" y="-15" width="70" height="30" rx="5" fill="#e8eef8" stroke="#335" stroke-width="1.5"/>
    <text x="55" y="5" text-anchor="middle" font-family="serif" font-size="14" fill="#223">
      Ω<tspan font-size="10" baseline-shift="super">0</tspan>(<tspan font-style="italic">M</tspan>)
    </text>

    <!-- Arrow d -->
    <line x1="95" y1="0" x2="145" y2="0" stroke="#444" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="120" y="-8" text-anchor="middle" font-family="serif" font-size="14" font-style="italic" fill="#444">d</text>

    <!-- Omega^1 -->
    <rect x="150" y="-15" width="70" height="30" rx="5" fill="#e8eef8" stroke="#335" stroke-width="1.5"/>
    <text x="185" y="5" text-anchor="middle" font-family="serif" font-size="14" fill="#223">
      Ω<tspan font-size="10" baseline-shift="super">1</tspan>(<tspan font-style="italic">M</tspan>)
    </text>

    <!-- Arrow d -->
    <line x1="225" y1="0" x2="275" y2="0" stroke="#444" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="250" y="-8" text-anchor="middle" font-family="serif" font-size="14" font-style="italic" fill="#444">d</text>

    <!-- Omega^2 -->
    <rect x="280" y="-15" width="70" height="30" rx="5" fill="#e8eef8" stroke="#335" stroke-width="1.5"/>
    <text x="315" y="5" text-anchor="middle" font-family="serif" font-size="14" fill="#223">
      Ω<tspan font-size="10" baseline-shift="super">2</tspan>(<tspan font-style="italic">M</tspan>)
    </text>

    <!-- Arrow d -->
    <line x1="355" y1="0" x2="405" y2="0" stroke="#444" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="380" y="-8" text-anchor="middle" font-family="serif" font-size="14" font-style="italic" fill="#444">d</text>

    <!-- Omega^3 -->
    <rect x="410" y="-15" width="70" height="30" rx="5" fill="#e8eef8" stroke="#335" stroke-width="1.5"/>
    <text x="445" y="5" text-anchor="middle" font-family="serif" font-size="14" fill="#223">
      Ω<tspan font-size="10" baseline-shift="super">3</tspan>(<tspan font-style="italic">M</tspan>)
    </text>

    <!-- Arrow to dots -->
    <line x1="485" y1="0" x2="530" y2="0" stroke="#444" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="510" y="-8" text-anchor="middle" font-family="serif" font-size="14" font-style="italic" fill="#444">d</text>
    <text x="555" y="5" text-anchor="middle" font-family="serif" font-size="18" fill="#444">...</text>
  </g>

  <!-- Label -->
  <text x="300" y="100" text-anchor="middle" font-family="serif" font-size="13" fill="#666">de Rham complex</text>

  <!-- Bottom row: R^3 correspondence -->
  <g transform="translate(0, 145)">
    <text x="15" y="5" font-family="serif" font-size="13" fill="#555" font-weight="bold">R</text>
    <text x="24" y="0" font-family="serif" font-size="10" fill="#555" font-weight="bold">3</text>
    <text x="32" y="5" font-family="serif" font-size="13" fill="#555">:</text>

    <!-- Omega^0 -->
    <rect x="50" y="-12" width="55" height="26" rx="4" fill="#f0f7e8" stroke="#486" stroke-width="1.2"/>
    <text x="77" y="6" text-anchor="middle" font-family="serif" font-size="13" fill="#264">
      Ω<tspan font-size="9" baseline-shift="super">0</tspan>
    </text>

    <!-- Arrow grad -->
    <line x1="110" y1="0" x2="170" y2="0" stroke="#486" stroke-width="1.5" marker-end="url(#arrowG)"/>
    <text x="140" y="-8" text-anchor="middle" font-family="serif" font-size="12" fill="#486">grad</text>

    <!-- Omega^1 -->
    <rect x="175" y="-12" width="55" height="26" rx="4" fill="#f0f7e8" stroke="#486" stroke-width="1.2"/>
    <text x="202" y="6" text-anchor="middle" font-family="serif" font-size="13" fill="#264">
      Ω<tspan font-size="9" baseline-shift="super">1</tspan>
    </text>

    <!-- Arrow curl -->
    <line x1="235" y1="0" x2="300" y2="0" stroke="#486" stroke-width="1.5" marker-end="url(#arrowG)"/>
    <text x="267" y="-8" text-anchor="middle" font-family="serif" font-size="12" fill="#486">curl</text>

    <!-- Omega^2 -->
    <rect x="305" y="-12" width="55" height="26" rx="4" fill="#f0f7e8" stroke="#486" stroke-width="1.2"/>
    <text x="332" y="6" text-anchor="middle" font-family="serif" font-size="13" fill="#264">
      Ω<tspan font-size="9" baseline-shift="super">2</tspan>
    </text>

    <!-- Arrow div -->
    <line x1="365" y1="0" x2="425" y2="0" stroke="#486" stroke-width="1.5" marker-end="url(#arrowG)"/>
    <text x="395" y="-8" text-anchor="middle" font-family="serif" font-size="12" fill="#486">div</text>

    <!-- Omega^3 -->
    <rect x="430" y="-12" width="55" height="26" rx="4" fill="#f0f7e8" stroke="#486" stroke-width="1.2"/>
    <text x="457" y="6" text-anchor="middle" font-family="serif" font-size="13" fill="#264">
      Ω<tspan font-size="9" baseline-shift="super">3</tspan>
    </text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#444"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#486"/>
    </marker>
  </defs>
</svg>