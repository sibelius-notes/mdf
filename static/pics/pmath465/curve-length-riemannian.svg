<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350" viewBox="0 0 500 350">
  <rect width="500" height="350" fill="white"/>

  <!-- Curved surface -->
  <path d="M30,180 Q80,100 180,120 Q280,140 350,100 Q420,60 470,130 Q490,180 460,230 Q420,280 340,260 Q260,240 180,270 Q100,300 50,250 Q20,220 30,180Z" fill="#f5f0ff" stroke="#333" stroke-width="2"/>

  <!-- Curve γ on the surface -->
  <path d="M80,200 Q130,160 190,175 Q250,190 310,155 Q370,120 430,160" fill="none" stroke="#2980b9" stroke-width="2.5" id="curve"/>

  <!-- Tangent vectors at 5 points along the curve -->
  <!-- Point 1 -->
  <circle cx="100" cy="190" r="2.5" fill="#333"/>
  <line x1="100" y1="190" x2="130" y2="172" stroke="#e74c3c" stroke-width="2"/>
  <polygon points="130,172 122,172 124,180" fill="#e74c3c"/>
  <text x="115" y="165" font-family="serif" font-size="10" fill="#888">|</text>
  <text x="118" y="165" font-family="serif" font-style="italic" font-size="10" fill="#888">γ'</text>
  <text x="130" y="165" font-family="serif" font-size="10" fill="#888">|</text>
  <text x="133" y="168" font-family="serif" font-style="italic" font-size="8" fill="#888">g</text>

  <!-- Point 2 -->
  <circle cx="190" cy="175" r="2.5" fill="#333"/>
  <line x1="190" y1="175" x2="218" y2="175" stroke="#e74c3c" stroke-width="2"/>
  <polygon points="218,175 210,171 210,179" fill="#e74c3c"/>
  <text x="198" y="167" font-family="serif" font-size="10" fill="#888">|</text>
  <text x="201" y="167" font-family="serif" font-style="italic" font-size="10" fill="#888">γ'</text>
  <text x="213" y="167" font-family="serif" font-size="10" fill="#888">|</text>
  <text x="216" y="170" font-family="serif" font-style="italic" font-size="8" fill="#888">g</text>

  <!-- Point 3 -->
  <circle cx="270" cy="178" r="2.5" fill="#333"/>
  <line x1="270" y1="178" x2="295" y2="160" stroke="#e74c3c" stroke-width="2"/>
  <polygon points="295,160 287,160 289,168" fill="#e74c3c"/>
  <text x="280" y="152" font-family="serif" font-size="10" fill="#888">|</text>
  <text x="283" y="152" font-family="serif" font-style="italic" font-size="10" fill="#888">γ'</text>
  <text x="295" y="152" font-family="serif" font-size="10" fill="#888">|</text>
  <text x="298" y="155" font-family="serif" font-style="italic" font-size="8" fill="#888">g</text>

  <!-- Point 4 -->
  <circle cx="350" cy="145" r="2.5" fill="#333"/>
  <line x1="350" y1="145" x2="378" y2="130" stroke="#e74c3c" stroke-width="2"/>
  <polygon points="378,130 370,131 372,139" fill="#e74c3c"/>
  <text x="360" y="122" font-family="serif" font-size="10" fill="#888">|</text>
  <text x="363" y="122" font-family="serif" font-style="italic" font-size="10" fill="#888">γ'</text>
  <text x="375" y="122" font-family="serif" font-size="10" fill="#888">|</text>
  <text x="378" y="125" font-family="serif" font-style="italic" font-size="8" fill="#888">g</text>

  <!-- Point 5 -->
  <circle cx="420" cy="155" r="2.5" fill="#333"/>
  <line x1="420" y1="155" x2="445" y2="148" stroke="#e74c3c" stroke-width="2"/>
  <polygon points="445,148 437,145 437,153" fill="#e74c3c"/>

  <!-- Label γ on the curve -->
  <text x="240" y="210" font-family="serif" font-style="italic" font-size="18" fill="#2980b9">γ</text>

  <!-- Label γ'(t) -->
  <text x="440" y="140" font-family="serif" font-style="italic" font-size="14" fill="#e74c3c">γ'</text>
  <text x="454" y="140" font-family="serif" font-size="14" fill="#e74c3c">(</text>
  <text x="460" y="140" font-family="serif" font-style="italic" font-size="14" fill="#e74c3c">t</text>
  <text x="468" y="140" font-family="serif" font-size="14" fill="#e74c3c">)</text>

  <!-- Formula L(γ) below -->
  <text x="90" y="315" font-family="serif" font-style="italic" font-size="16" fill="#333">L</text>
  <text x="102" y="315" font-family="serif" font-size="16" fill="#333">(</text>
  <text x="110" y="315" font-family="serif" font-style="italic" font-size="16" fill="#333">γ</text>
  <text x="123" y="315" font-family="serif" font-size="16" fill="#333">) = </text>
  <text x="155" y="315" font-family="serif" font-size="16" fill="#333">∫</text>
  <text x="168" y="325" font-family="serif" font-size="11" fill="#333">0</text>
  <text x="168" y="302" font-family="serif" font-size="11" fill="#333">1</text>
  <text x="178" y="315" font-family="serif" font-size="16" fill="#333"> |</text>
  <text x="188" y="315" font-family="serif" font-style="italic" font-size="16" fill="#333">γ'</text>
  <text x="204" y="315" font-family="serif" font-size="16" fill="#333">(</text>
  <text x="210" y="315" font-family="serif" font-style="italic" font-size="16" fill="#333">t</text>
  <text x="220" y="315" font-family="serif" font-size="16" fill="#333">)|</text>
  <text x="232" y="320" font-family="serif" font-style="italic" font-size="11" fill="#333">g</text>
  <text x="242" y="315" font-family="serif" font-size="16" fill="#333"> </text>
  <text x="248" y="315" font-family="serif" font-style="italic" font-size="16" fill="#333">dt</text>
</svg>