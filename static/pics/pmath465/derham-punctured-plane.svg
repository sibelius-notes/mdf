<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 400" width="450" height="400">
  <rect width="450" height="400" fill="white"/>

  <text x="225" y="25" text-anchor="middle" font-family="serif" font-size="17" font-weight="bold" fill="#222">de Rham Cohomology of the Punctured Plane</text>

  <defs>
    <marker id="pArr" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#6644aa"/>
    </marker>
    <marker id="pArrG" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#cc6622"/>
    </marker>
  </defs>

  <!-- Coordinate axes (light) -->
  <line x1="30" y1="210" x2="420" y2="210" stroke="#ccc" stroke-width="1"/>
  <line x1="225" y1="40" x2="225" y2="370" stroke="#ccc" stroke-width="1"/>

  <!-- Origin removed (empty circle) -->
  <circle cx="225" cy="210" r="8" fill="white" stroke="#cc3322" stroke-width="2.5"/>
  <line x1="220" y1="205" x2="230" y2="215" stroke="#cc3322" stroke-width="2"/>
  <line x1="230" y1="205" x2="220" y2="215" stroke="#cc3322" stroke-width="2"/>

  <!-- Angular 1-form dtheta as small circulating arrows -->
  <!-- Inner ring -->
  <g opacity="0.6">
    <!-- Top -->
    <line x1="215" y1="175" x2="200" y2="180" stroke="#6644aa" stroke-width="1.5" marker-end="url(#pArr)"/>
    <!-- Left -->
    <line x1="190" y1="200" x2="192" y2="215" stroke="#6644aa" stroke-width="1.5" marker-end="url(#pArr)"/>
    <!-- Bottom -->
    <line x1="235" y1="245" x2="250" y2="240" stroke="#6644aa" stroke-width="1.5" marker-end="url(#pArr)"/>
    <!-- Right -->
    <line x1="260" y1="220" x2="258" y2="205" stroke="#6644aa" stroke-width="1.5" marker-end="url(#pArr)"/>
  </g>

  <!-- Middle ring -->
  <g opacity="0.5">
    <line x1="210" y1="145" x2="185" y2="155" stroke="#6644aa" stroke-width="1.3" marker-end="url(#pArr)"/>
    <line x1="160" y1="195" x2="165" y2="220" stroke="#6644aa" stroke-width="1.3" marker-end="url(#pArr)"/>
    <line x1="240" y1="275" x2="265" y2="265" stroke="#6644aa" stroke-width="1.3" marker-end="url(#pArr)"/>
    <line x1="290" y1="225" x2="285" y2="200" stroke="#6644aa" stroke-width="1.3" marker-end="url(#pArr)"/>
    <line x1="255" y1="150" x2="238" y2="145" stroke="#6644aa" stroke-width="1.3" marker-end="url(#pArr)"/>
    <line x1="165" y1="240" x2="175" y2="258" stroke="#6644aa" stroke-width="1.3" marker-end="url(#pArr)"/>
    <line x1="195" y1="270" x2="215" y2="275" stroke="#6644aa" stroke-width="1.3" marker-end="url(#pArr)"/>
    <line x1="280" y1="175" x2="272" y2="158" stroke="#6644aa" stroke-width="1.3" marker-end="url(#pArr)"/>
  </g>

  <!-- Outer ring -->
  <g opacity="0.35">
    <line x1="200" y1="110" x2="170" y2="125" stroke="#6644aa" stroke-width="1.2" marker-end="url(#pArr)"/>
    <line x1="130" y1="190" x2="135" y2="220" stroke="#6644aa" stroke-width="1.2" marker-end="url(#pArr)"/>
    <line x1="250" y1="310" x2="280" y2="298" stroke="#6644aa" stroke-width="1.2" marker-end="url(#pArr)"/>
    <line x1="320" y1="230" x2="315" y2="200" stroke="#6644aa" stroke-width="1.2" marker-end="url(#pArr)"/>
    <line x1="280" y1="120" x2="258" y2="112" stroke="#6644aa" stroke-width="1.2" marker-end="url(#pArr)"/>
    <line x1="140" y1="265" x2="155" y2="285" stroke="#6644aa" stroke-width="1.2" marker-end="url(#pArr)"/>
  </g>

  <text x="275" y="170" font-family="serif" font-size="14" fill="#6644aa" font-style="italic">d&theta;</text>

  <!-- Closed loop gamma around the origin -->
  <circle cx="225" cy="210" r="55" fill="none" stroke="#cc6622" stroke-width="2.5"/>
  <!-- Direction arrows on gamma -->
  <polygon points="170,208 170,200 176,204" fill="#cc6622"/>
  <polygon points="280,212 280,220 274,216" fill="#cc6622"/>

  <text x="160" y="180" font-family="serif" font-size="15" font-style="italic" fill="#cc6622">&gamma;</text>

  <!-- Integral label -->
  <text x="340" y="140" font-family="serif" font-size="14" fill="#cc6622">
    &oint;<tspan font-size="10" baseline-shift="sub" font-style="italic">&gamma;</tspan> <tspan font-style="italic">d&theta;</tspan> = 2&pi;
  </text>

  <!-- Title for the space -->
  <text x="380" y="55" text-anchor="middle" font-family="serif" font-size="14" fill="#333">
    R<tspan font-size="10" baseline-shift="super">2</tspan> \ {0}
  </text>

  <!-- Cohomology result -->
  <rect x="100" y="348" width="250" height="30" rx="5" fill="#f5f0fa" stroke="#6644aa" stroke-width="1.5"/>
  <text x="225" y="369" text-anchor="middle" font-family="serif" font-size="15" fill="#6644aa">
    <tspan font-style="italic">H</tspan><tspan font-size="10" baseline-shift="super">1</tspan>(R<tspan font-size="10" baseline-shift="super">2</tspan> \ {0}) &cong; R
  </text>

  <text x="225" y="340" text-anchor="middle" font-family="serif" font-size="12" fill="#888">
    [<tspan font-style="italic">d&theta;</tspan>] generates the first cohomology
  </text>
</svg>