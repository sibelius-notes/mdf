<svg xmlns="http://www.w3.org/2000/svg" width="650" height="350" viewBox="0 0 650 350">
  <defs>
    <marker id="vecArrow" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#555"/>
    </marker>
    <marker id="curveDir" markerWidth="7" markerHeight="5" refX="3.5" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#2266aa"/>
    </marker>
    <marker id="straightDir" markerWidth="7" markerHeight="5" refX="3.5" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#2266aa"/>
    </marker>
    <marker id="mapArrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#cc5500"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="650" height="350" fill="#fff"/>

  <!-- ========== LEFT SIDE: Curved integral curves ========== -->

  <!-- Region boundary (curved/organic shape) -->
  <path d="M30,50 Q80,30 180,40 Q260,50 270,100 Q280,180 270,260 Q260,310 180,320 Q80,330 30,290 Q10,200 30,50 Z"
        fill="#f5f5ff" stroke="#888" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Curved integral curves flowing through the region -->
  <g fill="none" stroke="#2266aa" stroke-width="1.8">
    <!-- Curve 1 (top) -->
    <path d="M40,80 Q90,65 140,75 Q190,85 220,110 Q245,130 260,155" marker-mid="url(#curveDir)"/>
    <!-- Curve 2 -->
    <path d="M35,130 Q85,110 135,118 Q185,126 215,155 Q240,178 255,205"/>
    <!-- Curve 3 -->
    <path d="M35,180 Q85,162 135,168 Q185,174 215,200 Q240,222 258,248"/>
    <!-- Curve 4 -->
    <path d="M38,230 Q88,215 138,220 Q188,225 218,248 Q242,265 260,290"/>
    <!-- Curve 5 (bottom) -->
    <path d="M45,275 Q95,264 145,268 Q195,272 222,290 Q240,302 255,318"/>
  </g>

  <!-- Direction arrows on curves -->
  <g fill="#2266aa">
    <!-- Curve 1 -->
    <polygon points="175,80 183,76 180,85"/>
    <!-- Curve 2 -->
    <polygon points="170,121 178,118 174,127"/>
    <!-- Curve 3 -->
    <polygon points="170,169 178,166 174,175"/>
    <!-- Curve 4 -->
    <polygon points="172,222 180,219 176,228"/>
    <!-- Curve 5 -->
    <polygon points="175,269 183,267 178,276"/>
  </g>

  <!-- Small vector field arrows on left -->
  <g stroke="#555" stroke-width="1" fill="none" marker-end="url(#vecArrow)">
    <line x1="70" y1="90" x2="88" y2="84"/>
    <line x1="120" y1="100" x2="137" y2="96"/>
    <line x1="70" y1="150" x2="88" y2="143"/>
    <line x1="120" y1="155" x2="137" y2="150"/>
    <line x1="70" y1="210" x2="87" y2="204"/>
    <line x1="120" y1="210" x2="137" y2="205"/>
    <line x1="70" y1="265" x2="87" y2="260"/>
    <line x1="120" y1="262" x2="137" y2="258"/>
    <line x1="190" y1="105" x2="206" y2="112"/>
    <line x1="190" y1="155" x2="206" y2="160"/>
    <line x1="190" y1="205" x2="206" y2="212"/>
    <line x1="190" y1="255" x2="205" y2="262"/>
  </g>

  <!-- V label on left -->
  <text x="55" y="45" font-family="serif" font-size="20" font-style="italic" font-weight="bold" fill="#333">V</text>

  <!-- "Manifold" label -->
  <text x="100" y="340" font-family="serif" font-size="13" fill="#666">(M, V)</text>

  <!-- ========== MAPPING ARROW ========== -->
  <g>
    <line x1="295" y1="175" x2="365" y2="175" stroke="#cc5500" stroke-width="2.2" marker-end="url(#mapArrow)" fill="none"/>
    <!-- psi label -->
    <text x="314" y="165" font-family="serif" font-size="20" font-style="italic" fill="#cc5500">&#968;</text>
  </g>

  <!-- Label under arrow -->
  <text x="283" y="205" font-family="serif" font-size="11" fill="#cc5500" text-anchor="middle">
    <tspan x="333" dy="0">flow-box</tspan>
    <tspan x="333" dy="14">diffeomorphism</tspan>
  </text>

  <!-- ========== RIGHT SIDE: Straightened coordinates ========== -->

  <!-- Rectangular region -->
  <rect x="390" y="55" width="230" height="250" fill="#f5fff5" stroke="#888" stroke-width="1.5"/>

  <!-- Straight parallel horizontal integral curves -->
  <g fill="none" stroke="#2266aa" stroke-width="1.8">
    <line x1="395" y1="95" x2="615" y2="95"/>
    <line x1="395" y1="140" x2="615" y2="140"/>
    <line x1="395" y1="185" x2="615" y2="185"/>
    <line x1="395" y1="230" x2="615" y2="230"/>
    <line x1="395" y1="275" x2="615" y2="275"/>
  </g>

  <!-- Direction arrows on straight lines -->
  <g fill="#2266aa">
    <polygon points="520,91 528,95 520,99"/>
    <polygon points="520,136 528,140 520,144"/>
    <polygon points="520,181 528,185 520,189"/>
    <polygon points="520,226 528,230 520,234"/>
    <polygon points="520,271 528,275 520,279"/>
  </g>

  <!-- Coordinate axes labels -->
  <!-- u1 axis (horizontal) -->
  <text x="605" y="322" font-family="serif" font-size="14" font-style="italic" fill="#666">u&#8321;</text>
  <!-- u2 axis (vertical) -->
  <text x="393" y="48" font-family="serif" font-size="14" font-style="italic" fill="#666">u&#8322;</text>

  <!-- ∂/∂u₁ label -->
  <text x="440" y="45" font-family="serif" font-size="18" font-style="italic" font-weight="bold" fill="#333">V = &#8706;/&#8706;u&#8321;</text>

  <!-- "Straightened coordinates" label -->
  <text x="430" y="335" font-family="serif" font-size="13" fill="#666">(flow-box coordinates)</text>
</svg>