<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300">
  <rect width="500" height="300" fill="white"/>

  <!-- Circle S^1 -->
  <circle cx="150" cy="120" r="75" fill="none" stroke="#333" stroke-width="2"/>

  <!-- U arc (blue) - top arc, slightly more than semicircle -->
  <path d="M 82 155 A 75 75 0 1 1 218 155" fill="none" stroke="#2266cc" stroke-width="5" stroke-opacity="0.4"/>

  <!-- V arc (red) - bottom arc, slightly more than semicircle -->
  <path d="M 218 85 A 75 75 0 1 1 82 85" fill="none" stroke="#cc3333" stroke-width="5" stroke-opacity="0.4"/>

  <!-- Overlap regions (two small arcs, purple) -->
  <!-- Left overlap -->
  <path d="M 82 85 A 75 75 0 0 0 82 155" fill="none" stroke="#8833aa" stroke-width="6" stroke-opacity="0.5"/>
  <!-- Right overlap -->
  <path d="M 218 85 A 75 75 0 0 1 218 155" fill="none" stroke="#8833aa" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Dots at boundary points -->
  <circle cx="82" cy="85" r="3" fill="#555"/>
  <circle cx="82" cy="155" r="3" fill="#555"/>
  <circle cx="218" cy="85" r="3" fill="#555"/>
  <circle cx="218" cy="155" r="3" fill="#555"/>

  <!-- Labels on the circle -->
  <text x="150" y="30" text-anchor="middle" font-family="serif" font-size="18" font-style="italic" fill="#333">S</text>
  <text x="161" y="23" font-family="serif" font-size="12" fill="#333">1</text>

  <text x="150" y="83" text-anchor="middle" font-family="serif" font-size="15" font-style="italic" fill="#2266cc">U</text>
  <text x="150" y="172" text-anchor="middle" font-family="serif" font-size="15" font-style="italic" fill="#cc3333">V</text>

  <!-- Overlap labels -->
  <line x1="60" y1="120" x2="40" y2="120" stroke="#8833aa" stroke-width="1"/>
  <text x="10" y="115" font-family="serif" font-size="11" fill="#8833aa">U&#x2229;V</text>
  <text x="10" y="128" font-family="serif" font-size="10" fill="#8833aa">(arc 1)</text>

  <line x1="240" y1="120" x2="260" y2="120" stroke="#8833aa" stroke-width="1"/>
  <text x="262" y="115" font-family="serif" font-size="11" fill="#8833aa">U&#x2229;V</text>
  <text x="262" y="128" font-family="serif" font-size="10" fill="#8833aa">(arc 2)</text>

  <!-- Right side: text description -->
  <text x="320" y="50" font-family="serif" font-size="13" fill="#333">
    <tspan font-style="italic">U</tspan>, <tspan font-style="italic">V</tspan> each &#x2243; &#x211D; (contractible)
  </text>
  <text x="320" y="75" font-family="serif" font-size="13" fill="#8833aa">
    <tspan font-style="italic">U</tspan> &#x2229; <tspan font-style="italic">V</tspan> = two disjoint arcs
  </text>
  <text x="320" y="95" font-family="serif" font-size="13" fill="#8833aa">
    &#x2243; &#x211D; &#x2294; &#x211D; (two components)
  </text>

  <!-- Arrow down -->
  <text x="370" y="125" text-anchor="middle" font-family="serif" font-size="14" fill="#999">&#x2193;</text>

  <text x="320" y="145" font-family="serif" font-size="13" fill="#333">
    <tspan font-style="italic">H</tspan><tspan font-size="9" dy="-4">0</tspan><tspan dy="4">(</tspan><tspan font-style="italic">U</tspan> &#x2229; <tspan font-style="italic">V</tspan>) = &#x211D;<tspan font-size="9" dy="-4">2</tspan>
  </text>

  <!-- Separator -->
  <line x1="30" y1="210" x2="470" y2="210" stroke="#ccc" stroke-width="1"/>

  <!-- Result box -->
  <rect x="70" y="225" width="360" height="55" rx="8" fill="#f5f5f0" stroke="#999" stroke-width="1.5"/>
  <text x="250" y="248" text-anchor="middle" font-family="serif" font-size="15" font-weight="bold" fill="#333">Result:</text>
  <text x="250" y="270" text-anchor="middle" font-family="serif" font-size="16" fill="#333">
    <tspan font-style="italic">H</tspan><tspan font-size="10" dy="-4">0</tspan><tspan dy="4">(</tspan><tspan font-style="italic">S</tspan><tspan font-size="10" dy="-4">1</tspan><tspan dy="4">) = &#x211D;,     </tspan>
    <tspan font-style="italic">H</tspan><tspan font-size="10" dy="-4">1</tspan><tspan dy="4">(</tspan><tspan font-style="italic">S</tspan><tspan font-size="10" dy="-4">1</tspan><tspan dy="4">) = &#x211D;</tspan>
  </text>
</svg>