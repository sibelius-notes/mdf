<svg xmlns="http://www.w3.org/2000/svg" width="550" height="350" viewBox="0 0 550 350">
  <rect width="550" height="350" fill="white"/>
  <defs>
    <marker id="aDn" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <path d="M 0,0 L 4,6 L 8,0" fill="none" stroke="#333" stroke-width="1.2"/>
    </marker>
    <marker id="aDown" markerWidth="10" markerHeight="8" refX="5" refY="8" orient="auto">
      <path d="M 0,0 L 5,8 L 10,0" fill="none" stroke="#4477CC" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Manifold M (upper blob, higher dimensional) -->
  <ellipse cx="275" cy="100" rx="200" ry="70" fill="#f0f4ff" stroke="#333" stroke-width="2"/>
  <text x="55" y="60" font-family="serif" font-size="22" font-style="italic" fill="#333">M</text>

  <!-- Manifold N (lower, smaller blob) -->
  <ellipse cx="275" cy="290" rx="140" ry="35" fill="#fff4f0" stroke="#333" stroke-width="2"/>
  <text x="110" y="305" font-family="serif" font-size="22" font-style="italic" fill="#333">N</text>

  <!-- Vertical fibers in M -->
  <line x1="180" y1="70" x2="180" y2="130" stroke="#4477CC" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="275" y1="50" x2="275" y2="150" stroke="#4477CC" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="370" y1="70" x2="370" y2="130" stroke="#4477CC" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Projection arrows from fibers to N -->
  <line x1="180" y1="155" x2="200" y2="260" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="275" y1="165" x2="275" y2="258" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="370" y1="155" x2="350" y2="260" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Points in N where fibers map to -->
  <circle cx="200" cy="280" r="4" fill="#CC4444"/>
  <circle cx="275" cy="280" r="4" fill="#CC4444"/>
  <circle cx="350" cy="280" r="4" fill="#CC4444"/>

  <!-- Label q in N -->
  <text x="278" y="275" font-family="serif" font-size="15" font-style="italic" fill="#CC4444">q</text>

  <!-- Fiber label -->
  <text x="285" y="90" font-family="serif" font-size="14" fill="#4477CC" font-style="italic">F</text>
  <text x="295" y="90" font-family="serif" font-size="11" fill="#4477CC" baseline-shift="super">-1</text>
  <text x="310" y="90" font-family="serif" font-size="14" fill="#4477CC">(</text>
  <text x="316" y="90" font-family="serif" font-size="14" fill="#4477CC" font-style="italic">q</text>
  <text x="326" y="90" font-family="serif" font-size="14" fill="#4477CC">)</text>

  <!-- Big F arrow -->
  <path d="M 460,130 Q 480,200 430,260" fill="none" stroke="#333" stroke-width="2" marker-end="url(#aDn)"/>
  <text x="475" y="200" font-family="serif" font-size="20" font-style="italic" fill="#333">F</text>

  <!-- Canonical form -->
  <text x="100" y="340" font-family="serif" font-size="14" fill="#666">(x</text>
  <text x="114" y="344" font-family="serif" font-size="10" fill="#666" baseline-shift="super">1</text>
  <text x="122" y="340" font-family="serif" font-size="14" fill="#666">,...,x</text>
  <text x="162" y="344" font-family="serif" font-size="10" fill="#666" baseline-shift="super">m</text>
  <text x="172" y="340" font-family="serif" font-size="14" fill="#666">) </text>
  <text x="183" y="340" font-family="serif" font-size="16" fill="#666">&#x27FC;</text>
  <text x="200" y="340" font-family="serif" font-size="14" fill="#666"> (x</text>
  <text x="220" y="344" font-family="serif" font-size="10" fill="#666" baseline-shift="super">1</text>
  <text x="228" y="340" font-family="serif" font-size="14" fill="#666">,...,x</text>
  <text x="268" y="344" font-family="serif" font-size="10" fill="#666" baseline-shift="super">n</text>
  <text x="278" y="340" font-family="serif" font-size="14" fill="#666">)</text>

  <!-- dim labels -->
  <text x="430" y="60" font-family="serif" font-size="13" fill="#888">dim M = m</text>
  <text x="380" y="315" font-family="serif" font-size="13" fill="#888">dim N = n &lt; m</text>
</svg>