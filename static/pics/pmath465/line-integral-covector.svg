<svg xmlns="http://www.w3.org/2000/svg" width="450" height="350" viewBox="0 0 450 350">
  <rect width="450" height="350" fill="white"/>
  <defs>
    <marker id="arCurve" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0,0 L 8,3 L 0,6" fill="none" stroke="#CC4444" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- The curve gamma -->
  <path d="M 60,280 Q 100,120 200,150 Q 300,180 350,80 Q 380,30 410,100"
        fill="none" stroke="#CC4444" stroke-width="2.5" marker-end="url(#arCurve)"/>

  <!-- Curve label gamma -->
  <text x="415" y="105" font-family="serif" font-size="18" font-style="italic" fill="#CC4444">γ</text>

  <!-- Covector stacks along the curve at several points -->
  <!-- Point 1: near start -->
  <g transform="translate(80,240) rotate(-70)">
    <line x1="-6" y1="-10" x2="-6" y2="10" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="6" y1="-10" x2="6" y2="10" stroke="#4477CC" stroke-width="1.3"/>
  </g>
  <circle cx="80" cy="240" r="3" fill="#CC4444"/>

  <!-- Point 2 -->
  <g transform="translate(140,155) rotate(-10)">
    <line x1="-6" y1="-10" x2="-6" y2="10" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="6" y1="-10" x2="6" y2="10" stroke="#4477CC" stroke-width="1.3"/>
  </g>
  <circle cx="140" cy="155" r="3" fill="#CC4444"/>

  <!-- Point 3 -->
  <g transform="translate(220,160) rotate(10)">
    <line x1="-6" y1="-10" x2="-6" y2="10" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="6" y1="-10" x2="6" y2="10" stroke="#4477CC" stroke-width="1.3"/>
  </g>
  <circle cx="220" cy="160" r="3" fill="#CC4444"/>

  <!-- Point 4 -->
  <g transform="translate(300,150) rotate(-50)">
    <line x1="-6" y1="-10" x2="-6" y2="10" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="6" y1="-10" x2="6" y2="10" stroke="#4477CC" stroke-width="1.3"/>
  </g>
  <circle cx="300" cy="150" r="3" fill="#CC4444"/>

  <!-- Point 5 -->
  <g transform="translate(365,60) rotate(-70)">
    <line x1="-6" y1="-10" x2="-6" y2="10" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#4477CC" stroke-width="1.3"/>
    <line x1="6" y1="-10" x2="6" y2="10" stroke="#4477CC" stroke-width="1.3"/>
  </g>
  <circle cx="365" cy="60" r="3" fill="#CC4444"/>

  <!-- Covector field label -->
  <text x="30" y="155" font-family="serif" font-size="16" font-style="italic" fill="#4477CC">ω</text>

  <!-- Integral formula -->
  <text x="100" y="320" font-family="serif" font-size="20" fill="#333">∫</text>
  <text x="112" y="330" font-family="serif" font-size="13" font-style="italic" fill="#CC4444">γ</text>
  <text x="125" y="320" font-family="serif" font-size="18" font-style="italic" fill="#4477CC">ω</text>
  <text x="145" y="320" font-family="serif" font-size="16" fill="#333"> = accumulated effect along path</text>
</svg>