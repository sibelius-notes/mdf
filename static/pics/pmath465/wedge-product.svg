<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <rect width="500" height="350" fill="white"/>

  <!-- Title -->
  <text x="250" y="28" text-anchor="middle" font-family="serif" font-size="18" font-weight="bold" fill="#222">Wedge Product of 1-Forms</text>

  <!-- Left section: alpha lines -->
  <g opacity="0.5">
    <line x1="30" y1="70" x2="130" y2="170" stroke="#2266cc" stroke-width="1.5"/>
    <line x1="50" y1="70" x2="150" y2="170" stroke="#2266cc" stroke-width="1.5"/>
    <line x1="70" y1="70" x2="170" y2="170" stroke="#2266cc" stroke-width="1.5"/>
    <line x1="90" y1="70" x2="190" y2="170" stroke="#2266cc" stroke-width="1.5"/>
    <line x1="110" y1="70" x2="210" y2="170" stroke="#2266cc" stroke-width="1.5"/>
  </g>
  <text x="35" y="185" font-family="serif" font-size="16" font-style="italic" fill="#2266cc">α</text>

  <!-- Beta lines -->
  <g opacity="0.5">
    <line x1="30" y1="140" x2="210" y2="80" stroke="#cc3322" stroke-width="1.5"/>
    <line x1="30" y1="155" x2="210" y2="95" stroke="#cc3322" stroke-width="1.5"/>
    <line x1="30" y1="170" x2="210" y2="110" stroke="#cc3322" stroke-width="1.5"/>
    <line x1="30" y1="185" x2="210" y2="125" stroke="#cc3322" stroke-width="1.5"/>
  </g>
  <text x="195" y="78" font-family="serif" font-size="16" font-style="italic" fill="#cc3322">β</text>

  <!-- Oriented parallelogram for alpha wedge beta -->
  <g transform="translate(300, 100)">
    <polygon points="0,60 70,20 130,60 60,100" fill="rgba(100,180,100,0.25)" stroke="#228833" stroke-width="2"/>
    <!-- Orientation arrows on edges -->
    <line x1="0" y1="60" x2="70" y2="20" stroke="#228833" stroke-width="2"/>
    <polygon points="40,37 32,45 28,35" fill="#228833"/>
    <line x1="70" y1="20" x2="130" y2="60" stroke="#228833" stroke-width="2"/>
    <polygon points="105,43 95,38 100,48" fill="#228833"/>
    <line x1="130" y1="60" x2="60" y2="100" stroke="#228833" stroke-width="2"/>
    <polygon points="90,83 98,75 102,85" fill="#228833"/>
    <line x1="60" y1="100" x2="0" y2="60" stroke="#228833" stroke-width="2"/>
    <polygon points="25,77 35,82 30,72" fill="#228833"/>

    <!-- Curved orientation arrow in center -->
    <path d="M 55,55 A 12,12 0 1,1 75,55" fill="none" stroke="#228833" stroke-width="1.5"/>
    <polygon points="75,55 72,48 79,50" fill="#228833"/>

    <!-- Dual vectors as arrows -->
    <line x1="0" y1="60" x2="70" y2="20" stroke="#2266cc" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>
    <line x1="0" y1="60" x2="60" y2="100" stroke="#cc3322" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>
  </g>
  <text x="340" y="215" text-anchor="middle" font-family="serif" font-size="16" fill="#228833">
    <tspan font-style="italic">α</tspan> ∧ <tspan font-style="italic">β</tspan>
  </text>
  <text x="340" y="235" text-anchor="middle" font-family="serif" font-size="13" fill="#555">(oriented area element)</text>

  <!-- Degenerate case: alpha wedge alpha = 0 -->
  <g transform="translate(60, 260)">
    <line x1="0" y1="0" x2="80" y2="-30" stroke="#2266cc" stroke-width="2"/>
    <polygon points="80,-30 70,-25 70,-33" fill="#2266cc"/>
    <line x1="5" y1="5" x2="85" y2="-25" stroke="#2266cc" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="85,-25 75,-20 75,-28" fill="#2266cc"/>
    <text x="100" y="-5" font-family="serif" font-size="14" fill="#666">
      <tspan font-style="italic">α</tspan> ∧ <tspan font-style="italic">α</tspan> = 0
    </text>
    <text x="100" y="15" font-family="serif" font-size="12" fill="#888">(degenerate: no area)</text>
  </g>

  <!-- Antisymmetry note -->
  <text x="320" y="290" text-anchor="middle" font-family="serif" font-size="14" fill="#555">
    <tspan font-style="italic">α</tspan> ∧ <tspan font-style="italic">β</tspan> = −<tspan font-style="italic">β</tspan> ∧ <tspan font-style="italic">α</tspan>
  </text>
  <text x="320" y="310" text-anchor="middle" font-family="serif" font-size="12" fill="#888">(antisymmetry)</text>
</svg>