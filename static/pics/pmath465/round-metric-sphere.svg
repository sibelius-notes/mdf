<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="white"/>
  <defs>
    <clipPath id="sphereClip">
      <circle cx="200" cy="200" r="150"/>
    </clipPath>
  </defs>

  <!-- Sphere outline -->
  <circle cx="200" cy="200" r="150" fill="#e8eef8" fill-opacity="0.3" stroke="#333" stroke-width="2"/>

  <!-- Latitude lines (horizontal ellipses) -->
  <ellipse cx="200" cy="80" rx="75" ry="12" fill="none" stroke="#2266cc" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="200" cy="120" rx="115" ry="18" fill="none" stroke="#2266cc" stroke-width="0.8" opacity="0.7"/>
  <ellipse cx="200" cy="160" rx="138" ry="22" fill="none" stroke="#2266cc" stroke-width="0.9" opacity="0.8"/>
  <!-- Equator -->
  <ellipse cx="200" cy="200" rx="150" ry="25" fill="none" stroke="#cc3333" stroke-width="2"/>
  <ellipse cx="200" cy="240" rx="138" ry="22" fill="none" stroke="#2266cc" stroke-width="0.9" opacity="0.8"/>
  <ellipse cx="200" cy="280" rx="115" ry="18" fill="none" stroke="#2266cc" stroke-width="0.8" opacity="0.7"/>
  <ellipse cx="200" cy="320" rx="75" ry="12" fill="none" stroke="#2266cc" stroke-width="0.8" opacity="0.6"/>

  <!-- Longitude lines (vertical ellipses) -->
  <ellipse cx="200" cy="200" rx="10" ry="150" fill="none" stroke="#339944" stroke-width="0.8" opacity="0.7"/>
  <ellipse cx="200" cy="200" rx="50" ry="150" fill="none" stroke="#339944" stroke-width="0.8" opacity="0.7"/>
  <ellipse cx="200" cy="200" rx="90" ry="150" fill="none" stroke="#339944" stroke-width="0.8" opacity="0.7"/>
  <ellipse cx="200" cy="200" rx="130" ry="150" fill="none" stroke="#339944" stroke-width="0.8" opacity="0.7"/>

  <!-- North pole label -->
  <circle cx="200" cy="50" r="3" fill="#333"/>
  <text x="210" y="48" font-family="serif" font-size="13" fill="#333">N</text>

  <!-- South pole label -->
  <circle cx="200" cy="350" r="3" fill="#333"/>
  <text x="210" y="353" font-family="serif" font-size="13" fill="#333">S</text>

  <!-- Equator label -->
  <text x="355" y="195" font-family="serif" font-size="14" fill="#cc3333">equator</text>

  <!-- Title -->
  <text x="130" y="25" font-family="serif" font-size="18" fill="#333">Round metric on</text>
  <text x="295" y="25" font-family="serif" font-style="italic" font-size="18" fill="#333">S</text>
  <text x="306" y="20" font-family="serif" font-size="12" fill="#333">2</text>

  <!-- Annotation: near pole, grid compressed -->
  <line x1="120" y1="75" x2="60" y2="55" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="10" y="50" font-family="serif" font-size="11" fill="#666">Grid cells</text>
  <text x="10" y="63" font-family="serif" font-size="11" fill="#666">compressed</text>
  <text x="10" y="76" font-family="serif" font-size="11" fill="#666">near poles</text>

  <!-- Annotation: near equator, roughly square -->
  <line x1="330" y1="220" x2="355" y2="250" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="310" y="270" font-family="serif" font-size="11" fill="#666">Roughly</text>
  <text x="310" y="283" font-family="serif" font-size="11" fill="#666">square cells</text>

  <!-- ds^2 formula -->
  <text x="60" y="390" font-family="serif" font-style="italic" font-size="14" fill="#555">ds</text>
  <text x="75" y="386" font-family="serif" font-size="10" fill="#555">2</text>
  <text x="85" y="390" font-family="serif" font-size="14" fill="#555">= dθ</text>
  <text x="115" y="386" font-family="serif" font-size="10" fill="#555">2</text>
  <text x="125" y="390" font-family="serif" font-size="14" fill="#555">+ sin</text>
  <text x="160" y="386" font-family="serif" font-size="10" fill="#555">2</text>
  <text x="167" y="390" font-family="serif" font-style="italic" font-size="14" fill="#555">θ dφ</text>
  <text x="198" y="386" font-family="serif" font-size="10" fill="#555">2</text>
</svg>