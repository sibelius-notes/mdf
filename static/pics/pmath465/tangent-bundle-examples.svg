<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <rect width="600" height="300" fill="white"/>

  <defs>
    <marker id="tbArr" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#cc2222"/>
    </marker>
  </defs>

  <!-- Divider -->
  <line x1="300" y1="30" x2="300" y2="270" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- (a) TS^1 = S^1 x R: Cylinder -->
  <text x="150" y="25" font-family="serif" font-size="15" fill="#333" text-anchor="middle">(a) <tspan font-style="italic">TS</tspan><tspan font-size="11" baseline-shift="super">1</tspan> &amp;#x2245; <tspan font-style="italic">S</tspan><tspan font-size="11" baseline-shift="super">1</tspan> &amp;#x00D7; <tspan font-style="italic">R</tspan></text>

  <!-- Cylinder - top ellipse -->
  <ellipse cx="150" cy="70" rx="80" ry="25" fill="none" stroke="#2255aa" stroke-width="2"/>
  <!-- Cylinder - bottom ellipse -->
  <ellipse cx="150" cy="230" rx="80" ry="25" fill="#e8edf5" fill-opacity="0.3" stroke="#2255aa" stroke-width="2"/>
  <!-- Cylinder - left side -->
  <line x1="70" y1="70" x2="70" y2="230" stroke="#2255aa" stroke-width="2"/>
  <!-- Cylinder - right side -->
  <line x1="230" y1="70" x2="230" y2="230" stroke="#2255aa" stroke-width="2"/>

  <!-- Shading on cylinder -->
  <rect x="70" y="70" width="160" height="160" fill="#2255aa" fill-opacity="0.05"/>

  <!-- S^1 at bottom as the base circle -->
  <text x="150" y="275" font-family="serif" font-size="14" fill="#333" text-anchor="middle">"trivial"</text>

  <!-- R fiber indicator -->
  <line x1="150" y1="70" x2="150" y2="230" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="160" y="155" font-family="serif" font-style="italic" font-size="13" fill="#666">R</text>
  <text x="240" y="235" font-family="serif" font-style="italic" font-size="13" fill="#2255aa">S<tspan font-size="9" baseline-shift="super">1</tspan></text>

  <!-- (b) TS^2: Sphere with vector field that must vanish -->
  <text x="450" y="25" font-family="serif" font-size="15" fill="#333" text-anchor="middle">(b) <tspan font-style="italic">TS</tspan><tspan font-size="11" baseline-shift="super">2</tspan></text>

  <!-- Sphere -->
  <circle cx="450" cy="155" r="90" fill="#f5f0f0" stroke="#333" stroke-width="2"/>
  <!-- Equator -->
  <ellipse cx="450" cy="155" rx="90" ry="22" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Vector field arrows on the sphere (must have a zero - hairy ball theorem) -->
  <!-- Top region - arrows swirling, getting smaller near N pole -->
  <line x1="450" y1="72" x2="452" y2="72" stroke="#cc2222" stroke-width="1.2"/>
  <circle cx="450" cy="72" r="2.5" fill="#cc2222"/>
  <text x="465" y="72" font-family="sans-serif" font-size="10" fill="#cc2222">zero!</text>

  <!-- Arrows flowing around the sphere -->
  <line x1="400" y1="95" x2="416" y2="88" stroke="#cc2222" stroke-width="1.5" marker-end="url(#tbArr)"/>
  <line x1="490" y1="90" x2="506" y2="95" stroke="#cc2222" stroke-width="1.5" marker-end="url(#tbArr)"/>
  <line x1="375" y1="130" x2="380" y2="117" stroke="#cc2222" stroke-width="1.5" marker-end="url(#tbArr)"/>
  <line x1="525" y1="125" x2="530" y2="138" stroke="#cc2222" stroke-width="1.5" marker-end="url(#tbArr)"/>
  <line x1="370" y1="165" x2="370" y2="150" stroke="#cc2222" stroke-width="1.5" marker-end="url(#tbArr)"/>
  <line x1="530" y1="160" x2="532" y2="175" stroke="#cc2222" stroke-width="1.5" marker-end="url(#tbArr)"/>
  <line x1="380" y1="195" x2="375" y2="182" stroke="#cc2222" stroke-width="1.5" marker-end="url(#tbArr)"/>
  <line x1="520" y1="190" x2="524" y2="203" stroke="#cc2222" stroke-width="1.5" marker-end="url(#tbArr)"/>
  <line x1="405" y1="220" x2="395" y2="212" stroke="#cc2222" stroke-width="1.5" marker-end="url(#tbArr)"/>
  <line x1="495" y1="215" x2="506" y2="222" stroke="#cc2222" stroke-width="1.5" marker-end="url(#tbArr)"/>
  <line x1="440" y1="240" x2="428" y2="238" stroke="#cc2222" stroke-width="1.5" marker-end="url(#tbArr)"/>
  <line x1="465" y1="240" x2="478" y2="240" stroke="#cc2222" stroke-width="1.5" marker-end="url(#tbArr)"/>

  <!-- Label -->
  <text x="450" y="275" font-family="serif" font-size="14" fill="#333" text-anchor="middle">"nontrivial" (hairy ball thm)</text>
</svg>