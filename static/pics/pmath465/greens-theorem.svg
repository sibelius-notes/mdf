<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 350" width="450" height="350">
  <rect width="450" height="350" fill="white"/>

  <text x="225" y="25" text-anchor="middle" font-family="serif" font-size="18" font-weight="bold" fill="#222">Green's Theorem</text>

  <defs>
    <marker id="gArr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2266cc"/>
    </marker>
  </defs>

  <!-- Region D with green fill -->
  <path d="M 140,120 C 180,60 300,55 320,100 C 350,150 340,220 300,250 C 260,280 180,270 140,230 C 110,200 100,160 140,120 Z"
        fill="rgba(100,200,120,0.2)" stroke="none"/>

  <!-- Boundary curve with arrows (counterclockwise) -->
  <path d="M 140,120 C 180,60 300,55 320,100 C 350,150 340,220 300,250 C 260,280 180,270 140,230 C 110,200 100,160 140,120 Z"
        fill="none" stroke="#2266cc" stroke-width="2.5"/>

  <!-- CCW arrows along boundary -->
  <!-- Top -->
  <polygon points="220,68 226,62 230,72" fill="#2266cc"/>
  <!-- Right -->
  <polygon points="340,170 345,162 336,160" fill="#2266cc"/>
  <!-- Bottom -->
  <polygon points="240,272 234,278 230,268" fill="#2266cc"/>
  <!-- Left -->
  <polygon points="115,185 110,193 120,195" fill="#2266cc"/>

  <!-- Small tangent arrows along boundary for circulation -->
  <g stroke="#2266cc" stroke-width="1.5" opacity="0.6">
    <line x1="160" y1="90" x2="175" y2="80" marker-end="url(#gArr)"/>
    <line x1="270" y1="65" x2="285" y2="72" marker-end="url(#gArr)"/>
    <line x1="335" y1="130" x2="340" y2="148" marker-end="url(#gArr)"/>
    <line x1="330" y1="230" x2="318" y2="242" marker-end="url(#gArr)"/>
    <line x1="210" y1="275" x2="192" y2="272" marker-end="url(#gArr)"/>
    <line x1="135" y1="220" x2="125" y2="205" marker-end="url(#gArr)"/>
  </g>

  <!-- Interior shading pattern for 2-form -->
  <g opacity="0.15">
    <line x1="160" y1="100" x2="310" y2="100" stroke="#228833" stroke-width="1"/>
    <line x1="145" y1="120" x2="330" y2="120" stroke="#228833" stroke-width="1"/>
    <line x1="130" y1="140" x2="340" y2="140" stroke="#228833" stroke-width="1"/>
    <line x1="120" y1="160" x2="340" y2="160" stroke="#228833" stroke-width="1"/>
    <line x1="115" y1="180" x2="338" y2="180" stroke="#228833" stroke-width="1"/>
    <line x1="120" y1="200" x2="330" y2="200" stroke="#228833" stroke-width="1"/>
    <line x1="135" y1="220" x2="318" y2="220" stroke="#228833" stroke-width="1"/>
    <line x1="155" y1="240" x2="295" y2="240" stroke="#228833" stroke-width="1"/>
    <line x1="180" y1="260" x2="270" y2="260" stroke="#228833" stroke-width="1"/>
  </g>

  <!-- Labels -->
  <text x="230" y="180" text-anchor="middle" font-family="serif" font-size="18" font-style="italic" fill="#228833">D</text>
  <text x="100" y="130" font-family="serif" font-size="14" fill="#2266cc">∂<tspan font-style="italic">D</tspan></text>

  <!-- Equation -->
  <text x="225" y="315" text-anchor="middle" font-family="serif" font-size="15" fill="#333">
    ∮<tspan font-size="11" baseline-shift="sub">∂D</tspan> <tspan font-style="italic">P dx</tspan> + <tspan font-style="italic">Q dy</tspan>  =  ∫∫<tspan font-size="11" baseline-shift="sub">D</tspan> (∂<tspan font-style="italic">Q</tspan>/∂<tspan font-style="italic">x</tspan> − ∂<tspan font-style="italic">P</tspan>/∂<tspan font-style="italic">y</tspan>) <tspan font-style="italic">dA</tspan>
  </text>
  <text x="225" y="340" text-anchor="middle" font-family="serif" font-size="12" fill="#888">circulation = flux of curl</text>
</svg>