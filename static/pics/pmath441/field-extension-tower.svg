<svg viewBox="0 0 260 320" xmlns="http://www.w3.org/2000/svg" style="max-width:260px;display:block;margin:1.5em auto">
  <!-- Tower: Q at bottom, Q(∛2) middle, Q(∛2,ω) at top -->
  <rect x="75" y="260" width="110" height="35" rx="5" stroke="currentColor" stroke-width="1.5" fill="currentColor" fill-opacity="0.05"/>
  <text x="108" y="282" font-size="14" fill="currentColor" font-family="serif">ℚ</text>

  <rect x="60" y="165" width="140" height="35" rx="5" stroke="#3b82f6" stroke-width="1.5" fill="#3b82f6" fill-opacity="0.07"/>
  <text x="70" y="188" font-size="13" fill="#3b82f6" font-family="serif">ℚ(∛2)</text>

  <rect x="45" y="70" width="170" height="35" rx="5" stroke="#22c55e" stroke-width="1.5" fill="#22c55e" fill-opacity="0.07"/>
  <text x="55" y="93" font-size="13" fill="#22c55e" font-family="serif">ℚ(∛2, ω)</text>

  <!-- Lines -->
  <line x1="130" y1="260" x2="130" y2="200" stroke="currentColor" stroke-width="1.5"/>
  <line x1="130" y1="165" x2="130" y2="105" stroke="currentColor" stroke-width="1.5"/>

  <!-- Degree labels -->
  <text x="138" y="236" font-size="13" fill="#ef4444" font-family="serif">[3]</text>
  <text x="138" y="140" font-size="13" fill="#ef4444" font-family="serif">[2]</text>

  <!-- Total degree -->
  <text x="10" y="188" font-size="11" fill="currentColor" font-family="sans-serif">[ℚ(∛2):ℚ] = 3</text>
  <text x="10" y="93" font-size="11" fill="currentColor" font-family="sans-serif">[ℚ(∛2,ω):ℚ] = 6</text>

  <!-- ω label -->
  <text x="10" y="275" font-size="11" fill="currentColor" font-family="sans-serif">ω = e^{2πi/3}</text>
  <text x="10" y="290" font-size="11" fill="currentColor" font-family="sans-serif">primitive 3rd root of unity</text>
  <text x="10" y="305" font-size="11" fill="currentColor" font-family="sans-serif">[ω : ℚ(∛2)] = 2</text>
</svg>
