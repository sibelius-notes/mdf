<svg viewBox="0 0 360 260" xmlns="http://www.w3.org/2000/svg" style="max-width:360px;display:block;margin:1.5em auto">
  <!-- Nested ovals: largest = Integral Domain, then UFD, PID, ED -->
  <!-- Integral Domain (outermost) -->
  <ellipse cx="180" cy="130" rx="165" ry="110" stroke="currentColor" stroke-width="1.8" fill="currentColor" fill-opacity="0.03"/>
  <text x="12" y="40" font-size="12" fill="currentColor" font-family="sans-serif">Integral Domain</text>

  <!-- UFD -->
  <ellipse cx="180" cy="135" rx="130" ry="85" stroke="#3b82f6" stroke-width="1.8" fill="#3b82f6" fill-opacity="0.04"/>
  <text x="60" y="60" font-size="12" fill="#3b82f6" font-family="sans-serif">UFD</text>

  <!-- PID -->
  <ellipse cx="180" cy="140" rx="93" ry="62" stroke="#22c55e" stroke-width="1.8" fill="#22c55e" fill-opacity="0.05"/>
  <text x="118" y="85" font-size="12" fill="#22c55e" font-family="sans-serif">PID</text>

  <!-- ED (innermost) -->
  <ellipse cx="180" cy="145" rx="58" ry="40" stroke="#ef4444" stroke-width="1.8" fill="#ef4444" fill-opacity="0.07"/>
  <text x="162" y="148" font-size="12" fill="#ef4444" font-family="sans-serif">ED</text>

  <!-- Examples -->
  <text x="15" y="220" font-size="10" fill="currentColor" font-family="sans-serif">ID: ℤ[√−5]</text>
  <text x="85" y="220" font-size="10" fill="#3b82f6" font-family="sans-serif">UFD: ℤ[x]</text>
  <text x="155" y="220" font-size="10" fill="#22c55e" font-family="sans-serif">PID: ℤ, F[x]</text>
  <text x="245" y="220" font-size="10" fill="#ef4444" font-family="sans-serif">ED: ℤ[i], F[x]</text>

  <!-- Strict inclusions note -->
  <text x="10" y="245" font-size="11" fill="currentColor" font-family="sans-serif">ED ⊊ PID ⊊ UFD ⊊ Integral Domain</text>
</svg>
