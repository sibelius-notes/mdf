<svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg" style="max-width:300px;display:block;margin:1.5em auto">
  <!-- Subgroups of Z₁₂: Z₁₂, Z₆, Z₄, Z₃, Z₂, Z₁ -->
  <!-- Layout: Z₁₂ at top, then Z₆ Z₄, then Z₃ Z₂, then Z₁ at bottom -->

  <!-- Z₁₂ -->
  <rect x="110" y="20" width="80" height="30" rx="4" stroke="#3b82f6" stroke-width="1.8" fill="#3b82f6" fill-opacity="0.08"/>
  <text x="126" y="40" font-size="13" fill="#3b82f6" font-family="serif">ℤ₁₂</text>

  <!-- Z₆ -->
  <rect x="50" y="105" width="70" height="30" rx="4" stroke="#3b82f6" stroke-width="1.5" fill="#3b82f6" fill-opacity="0.06"/>
  <text x="70" y="125" font-size="13" fill="#3b82f6" font-family="serif">ℤ₆</text>

  <!-- Z₄ -->
  <rect x="180" y="105" width="70" height="30" rx="4" stroke="#22c55e" stroke-width="1.5" fill="#22c55e" fill-opacity="0.06"/>
  <text x="200" y="125" font-size="13" fill="#22c55e" font-family="serif">ℤ₄</text>

  <!-- Z₃ -->
  <rect x="50" y="200" width="70" height="30" rx="4" stroke="#ef4444" stroke-width="1.5" fill="#ef4444" fill-opacity="0.06"/>
  <text x="70" y="220" font-size="13" fill="#ef4444" font-family="serif">ℤ₃</text>

  <!-- Z₂ -->
  <rect x="180" y="200" width="70" height="30" rx="4" stroke="#ef4444" stroke-width="1.5" fill="#ef4444" fill-opacity="0.06"/>
  <text x="200" y="220" font-size="13" fill="#ef4444" font-family="serif">ℤ₂</text>

  <!-- Z₁ = {0} -->
  <rect x="110" y="280" width="80" height="30" rx="4" stroke="currentColor" stroke-width="1.8" fill="currentColor" fill-opacity="0.05"/>
  <text x="120" y="300" font-size="13" fill="currentColor" font-family="serif">{0} = ℤ₁</text>

  <!-- Lines -->
  <!-- Z₁₂ → Z₆ -->
  <line x1="140" y1="50" x2="85" y2="105" stroke="currentColor" stroke-width="1.3"/>
  <!-- Z₁₂ → Z₄ -->
  <line x1="160" y1="50" x2="215" y2="105" stroke="currentColor" stroke-width="1.3"/>
  <!-- Z₆ → Z₃ -->
  <line x1="85" y1="135" x2="85" y2="200" stroke="currentColor" stroke-width="1.3"/>
  <!-- Z₆ → Z₂ -->
  <line x1="100" y1="135" x2="200" y2="200" stroke="currentColor" stroke-width="1.3"/>
  <!-- Z₄ → Z₂ -->
  <line x1="215" y1="135" x2="215" y2="200" stroke="currentColor" stroke-width="1.3"/>
  <!-- Z₃ → Z₁ -->
  <line x1="85" y1="230" x2="150" y2="280" stroke="currentColor" stroke-width="1.3"/>
  <!-- Z₂ → Z₁ -->
  <line x1="215" y1="230" x2="165" y2="280" stroke="currentColor" stroke-width="1.3"/>

  <!-- Index labels on lines -->
  <text x="95" y="80" font-size="10" fill="currentColor" font-family="serif">[2]</text>
  <text x="175" y="80" font-size="10" fill="currentColor" font-family="serif">[3]</text>
  <text x="66" y="170" font-size="10" fill="currentColor" font-family="serif">[2]</text>
  <text x="215" y="170" font-size="10" fill="currentColor" font-family="serif">[2]</text>
  <text x="100" y="265" font-size="10" fill="currentColor" font-family="serif">[3]</text>
  <text x="195" y="265" font-size="10" fill="currentColor" font-family="serif">[2]</text>
</svg>
