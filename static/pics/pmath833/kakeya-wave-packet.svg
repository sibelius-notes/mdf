<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310" viewBox="0 0 700 310">
  <defs>
    <style>
      .bg   { fill: #f9fafb; }
      .bdr  { stroke: #d1d5db; }
      .ttl  { fill: #111827; font-family: Georgia,serif; font-size: 13.5px; font-weight: bold; }
      .lbl  { fill: #374151; font-family: Georgia,serif; font-size: 11.5px; }
      .sub  { fill: #6b7280; font-family: Georgia,serif; font-size: 10.5px; font-style: italic; }
      .cap  { fill: #6b7280; font-family: Georgia,serif; font-size: 10px;   font-style: italic; }
      .ann  { fill: #374151; font-family: Georgia,serif; font-size: 10.5px; }
      .math { fill: #1d4ed8; font-family: Georgia,serif; font-size: 10.5px; font-style: italic; }
      .mathd{ fill: #dc2626; font-family: Georgia,serif; font-size: 10.5px; font-style: italic; }
      .midlbl { fill: #374151; font-family: Georgia,serif; font-size: 11px; }
      .pnl  { fill: #f0f9ff; stroke: #bae6fd; }
      .pnlr { fill: #fff7ed; stroke: #fed7aa; }
      @media (prefers-color-scheme: dark) {
        .bg  { fill: #0f172a; }
        .bdr { stroke: #334155; }
        .ttl { fill: #f1f5f9; }
        .lbl { fill: #cbd5e1; }
        .sub { fill: #94a3b8; }
        .cap { fill: #64748b; }
        .ann { fill: #cbd5e1; }
        .math  { fill: #93c5fd; }
        .mathd { fill: #fca5a5; }
        .midlbl { fill: #cbd5e1; }
        .pnl  { fill: #0c1a2e; stroke: #1e3a5f; }
        .pnlr { fill: #1c0f00; stroke: #92400e; }
      }
    </style>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#374151"/>
    </marker>
    <marker id="mad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#374151"/>
    </marker>
  </defs>

  <rect class="bg"  width="700" height="310" rx="8"/>
  <rect class="bdr" width="700" height="310" rx="8" fill="none" stroke-width="1"/>

  <!-- Title -->
  <text class="ttl" x="350" y="22" text-anchor="middle">Wave Packet Decomposition — The Restriction–Kakeya Bridge</text>

  <!-- ══════ LEFT PANEL: Frequency sphere ══════ -->
  <rect class="pnl" x="20" y="36" width="290" height="228" rx="6" stroke-width="1"/>
  <text class="sub" x="165" y="54" text-anchor="middle">Frequency space  (sphere S^{n−1})</text>

  <!-- Sphere outline (circle) -->
  <circle cx="165" cy="158" r="88" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/>
  <!-- Equator ellipse to give 3D feel -->
  <ellipse cx="165" cy="158" rx="88" ry="22" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="5,4" opacity="0.45"/>

  <!-- Highlighted cap τ (small circular region on sphere) -->
  <!-- Cap centered near top, angular radius δ ≈ 18° -->
  <ellipse cx="165" cy="76" rx="28" ry="12" fill="#fbbf24" stroke="#d97706" stroke-width="2" opacity="0.85"/>
  <text class="math" x="165" y="73" text-anchor="middle" fill="#92400e" font-size="12px">τ</text>

  <!-- Normal vector ω from cap center outward -->
  <line x1="165" y1="76" x2="165" y2="38" stroke="#dc2626" stroke-width="2" marker-end="url(#ma)"/>
  <text class="mathd" x="174" y="55" font-size="12px">ω</text>

  <!-- Angular radius label δ -->
  <line x1="165" y1="76" x2="193" y2="72" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text class="math" x="200" y="74" fill="#92400e" font-size="11px">δ</text>

  <!-- Other parts of sphere (greyed) -->
  <!-- A few grid lines -->
  <line x1="77"  y1="158" x2="253" y2="158" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,4" opacity="0.4"/>
  <line x1="165" y1="70"  x2="165" y2="246" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,4" opacity="0.4"/>

  <!-- Cap size annotation -->
  <text class="math" x="165" y="103" text-anchor="middle" font-size="10px" fill="#92400e">|τ| ~ δ^{n−1}</text>

  <!-- Labels -->
  <text class="ann" x="165" y="250" text-anchor="middle">Cap τ of angular radius δ</text>
  <text class="ann" x="165" y="265" text-anchor="middle">on the sphere S^{n−1}</text>

  <!-- ══════ MIDDLE: Fourier uncertainty arrow ══════ -->
  <text class="midlbl" x="350" y="140" text-anchor="middle">Fourier</text>
  <text class="midlbl" x="350" y="156" text-anchor="middle">Uncertainty</text>
  <line x1="314" y1="163" x2="386" y2="163" stroke="#374151" stroke-width="1.5" marker-end="url(#ma)" marker-start="url(#mad)"/>
  <text class="sub" x="350" y="180" text-anchor="middle">Δx · Δξ ≳ 1</text>

  <!-- cap ↔ tube correspondence summary -->
  <text class="ann"  x="350" y="205" text-anchor="middle">δ-cap</text>
  <text class="sub"  x="350" y="220" text-anchor="middle">⟺</text>
  <text class="ann"  x="350" y="238" text-anchor="middle">δ-tube</text>

  <!-- ══════ RIGHT PANEL: Physical space tube ══════ -->
  <rect class="pnlr" x="390" y="36" width="290" height="228" rx="6" stroke-width="1"/>
  <text class="sub" x="535" y="54" text-anchor="middle">Physical space  (wave packet)</text>

  <!-- Tube: long thin parallelogram in direction ω (pointing up-right) -->
  <!-- Direction ω ≈ vertical (top of sphere), so tube is mostly vertical
       Width ~ 1/δ, length ~ 1/δ²
       Let's draw a long thin rectangle tilted slightly -->
  <!-- Tube centered at (535,160), length 160, width 18, tilted ~10° -->
  <rect x="526" y="68" width="18" height="165" rx="3"
        fill="#fef3c7" stroke="#d97706" stroke-width="2"
        transform="rotate(8 535 150)"/>

  <!-- Width annotation: 1/δ -->
  <line x1="512" y1="148" x2="553" y2="143" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>
  <text class="mathd" x="500" y="145" text-anchor="end" font-size="11px" fill="#92400e">~ 1/δ</text>

  <!-- Length annotation: 1/δ² -->
  <line x1="552" y1="69"  x2="558" y2="232" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2"/>
  <text class="mathd" x="562" y="160" font-size="11px" fill="#92400e">~ 1/δ²</text>

  <!-- Direction arrow ω along tube -->
  <line x1="534" y1="230" x2="540" y2="78" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ma)"/>
  <text class="mathd" x="545" y="95" font-size="12px">ω</text>

  <!-- Labels -->
  <text class="ann" x="535" y="250" text-anchor="middle">Wave packet in direction ω</text>
  <text class="ann" x="535" y="265" text-anchor="middle">dimensions 1/δ × ··· × 1/δ²</text>

  <!-- Footer: Kakeya connection -->
  <text class="cap" x="350" y="286" text-anchor="middle">Many caps cover S^{n−1}  ⟹  their tubes point in all directions — exactly the Kakeya condition.</text>
  <text class="cap" x="350" y="300" text-anchor="middle">If these tubes fit in a small set  ⟹  restriction fails.  Kakeya conjecture ⟹  restriction conjecture.</text>
</svg>
