<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330">
  <defs>
    <style>
      .bg  { fill: #f9fafb; }
      .bdr { stroke: #d1d5db; }
      .ttl { fill: #111827; font-family: Georgia,serif; font-size: 13.5px; font-weight: bold; }
      .lbl { fill: #374151; font-family: Georgia,serif; font-size: 11.5px; }
      .sub { fill: #6b7280; font-family: Georgia,serif; font-size: 10.5px; font-style: italic; }
      .cap { fill: #6b7280; font-family: Georgia,serif; font-size: 10px;   font-style: italic; }
      .ann { fill: #374151; font-family: Georgia,serif; font-size: 10.5px; }
      .hdr { fill: #1d4ed8; font-family: Georgia,serif; font-size: 12px;   font-weight: bold; }
      .res { fill: #15803d; font-family: Georgia,serif; font-size: 11px;   font-weight: bold; }
      .fml { fill: #7c3aed; font-family: Georgia,serif; font-size: 11px;   font-style: italic; }
      .red { fill: #dc2626; font-family: Georgia,serif; font-size: 10.5px; }
      .pnl { fill: #f5f3ff; stroke: #ddd6fe; }
      .pnlb{ fill: #eff6ff; stroke: #bfdbfe; }
      .pnlg{ fill: #f0fdf4; stroke: #bbf7d0; }
      @media (prefers-color-scheme: dark) {
        .bg  { fill: #0f172a; }
        .bdr { stroke: #334155; }
        .ttl { fill: #f1f5f9; }
        .lbl { fill: #cbd5e1; }
        .sub { fill: #94a3b8; }
        .cap { fill: #64748b; }
        .ann { fill: #cbd5e1; }
        .hdr { fill: #93c5fd; }
        .res { fill: #4ade80; }
        .fml { fill: #c4b5fd; }
        .red { fill: #fca5a5; }
        .pnl { fill: #1e1b4b; stroke: #4338ca; }
        .pnlb{ fill: #0c1a2e; stroke: #1e3a5f; }
        .pnlg{ fill: #052e16; stroke: #14532d; }
      }
    </style>
  </defs>

  <rect class="bg"  width="700" height="330" rx="8"/>
  <rect class="bdr" width="700" height="330" rx="8" fill="none" stroke-width="1"/>

  <!-- Title -->
  <text class="ttl" x="350" y="22" text-anchor="middle">Furstenberg Sets and the Wang–Zahl Theorem</text>

  <!-- ══════ LEFT PANEL: Definition of (s,t)-Furstenberg set ══════ -->
  <rect class="pnlb" x="18"  y="35" width="305" height="240" rx="5" stroke-width="1"/>
  <text class="hdr" x="170" y="53" text-anchor="middle">Definition: (s, t)-Furstenberg Set</text>

  <!-- Coordinate axes -->
  <line x1="40" y1="245" x2="40"  y2="72"  stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="40" y1="245" x2="305" y2="245" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="cap" x="310" y="248">x</text>
  <text class="cap" x="35"  y="70" >y</text>

  <!-- Family of lines through the set — each with a thick s-dimensional intersection -->
  <!-- Line 1: steep slope, left side — blue, thick segment = s-dim piece -->
  <line x1="55"  y1="80"  x2="100" y2="245" stroke="#93c5fd" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="63"  y1="105" x2="82"  y2="180" stroke="#2563eb" stroke-width="5"   opacity="0.7"/>  <!-- s-dim piece -->
  <!-- Line 2: moderate slope — orange -->
  <line x1="40"  y1="155" x2="225" y2="78"  stroke="#fed7aa" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="88"  y1="138" x2="160" y2="103" stroke="#d97706" stroke-width="5"   opacity="0.7"/>
  <!-- Line 3: nearly horizontal — green -->
  <line x1="40"  y1="210" x2="305" y2="195" stroke="#bbf7d0" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="80"  y1="208" x2="185" y2="200" stroke="#16a34a" stroke-width="5"   opacity="0.7"/>
  <!-- Line 4: steep negative slope — purple -->
  <line x1="200" y1="78"  x2="245" y2="245" stroke="#ddd6fe" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="212" y1="115" x2="232" y2="193" stroke="#7c3aed" stroke-width="5"   opacity="0.7"/>
  <!-- Line 5: mild positive slope — red -->
  <line x1="40"  y1="130" x2="305" y2="175" stroke="#fecaca" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="100" y1="140" x2="210" y2="157" stroke="#dc2626" stroke-width="5"   opacity="0.7"/>

  <!-- Dots on the lines indicating s-dim pieces -->
  <circle cx="72"  cy="143" r="3.5" fill="#2563eb"/>
  <circle cx="124" cy="120" r="3.5" fill="#d97706"/>
  <circle cx="133" cy="204" r="3.5" fill="#16a34a"/>
  <circle cx="222" cy="154" r="3.5" fill="#7c3aed"/>
  <circle cx="155" cy="149" r="3.5" fill="#dc2626"/>

  <!-- Annotation: the set E -->
  <!-- E = union of thick segments -->
  <text class="ann" x="170" y="258" text-anchor="middle">E ⊂ ℝ²   contains an s-dim subset</text>
  <text class="ann" x="170" y="272" text-anchor="middle">of each line  ℓ  in a t-dim family  L</text>

  <!-- Legend -->
  <line x1="40" y1="284" x2="68" y2="284" stroke="#2563eb" stroke-width="4.5" opacity="0.7"/>
  <text class="cap" x="72" y="287">s-dimensional piece on ℓ</text>
  <line x1="40" y1="297" x2="68" y2="297" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.8"/>
  <text class="cap" x="72" y="300">full line ℓ ∈ L</text>

  <!-- ══════ RIGHT PANEL: Wang-Zahl bound ══════ -->
  <rect class="pnlg" x="375" y="35" width="308" height="240" rx="5" stroke-width="1"/>
  <text class="res" x="529" y="53" text-anchor="middle">Wang–Zahl Theorem (2024)</text>

  <!-- Theorem statement -->
  <text class="ann" x="529" y="75" text-anchor="middle">For any (s, t)-Furstenberg set E ⊂ ℝ²:</text>

  <rect x="395" y="85" width="270" height="60" rx="4" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
  <text class="fml" x="530" y="110" text-anchor="middle">dim_H(E)  ≥  max ( s + t,  (3s + t)/2 )</text>
  <text class="sub" x="530" y="132" text-anchor="middle">s ∈ (0,1],  t ∈ [1,2]</text>

  <!-- What the two terms mean -->
  <text class="ann" x="529" y="160" text-anchor="middle">First term  s + t:</text>
  <text class="sub" x="529" y="175" text-anchor="middle">naive dimension counting</text>
  <text class="sub" x="529" y="189" text-anchor="middle">(s-dim slices over t-dim base)</text>

  <text class="ann" x="529" y="210" text-anchor="middle">Second term  (3s + t)/2  [Wang–Zahl]:</text>
  <text class="sub" x="529" y="225" text-anchor="middle">multi-scale energy argument</text>
  <text class="sub" x="529" y="239" text-anchor="middle">beats  s + t  when  s &gt; t/2 − t/2  ... </text>
  <text class="sub" x="529" y="253" text-anchor="middle">i.e., when  s &gt; (t−t/2) = t/2  ... always!</text>

  <!-- Kakeya as special case -->
  <rect x="395" y="263" width="270" height="44" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text class="res" x="530" y="281" text-anchor="middle">Kakeya in ℝ³ as special case:</text>
  <text class="ann" x="530" y="298" text-anchor="middle">s = t = 1  ⟹  dim_H(E) ≥ (3+1)/2 = 2  [planar]</text>
  <!-- the 3D case is t=2, s=1 -->
  <text class="ann" x="530" y="313" text-anchor="middle">s = 1, t = 2  ⟹  dim_H(E) ≥ (3+2)/2 = 5/2  [ℝ³]</text>

  <!-- ══════ BOTTOM BAR ══════ -->
  <rect x="18" y="282" width="348" height="40" rx="5" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text class="fml" x="192" y="299" text-anchor="middle">Furstenberg conjecture: dim_H(E) = min(2, s + t)</text>
  <text class="cap" x="192" y="316" text-anchor="middle">Wang–Zahl proves it when (3s+t)/2 = min(2, s+t),  including Kakeya.</text>
</svg>
