<svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;display:block;margin:1.5em auto">
  <defs>
    <marker id="arrcx" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
  </defs>
  <!-- Box 1: Pre-measure -->
  <rect x="10" y="50" width="100" height="60" rx="6" stroke="#3b82f6" stroke-width="1.8" fill="#3b82f6" fill-opacity="0.07"/>
  <text x="17" y="72" font-size="11" fill="#3b82f6" font-family="sans-serif">Pre-measure</text>
  <text x="20" y="87" font-size="11" fill="currentColor" font-family="serif">μ₀ on 𝒜</text>
  <text x="17" y="102" font-size="10" fill="currentColor" font-family="sans-serif">(algebra)</text>

  <!-- Arrow 1 -->
  <line x1="115" y1="80" x2="148" y2="80" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrcx)"/>
  <text x="116" y="72" font-size="10" fill="currentColor" font-family="sans-serif">define</text>
  <text x="112" y="60" font-size="10" fill="currentColor" font-family="sans-serif">μ*(A)=</text>
  <text x="108" y="48" font-size="9" fill="currentColor" font-family="sans-serif">inf{Σμ₀(Aₙ)}</text>

  <!-- Box 2: Outer measure -->
  <rect x="150" y="50" width="100" height="60" rx="6" stroke="#ef4444" stroke-width="1.8" fill="#ef4444" fill-opacity="0.07"/>
  <text x="158" y="72" font-size="11" fill="#ef4444" font-family="sans-serif">Outer measure</text>
  <text x="162" y="87" font-size="11" fill="currentColor" font-family="serif">μ* on 2^X</text>
  <text x="156" y="102" font-size="10" fill="currentColor" font-family="sans-serif">(all subsets)</text>

  <!-- Arrow 2 -->
  <line x1="255" y1="80" x2="288" y2="80" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrcx)"/>
  <text x="254" y="72" font-size="10" fill="currentColor" font-family="sans-serif">Carathéodory</text>
  <text x="261" y="60" font-size="10" fill="currentColor" font-family="sans-serif">criterion</text>

  <!-- Box 3: Measure -->
  <rect x="290" y="50" width="100" height="60" rx="6" stroke="#22c55e" stroke-width="1.8" fill="#22c55e" fill-opacity="0.07"/>
  <text x="298" y="72" font-size="11" fill="#22c55e" font-family="sans-serif">Measure</text>
  <text x="298" y="87" font-size="11" fill="currentColor" font-family="serif">μ on σ(𝒜)</text>
  <text x="294" y="102" font-size="10" fill="currentColor" font-family="sans-serif">(σ-algebra)</text>

  <!-- Caption -->
  <text x="10" y="135" font-size="11" fill="currentColor" font-family="sans-serif">Carathéodory Extension Theorem: μ₀ → μ* → μ (unique if σ-finite)</text>
</svg>
