<svg xmlns="http://www.w3.org/2000/svg" width="550" height="400" viewBox="0 0 550 400">
  <rect width="550" height="400" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" fill="#333">
      <polygon points="0 0, 8 3, 0 6"/>
    </marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" fill="#6A0DAD">
      <polygon points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="275" y="30" font-family="serif" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">Gauss Map</text>

  <!-- Curved surface on the left -->
  <g transform="translate(130, 220)">
    <path d="M -100,30 C -60,-50 0,-80 60,-50 C 120,-20 100,50 80,60 C 40,80 -60,70 -100,30 Z" fill="rgba(100,149,237,0.15)" stroke="#4169E1" stroke-width="2.5"/>

    <!-- Points on surface -->
    <circle cx="-40" cy="-10" r="4" fill="#C00"/>
    <circle cx="20" cy="-35" r="4" fill="#C00"/>
    <circle cx="50" cy="10" r="4" fill="#C00"/>
    <circle cx="-10" cy="30" r="4" fill="#C00"/>

    <!-- Normal vectors at points -->
    <line x1="-40" y1="-10" x2="-55" y2="-55" stroke="#6A0DAD" stroke-width="2" marker-end="url(#arrPurple)"/>
    <line x1="20" y1="-35" x2="15" y2="-80" stroke="#6A0DAD" stroke-width="2" marker-end="url(#arrPurple)"/>
    <line x1="50" y1="10" x2="70" y2="-30" stroke="#6A0DAD" stroke-width="2" marker-end="url(#arrPurple)"/>
    <line x1="-10" y1="30" x2="-15" y2="-15" stroke="#6A0DAD" stroke-width="2" marker-end="url(#arrPurple)"/>

    <!-- Normal label -->
    <text x="-75" y="-60" font-family="serif" font-size="14" fill="#6A0DAD" font-weight="bold">n</text>

    <!-- Surface label -->
    <text x="-30" y="80" font-family="serif" font-size="16" fill="#4169E1" font-style="italic" font-weight="bold">&sigma;(U)</text>
  </g>

  <!-- Arrow n (Gauss map) -->
  <path d="M 230,200 C 270,180 300,180 340,200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="270" y="175" font-family="serif" font-size="18" fill="#333" font-weight="bold" font-style="italic">n</text>

  <!-- Unit sphere S² on the right -->
  <g transform="translate(420, 220)">
    <!-- Sphere -->
    <circle cx="0" cy="0" r="80" fill="rgba(144,238,144,0.12)" stroke="#228B22" stroke-width="2.5"/>

    <!-- Equator -->
    <ellipse cx="0" cy="0" rx="80" ry="20" fill="none" stroke="rgba(34,139,34,0.3)" stroke-width="1"/>

    <!-- Meridian -->
    <ellipse cx="0" cy="0" rx="20" ry="80" fill="none" stroke="rgba(34,139,34,0.3)" stroke-width="1"/>

    <!-- Mapped normal tips on sphere -->
    <circle cx="-30" cy="-50" r="4" fill="#C00"/>
    <circle cx="5" cy="-70" r="4" fill="#C00"/>
    <circle cx="40" cy="-35" r="4" fill="#C00"/>
    <circle cx="-10" cy="-20" r="4" fill="#C00"/>

    <!-- Gauss map image region (shaded) -->
    <path d="M -30,-50 C -10,-75 15,-72 5,-70 C 20,-60 45,-40 40,-35 C 30,-20 0,-15 -10,-20 C -25,-30 -35,-45 -30,-50 Z" fill="rgba(255,100,100,0.2)" stroke="#C00" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- S² label -->
    <text x="-15" y="100" font-family="serif" font-size="18" fill="#228B22" font-weight="bold">S</text>
    <text x="3" y="93" font-family="serif" font-size="13" fill="#228B22">2</text>
  </g>

  <!-- Dashed lines connecting corresponding points -->
  <line x1="90" y1="210" x2="390" y2="170" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="150" y1="185" x2="425" y2="150" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="180" y1="230" x2="460" y2="185" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="120" y1="250" x2="410" y2="200" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Formula -->
  <text x="275" y="370" font-family="serif" font-size="15" fill="#333" text-anchor="middle">n : &sigma;(U) &rarr; S&sup2;,  n(p) = unit normal at p</text>
</svg>