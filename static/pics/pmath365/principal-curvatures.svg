<svg xmlns="http://www.w3.org/2000/svg" width="550" height="400" viewBox="0 0 550 400">
  <rect width="550" height="400" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" fill="#333">
      <polygon points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="275" y="30" font-family="serif" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">Principal Curvatures</text>

  <!-- Saddle surface -->
  <g transform="translate(230, 200)">
    <!-- Saddle shape using curves -->
    <!-- u-direction curves (curving up = positive curvature) -->
    <path d="M -150,30 C -100,-40 -30,-60 0,-20 C 30,-60 100,-40 150,30" fill="none" stroke="#4169E1" stroke-width="2"/>
    <path d="M -130,10 C -80,-50 -20,-70 0,-35 C 20,-70 80,-50 130,10" fill="none" stroke="rgba(65,105,225,0.4)" stroke-width="1.5"/>

    <!-- v-direction curves (curving down = negative curvature) -->
    <path d="M 0,-80 C -15,-40 -20,-10 0,-20 C 20,-10 15,-40 0,40" fill="none" stroke="#CC0000" stroke-width="2"/>

    <!-- Surface fill approximation -->
    <path d="M -150,30 C -100,-40 -30,-60 0,-20 C 30,-60 100,-40 150,30 C 130,50 50,60 0,40 C -50,60 -130,50 -150,30 Z" fill="rgba(100,149,237,0.1)" stroke="none"/>

    <!-- Bottom curves -->
    <path d="M -150,30 C -130,50 -50,60 0,40 C 50,60 130,50 150,30" fill="none" stroke="#4169E1" stroke-width="2"/>

    <!-- Point p at the saddle -->
    <circle cx="0" cy="-20" r="5" fill="#C00"/>
    <text x="8" y="-25" font-family="serif" font-size="16" font-style="italic" fill="#C00" font-weight="bold">p</text>

    <!-- Principal direction 1 (positive curvature, horizontal) -->
    <line x1="-80" y1="-20" x2="80" y2="-20" stroke="#4169E1" stroke-width="2.5" marker-end="url(#arr)" stroke-dasharray="6,3"/>

    <!-- Osculating circle for kappa_1 (curving upward = positive) -->
    <circle cx="0" cy="-120" r="100" fill="none" stroke="#4169E1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="60" y="-100" font-family="serif" font-size="16" fill="#4169E1" font-weight="bold">κ</text>
    <text x="73" y="-95" font-family="serif" font-size="12" fill="#4169E1">1</text>
    <text x="82" y="-100" font-family="serif" font-size="16" fill="#4169E1"> &gt; 0</text>

    <!-- Principal direction 2 (negative curvature, vertical) -->
    <line x1="0" y1="-70" x2="0" y2="30" stroke="#CC0000" stroke-width="2.5" marker-end="url(#arr)" stroke-dasharray="6,3"/>

    <!-- Osculating circle for kappa_2 (curving downward = negative) -->
    <circle cx="0" cy="60" r="80" fill="none" stroke="#CC0000" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="-90" y="70" font-family="serif" font-size="16" fill="#CC0000" font-weight="bold">κ</text>
    <text x="-77" y="75" font-family="serif" font-size="12" fill="#CC0000">2</text>
    <text x="-68" y="70" font-family="serif" font-size="16" fill="#CC0000"> &lt; 0</text>
  </g>

  <!-- Direction labels -->
  <text x="400" y="155" font-family="serif" font-size="14" fill="#4169E1" font-style="italic">principal direction 1</text>
  <text x="55" y="310" font-family="serif" font-size="14" fill="#CC0000" font-style="italic">principal direction 2</text>

  <!-- Gaussian curvature formula -->
  <g transform="translate(275, 375)">
    <text x="0" y="0" font-family="serif" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">K = κ</text>
    <text x="33" y="5" font-family="serif" font-size="12" fill="#333">1</text>
    <text x="42" y="0" font-family="serif" font-size="17" fill="#333" font-weight="bold">κ</text>
    <text x="55" y="5" font-family="serif" font-size="12" fill="#333">2</text>
    <text x="65" y="0" font-family="serif" font-size="17" fill="#C00" font-weight="bold"> &lt; 0</text>
    <text x="120" y="0" font-family="serif" font-size="14" fill="#666"> (saddle point)</text>
  </g>
</svg>