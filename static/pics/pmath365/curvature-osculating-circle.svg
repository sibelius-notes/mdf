<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <rect width="500" height="400" fill="white"/>

  <defs>
    <marker id="arrowT" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#cc2222"/>
    </marker>
    <marker id="arrowN" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2266bb"/>
    </marker>
    <marker id="arrowDim" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- The curve -->
  <path d="M 40,340 C 80,300 120,200 200,230 C 280,260 320,320 420,280 C 460,265 480,240 490,220"
        fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Point p on the curve -->
  <circle cx="200" cy="230" r="4.5" fill="#333"/>
  <text x="185" y="250" font-family="serif" font-style="italic" font-size="17" fill="#333">p</text>

  <!-- Osculating circle (center along N from p) -->
  <!-- Center at approximately (200, 120), radius ~110 -->
  <circle cx="200" cy="120" r="110" fill="none" stroke="#6644aa" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Center of osculating circle -->
  <circle cx="200" cy="120" r="3.5" fill="#6644aa"/>
  <text x="210" y="115" font-family="sans-serif" font-size="13" fill="#6644aa">center</text>

  <!-- Tangent vector T (along curve direction at p) -->
  <line x1="200" y1="230" x2="265" y2="240" stroke="#cc2222" stroke-width="2.5" marker-end="url(#arrowT)"/>
  <text x="270" y="245" font-family="serif" font-style="italic" font-size="18" fill="#cc2222" font-weight="bold">T</text>

  <!-- Normal vector N (pointing toward center of osculating circle) -->
  <line x1="200" y1="230" x2="200" y2="160" stroke="#2266bb" stroke-width="2.5" marker-end="url(#arrowN)"/>
  <text x="207" y="165" font-family="serif" font-style="italic" font-size="18" fill="#2266bb" font-weight="bold">N</text>

  <!-- Radius line from p to center (1/kappa) -->
  <line x1="205" y1="228" x2="205" y2="122" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- 1/kappa label with dimension line -->
  <text x="215" y="180" font-family="serif" font-size="14" fill="#888">1/&#x3BA;</text>

  <!-- Curvature label -->
  <text x="310" y="55" font-family="serif" font-size="15" fill="#6644aa">osculating circle</text>
  <text x="310" y="75" font-family="serif" font-size="14" fill="#6644aa">radius = 1/&#x3BA;</text>

  <!-- Arrow from label to circle -->
  <line x1="350" y1="80" x2="290" y2="105" stroke="#6644aa" stroke-width="1" marker-end="url(#arrowDim)"/>

  <!-- Kappa label -->
  <text x="60" y="35" font-family="serif" font-size="16" fill="#333">Curvature &#x3BA; at p:</text>
  <text x="60" y="58" font-family="serif" font-size="15" fill="#333">circle fits curve to 2nd order</text>
</svg>