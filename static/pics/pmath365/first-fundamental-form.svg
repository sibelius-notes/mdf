<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350" viewBox="0 0 500 350">
  <rect width="500" height="350" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" fill="#333">
      <polygon points="0 0, 8 3, 0 6"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" fill="#4169E1">
      <polygon points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="250" y="30" font-family="serif" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">First Fundamental Form</text>

  <!-- Curved surface -->
  <path d="M 60,200 C 100,100 200,80 280,120 C 360,160 400,130 440,170 C 440,230 380,280 300,270 C 220,260 140,290 60,200 Z" fill="rgba(100,149,237,0.12)" stroke="#4169E1" stroke-width="2.5"/>

  <!-- Coordinate grid lines on surface (u-lines) -->
  <path d="M 100,185 C 150,140 230,130 310,155" fill="none" stroke="rgba(100,149,237,0.4)" stroke-width="1"/>
  <path d="M 110,210 C 160,170 240,160 320,180" fill="none" stroke="rgba(100,149,237,0.4)" stroke-width="1"/>
  <path d="M 120,240 C 170,200 250,190 330,210" fill="none" stroke="rgba(100,149,237,0.4)" stroke-width="1"/>

  <!-- Coordinate grid lines on surface (v-lines) -->
  <path d="M 140,150 C 145,180 150,210 155,250" fill="none" stroke="rgba(100,149,237,0.4)" stroke-width="1"/>
  <path d="M 210,130 C 215,165 220,200 225,240" fill="none" stroke="rgba(100,149,237,0.4)" stroke-width="1"/>
  <path d="M 280,140 C 285,170 290,200 295,230" fill="none" stroke="rgba(100,149,237,0.4)" stroke-width="1"/>

  <!-- Small coordinate patch (quadrilateral) -->
  <path d="M 180,155 L 250,145 L 260,185 L 190,195 Z" fill="rgba(255,165,0,0.25)" stroke="#CC6600" stroke-width="2"/>

  <!-- Point p -->
  <circle cx="220" cy="170" r="4" fill="#C00"/>
  <text x="226" y="164" font-family="serif" font-size="14" font-style="italic" fill="#C00">p</text>

  <!-- Metric ellipse at point (representing unit circle of metric) -->
  <g transform="translate(220, 170)">
    <ellipse cx="0" cy="0" rx="35" ry="20" transform="rotate(-15)" fill="none" stroke="#8B0000" stroke-width="2" stroke-dasharray="5,3"/>

    <!-- Axes of ellipse -->
    <line x1="-38" y1="10" x2="38" y2="-10" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="-8" y1="-22" x2="8" y2="22" stroke="#8B0000" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- E, F, G labels -->
  <g transform="translate(350, 90)">
    <rect x="0" y="0" width="130" height="100" rx="8" fill="rgba(255,255,240,0.9)" stroke="#999" stroke-width="1"/>
    <text x="15" y="25" font-family="serif" font-size="15" fill="#333" font-style="italic">E</text>
    <text x="30" y="25" font-family="serif" font-size="15" fill="#333"> = σ</text>
    <text x="67" y="30" font-family="serif" font-size="11" fill="#333">u</text>
    <text x="75" y="25" font-family="serif" font-size="15" fill="#333"> · σ</text>
    <text x="105" y="30" font-family="serif" font-size="11" fill="#333">u</text>

    <text x="15" y="52" font-family="serif" font-size="15" fill="#333" font-style="italic">F</text>
    <text x="30" y="52" font-family="serif" font-size="15" fill="#333"> = σ</text>
    <text x="67" y="57" font-family="serif" font-size="11" fill="#333">u</text>
    <text x="75" y="52" font-family="serif" font-size="15" fill="#333"> · σ</text>
    <text x="105" y="57" font-family="serif" font-size="11" fill="#333">v</text>

    <text x="15" y="79" font-family="serif" font-size="15" fill="#333" font-style="italic">G</text>
    <text x="30" y="79" font-family="serif" font-size="15" fill="#333"> = σ</text>
    <text x="67" y="84" font-family="serif" font-size="11" fill="#333">v</text>
    <text x="75" y="79" font-family="serif" font-size="15" fill="#333"> · σ</text>
    <text x="105" y="84" font-family="serif" font-size="11" fill="#333">v</text>
  </g>

  <!-- ds² formula -->
  <text x="250" y="320" font-family="serif" font-size="16" fill="#222" text-anchor="middle">
    ds² = E du² + 2F du dv + G dv²
  </text>

  <!-- Label -->
  <text x="250" y="340" font-family="serif" font-size="15" fill="#4169E1" text-anchor="middle" font-style="italic" font-weight="bold">first fundamental form g</text>
</svg>