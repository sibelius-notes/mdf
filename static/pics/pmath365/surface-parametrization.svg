<svg xmlns="http://www.w3.org/2000/svg" width="550" height="400" viewBox="0 0 550 400">
  <rect width="550" height="400" fill="white"/>

  <!-- Domain U in R² -->
  <g transform="translate(80, 220)">
    <!-- Axes -->
    <line x1="-40" y1="0" x2="120" y2="0" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="0" y1="40" x2="0" y2="-120" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="125" y="5" font-family="serif" font-size="16" font-style="italic" fill="#333">u</text>
    <text x="5" y="-122" font-family="serif" font-size="16" font-style="italic" fill="#333">v</text>

    <!-- Rectangle U -->
    <rect x="15" y="-90" width="80" height="70" fill="rgba(100,149,237,0.15)" stroke="#4169E1" stroke-width="2"/>
    <text x="40" y="-95" font-family="serif" font-size="18" font-weight="bold" font-style="italic" fill="#4169E1">U</text>

    <!-- Small dot in U -->
    <circle cx="55" cy="-55" r="3" fill="#C00"/>

    <!-- R² label -->
    <text x="30" y="55" font-family="serif" font-size="16" fill="#333">R</text>
    <text x="43" y="50" font-family="serif" font-size="12" fill="#333">2</text>
  </g>

  <!-- Arrow sigma -->
  <g>
    <path d="M 200,175 C 240,155 270,155 310,175" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="240" y="150" font-family="serif" font-size="20" font-style="italic" fill="#333" font-weight="bold">σ</text>
  </g>

  <!-- Curved surface in R³ -->
  <g transform="translate(400, 180)">
    <!-- Surface mesh -->
    <path d="M -80,40 C -60,-20 -20,-60 20,-40 C 60,-20 80,20 100,0" fill="none" stroke="rgba(100,149,237,0.4)" stroke-width="1"/>
    <path d="M -70,20 C -50,-40 -10,-80 30,-60 C 70,-40 90,0 110,-20" fill="none" stroke="rgba(100,149,237,0.4)" stroke-width="1"/>
    <path d="M -60,0 C -40,-60 0,-100 40,-80 C 80,-60 100,-20 120,-40" fill="none" stroke="rgba(100,149,237,0.4)" stroke-width="1"/>

    <!-- Surface outline -->
    <path d="M -90,50 C -70,-10 -30,-70 30,-50 C 90,-30 100,30 120,-10" fill="rgba(100,149,237,0.12)" stroke="#4169E1" stroke-width="2.5"/>
    <path d="M -90,50 C -80,70 -40,80 0,70 C 40,60 80,40 120,-10" fill="rgba(100,149,237,0.12)" stroke="#4169E1" stroke-width="2.5"/>

    <!-- Vertical grid lines -->
    <path d="M -50,58 C -40,-10 -10,-60 10,-50" fill="none" stroke="rgba(100,149,237,0.35)" stroke-width="1"/>
    <path d="M 0,70 C 10,10 30,-50 50,-45" fill="none" stroke="rgba(100,149,237,0.35)" stroke-width="1"/>
    <path d="M 50,55 C 55,15 70,-30 85,-30" fill="none" stroke="rgba(100,149,237,0.35)" stroke-width="1"/>

    <!-- Point on surface -->
    <circle cx="10" cy="5" r="4" fill="#C00"/>

    <!-- Tangent vector sigma_u -->
    <line x1="10" y1="5" x2="70" y2="-15" stroke="#CC0000" stroke-width="2.5" marker-end="url(#redarrow)"/>

    <!-- Tangent vector sigma_v -->
    <line x1="10" y1="5" x2="-20" y2="-50" stroke="#006600" stroke-width="2.5" marker-end="url(#greenarrow)"/>

    <!-- Tangent plane (translucent) -->
    <path d="M -50,-35 L 30,-65 L 70,5 L -10,35 Z" fill="rgba(255,200,100,0.2)" stroke="rgba(200,150,50,0.5)" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- Labels -->
    <text x="72" y="-20" font-family="serif" font-size="15" fill="#CC0000" font-weight="bold">σ</text>
    <text x="82" y="-14" font-family="serif" font-size="11" fill="#CC0000" font-style="italic">u</text>
    <text x="-45" y="-50" font-family="serif" font-size="15" fill="#006600" font-weight="bold">σ</text>
    <text x="-35" y="-44" font-family="serif" font-size="11" fill="#006600" font-style="italic">v</text>

    <!-- sigma(U) label -->
    <text x="-20" y="90" font-family="serif" font-size="16" font-style="italic" fill="#4169E1" font-weight="bold">σ(U)</text>
  </g>

  <!-- Tangent plane label -->
  <text x="320" y="100" font-family="serif" font-size="14" fill="#996600" font-style="italic">tangent plane</text>

  <!-- R³ label -->
  <text x="440" y="340" font-family="serif" font-size="16" fill="#333">R</text>
  <text x="453" y="335" font-family="serif" font-size="12" fill="#333">3</text>

  <!-- Title -->
  <text x="275" y="30" font-family="serif" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">Surface Parametrization</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#333">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="redarrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#CC0000">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="greenarrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#006600">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
  </defs>
</svg>