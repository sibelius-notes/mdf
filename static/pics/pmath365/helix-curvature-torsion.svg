<svg xmlns="http://www.w3.org/2000/svg" width="450" height="400" viewBox="0 0 450 400">
  <rect width="450" height="400" fill="white"/>

  <defs>
    <marker id="arrowHT" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#cc2222"/>
    </marker>
    <marker id="arrowHP" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#22aa44"/>
    </marker>
    <marker id="arrowHB" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#2266bb"/>
    </marker>
    <marker id="arrowDimH" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- Central axis (dashed) -->
  <line x1="200" y1="370" x2="200" y2="30" stroke="#aaa" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Helix - drawing front and back portions -->
  <!-- Turn 1 (bottom) back -->
  <path d="M 120,350 C 100,340 90,320 110,310" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="5,4"/>
  <!-- Turn 1 front -->
  <path d="M 110,310 C 140,295 260,290 290,305 C 310,315 300,340 280,350" fill="none" stroke="#333" stroke-width="2.5"/>
  <path d="M 280,350 C 250,365 150,365 120,350" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Turn 2 back -->
  <path d="M 120,270 C 100,260 90,240 110,230" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="5,4"/>
  <!-- Turn 2 front -->
  <path d="M 110,230 C 140,215 260,210 290,225 C 310,235 300,260 280,270" fill="none" stroke="#333" stroke-width="2.5"/>
  <path d="M 280,270 C 250,285 150,285 120,270" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Turn 3 back -->
  <path d="M 120,190 C 100,180 90,160 110,150" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="5,4"/>
  <!-- Turn 3 front -->
  <path d="M 110,150 C 140,135 260,130 290,145 C 310,155 300,180 280,190" fill="none" stroke="#333" stroke-width="2.5"/>
  <path d="M 280,190 C 250,205 150,205 120,190" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Turn 4 (top) back -->
  <path d="M 120,110 C 100,100 90,80 110,70" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="5,4"/>
  <!-- Turn 4 front -->
  <path d="M 110,70 C 140,55 260,50 290,65" fill="none" stroke="#333" stroke-width="2.5"/>

  <!-- Frenet frame at a point on turn 2 front -->
  <circle cx="290" cy="225" r="4" fill="#333"/>

  <!-- T (tangent, along curve) -->
  <line x1="290" y1="225" x2="300" y2="190" stroke="#cc2222" stroke-width="2.2" marker-end="url(#arrowHT)"/>
  <text x="303" y="186" font-family="serif" font-style="italic" font-size="15" fill="#cc2222" font-weight="bold">T</text>

  <!-- P (principal normal, toward axis/center) -->
  <line x1="290" y1="225" x2="248" y2="222" stroke="#22aa44" stroke-width="2.2" marker-end="url(#arrowHP)"/>
  <text x="233" y="220" font-family="serif" font-style="italic" font-size="15" fill="#22aa44" font-weight="bold">P</text>

  <!-- B (binormal) -->
  <line x1="290" y1="225" x2="305" y2="255" stroke="#2266bb" stroke-width="2.2" marker-end="url(#arrowHB)"/>
  <text x="308" y="262" font-family="serif" font-style="italic" font-size="15" fill="#2266bb" font-weight="bold">B</text>

  <!-- Radius r dimension line -->
  <line x1="200" y1="310" x2="290" y2="305" stroke="#888" stroke-width="1.2" marker-end="url(#arrowDimH)"/>
  <text x="230" y="300" font-family="serif" font-style="italic" font-size="14" fill="#888">r</text>

  <!-- Pitch dimension (double arrow between turns) -->
  <line x1="330" y1="225" x2="330" y2="145" stroke="#888" stroke-width="1.2"/>
  <line x1="325" y1="225" x2="335" y2="225" stroke="#888" stroke-width="1.2"/>
  <line x1="325" y1="145" x2="335" y2="145" stroke="#888" stroke-width="1.2"/>
  <text x="338" y="190" font-family="sans-serif" font-size="12" fill="#888">pitch</text>

  <!-- Formulas -->
  <text x="360" y="310" font-family="serif" font-size="14" fill="#333">κ = const</text>
  <text x="360" y="332" font-family="serif" font-size="14" fill="#333">τ = const</text>

  <!-- Curvature formula -->
  <text x="360" y="360" font-family="serif" font-size="12" fill="#666">κ = r/(r² + c²)</text>
  <text x="360" y="378" font-family="serif" font-size="12" fill="#666">τ = c/(r² + c²)</text>

  <!-- Title -->
  <text x="200" y="25" font-family="serif" font-size="15" fill="#333" text-anchor="middle">Circular helix: constant κ and τ</text>
</svg>