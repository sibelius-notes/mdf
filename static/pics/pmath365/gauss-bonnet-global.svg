<svg xmlns="http://www.w3.org/2000/svg" width="550" height="350" viewBox="0 0 550 350">
  <rect width="550" height="350" fill="white"/>

  <!-- Title -->
  <text x="275" y="28" font-family="serif" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">Global Gauss-Bonnet Theorem</text>

  <!-- Subtitle formula -->
  <text x="275" y="52" font-family="serif" font-size="16" fill="#333" text-anchor="middle">∫∫ K dA = 2πχ(M)</text>

  <!-- Panel (a): Sphere, chi = 2 -->
  <g transform="translate(95, 175)">
    <!-- Sphere -->
    <circle cx="0" cy="0" r="70" fill="rgba(100,149,237,0.15)" stroke="#4169E1" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="70" ry="18" fill="none" stroke="rgba(65,105,225,0.3)" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="18" ry="70" fill="none" stroke="rgba(65,105,225,0.3)" stroke-width="1"/>

    <!-- + signs indicating positive curvature -->
    <text x="-8" y="-35" font-family="serif" font-size="22" fill="#4169E1" font-weight="bold">+</text>
    <text x="-8" y="45" font-family="serif" font-size="22" fill="#4169E1" font-weight="bold">+</text>

    <!-- Labels -->
    <text x="0" y="95" font-family="serif" font-size="16" fill="#4169E1" text-anchor="middle" font-weight="bold">Sphere</text>
    <text x="0" y="115" font-family="serif" font-size="14" fill="#333" text-anchor="middle">χ = 2</text>
    <text x="0" y="135" font-family="serif" font-size="14" fill="#333" text-anchor="middle">∫∫ K dA = 4π</text>
  </g>

  <!-- Panel (b): Torus, chi = 0 -->
  <g transform="translate(275, 175)">
    <!-- Torus (side view approximation) -->
    <ellipse cx="0" cy="0" rx="75" ry="55" fill="none" stroke="#228B22" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="30" ry="20" fill="white" stroke="#228B22" stroke-width="2.5"/>

    <!-- + and - indicating curvature cancellation -->
    <text x="-55" y="5" font-family="serif" font-size="18" fill="#CC0000" font-weight="bold">−</text>
    <text x="42" y="5" font-family="serif" font-size="18" fill="#CC0000" font-weight="bold">−</text>
    <text x="-8" y="-30" font-family="serif" font-size="18" fill="#4169E1" font-weight="bold">+</text>
    <text x="-8" y="45" font-family="serif" font-size="18" fill="#4169E1" font-weight="bold">+</text>

    <!-- Labels -->
    <text x="0" y="95" font-family="serif" font-size="16" fill="#228B22" text-anchor="middle" font-weight="bold">Torus</text>
    <text x="0" y="115" font-family="serif" font-size="14" fill="#333" text-anchor="middle">χ = 0</text>
    <text x="0" y="135" font-family="serif" font-size="14" fill="#333" text-anchor="middle">∫∫ K dA = 0</text>
  </g>

  <!-- Panel (c): Genus-2 surface, chi = -2 -->
  <g transform="translate(455, 175)">
    <!-- Double torus (simplified) -->
    <!-- Two connected loops -->
    <path d="M -70,0 C -70,-45 -40,-55 -20,-45 C 0,-35 0,-35 20,-45 C 40,-55 70,-45 70,0 C 70,45 40,55 20,45 C 0,35 0,35 -20,45 C -40,55 -70,45 -70,0 Z" fill="rgba(180,100,100,0.1)" stroke="#8B0000" stroke-width="2.5"/>
    <!-- Holes -->
    <ellipse cx="-35" cy="0" rx="18" ry="12" fill="white" stroke="#8B0000" stroke-width="2"/>
    <ellipse cx="35" cy="0" rx="18" ry="12" fill="white" stroke="#8B0000" stroke-width="2"/>

    <!-- - signs -->
    <text x="-8" y="-28" font-family="serif" font-size="16" fill="#CC0000" font-weight="bold">−</text>
    <text x="-8" y="38" font-family="serif" font-size="16" fill="#CC0000" font-weight="bold">−</text>

    <!-- Labels -->
    <text x="0" y="95" font-family="serif" font-size="16" fill="#8B0000" text-anchor="middle" font-weight="bold">Genus 2</text>
    <text x="0" y="115" font-family="serif" font-size="14" fill="#333" text-anchor="middle">χ = −2</text>
    <text x="0" y="135" font-family="serif" font-size="14" fill="#333" text-anchor="middle">∫∫ K dA = −4π</text>
  </g>

  <!-- Separators -->
  <line x1="185" y1="70" x2="185" y2="290" stroke="#CCC" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="365" y1="70" x2="365" y2="290" stroke="#CCC" stroke-width="1" stroke-dasharray="4,4"/>
</svg>