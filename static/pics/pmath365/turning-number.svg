<svg xmlns="http://www.w3.org/2000/svg" width="450" height="350" viewBox="0 0 450 350">
  <rect width="450" height="350" fill="white"/>

  <defs>
    <marker id="arrowTt" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#cc2222"/>
    </marker>
    <marker id="arrowTheta" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#6644aa"/>
    </marker>
  </defs>

  <!-- Simple closed convex curve (ellipse-like) -->
  <ellipse cx="200" cy="190" rx="130" ry="100" fill="none" stroke="#333" stroke-width="2.5"/>

  <!-- Direction arrow on curve -->
  <path d="M 200,90 L 205,90" stroke="#333" stroke-width="2" marker-end="url(#arrowTt)"/>

  <!-- Tangent vectors at several points around the curve -->
  <!-- Top (pointing right) -->
  <circle cx="200" cy="90" r="3" fill="#333"/>
  <line x1="200" y1="90" x2="240" y2="88" stroke="#cc2222" stroke-width="2" marker-end="url(#arrowTt)"/>
  <text x="243" y="85" font-family="serif" font-style="italic" font-size="13" fill="#cc2222">T</text>

  <!-- Right (pointing down) -->
  <circle cx="330" cy="190" r="3" fill="#333"/>
  <line x1="330" y1="190" x2="332" y2="230" stroke="#cc2222" stroke-width="2" marker-end="url(#arrowTt)"/>

  <!-- Bottom (pointing left) -->
  <circle cx="200" cy="290" r="3" fill="#333"/>
  <line x1="200" y1="290" x2="160" y2="292" stroke="#cc2222" stroke-width="2" marker-end="url(#arrowTt)"/>

  <!-- Left (pointing up) -->
  <circle cx="70" cy="190" r="3" fill="#333"/>
  <line x1="70" y1="190" x2="68" y2="150" stroke="#cc2222" stroke-width="2" marker-end="url(#arrowTt)"/>

  <!-- Top-right -->
  <circle cx="290" cy="120" r="3" fill="#333"/>
  <line x1="290" y1="120" x2="315" y2="138" stroke="#cc2222" stroke-width="2" marker-end="url(#arrowTt)"/>

  <!-- Bottom-left -->
  <circle cx="110" cy="260" r="3" fill="#333"/>
  <line x1="110" y1="260" x2="85" y2="242" stroke="#cc2222" stroke-width="2" marker-end="url(#arrowTt)"/>

  <!-- Angle tracking circle (small circle showing theta going around once) -->
  <circle cx="385" cy="80" r="30" fill="none" stroke="#6644aa" stroke-width="1.5"/>

  <!-- Angle arrow going around the tracking circle -->
  <path d="M 415,80 A 30,30 0 1,1 414,78" fill="none" stroke="#6644aa" stroke-width="2" marker-end="url(#arrowTheta)"/>

  <!-- Dot at start of angle -->
  <circle cx="415" cy="80" r="2.5" fill="#6644aa"/>

  <!-- Theta label -->
  <text x="395" y="85" font-family="serif" font-style="italic" font-size="15" fill="#6644aa">θ</text>

  <!-- Arrow from tracking circle label -->
  <text x="365" y="55" font-family="sans-serif" font-size="11" fill="#6644aa">angle of T</text>

  <!-- 2pi annotation -->
  <text x="370" y="125" font-family="serif" font-size="13" fill="#6644aa">Δθ = 2π</text>

  <!-- Main label -->
  <text x="200" y="335" font-family="serif" font-size="16" fill="#333" text-anchor="middle">
    turning number n = 1
  </text>
</svg>