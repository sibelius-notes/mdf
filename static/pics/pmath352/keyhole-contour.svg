<svg viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg" style="max-width:320px;display:block;margin:1.5em auto">
  <defs>
    <marker id="arrk" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrkr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="20" y1="140" x2="295" y2="140" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <line x1="160" y1="260" x2="160" y2="15" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <text x="285" y="136" font-size="10" fill="currentColor" font-family="serif">Re</text>
  <text x="163" y="14" font-size="10" fill="currentColor" font-family="serif">Im</text>
  <!-- Branch cut (negative real axis) -->
  <line x1="160" y1="140" x2="20" y2="140" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="22" y="133" font-size="11" fill="#ef4444" font-family="sans-serif">branch cut</text>
  <!-- Large arc (from just above branch cut, CCW, to just below) -->
  <path d="M 158,142 A 130,130 0 1,1 158,138" stroke="#3b82f6" stroke-width="1.8" fill="none" marker-end="url(#arrk)"/>
  <!-- Small inner arc (CW, around origin) -->
  <path d="M 163,137 A 8,8 0 1,0 163,143" stroke="#3b82f6" stroke-width="1.8" fill="none"/>
  <!-- Top segment (just above branch cut, going left) -->
  <line x1="28" y1="138" x2="152" y2="138" stroke="#3b82f6" stroke-width="1.8"/>
  <!-- Bottom segment (just below branch cut, going right) -->
  <line x1="152" y1="142" x2="28" y2="142" stroke="#3b82f6" stroke-width="1.8"/>
  <!-- Labels -->
  <text x="255" y="55" font-size="11" fill="#3b82f6" font-family="serif">R → ∞</text>
  <text x="170" y="115" font-size="11" fill="#3b82f6" font-family="serif">ε → 0</text>
  <text x="75" y="128" font-size="11" fill="#3b82f6" font-family="serif">C₊</text>
  <text x="75" y="158" font-size="11" fill="#3b82f6" font-family="serif">C₋</text>
  <text x="243" y="145" font-size="11" fill="#3b82f6" font-family="serif" font-style="italic">C_R</text>
</svg>
