<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" style="max-width:320px;display:block;margin:1.5em auto">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="20" y1="130" x2="300" y2="130" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="160" y1="250" x2="160" y2="10" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Axis labels -->
  <text x="305" y="134" font-size="13" fill="currentColor" font-family="serif" font-style="italic">x</text>
  <text x="153" y="8" font-size="13" fill="currentColor" font-family="serif" font-style="italic">y</text>
  <text x="298" y="148" font-size="12" fill="currentColor" font-family="serif">Re</text>
  <text x="165" y="22" font-size="12" fill="currentColor" font-family="serif">Im</text>
  <!-- Point z = a+bi -->
  <line x1="160" y1="130" x2="240" y2="65" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="240" y1="130" x2="240" y2="65" stroke="currentColor" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="160" y1="65" x2="240" y2="65" stroke="currentColor" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <circle cx="240" cy="65" r="4" fill="#3b82f6"/>
  <!-- |z| label -->
  <text x="185" y="90" font-size="12" fill="#3b82f6" font-family="serif" font-style="italic">|z|</text>
  <!-- theta arc -->
  <path d="M 185,130 A 25,25 0 0,0 172,109" stroke="#ef4444" stroke-width="1.5" fill="none"/>
  <text x="190" y="118" font-size="12" fill="#ef4444" font-family="serif" font-style="italic">θ</text>
  <!-- a, b labels -->
  <text x="237" y="145" font-size="12" fill="currentColor" font-family="serif" font-style="italic">a</text>
  <text x="143" y="65" font-size="12" fill="currentColor" font-family="serif" font-style="italic">b</text>
  <!-- z label -->
  <text x="246" y="62" font-size="13" fill="#3b82f6" font-family="serif" font-style="italic">z = a+bi</text>
  <!-- Origin -->
  <text x="145" y="145" font-size="12" fill="currentColor" font-family="serif">O</text>
  <!-- tick marks -->
  <line x1="240" y1="127" x2="240" y2="133" stroke="currentColor" stroke-width="1"/>
  <line x1="157" y1="65" x2="163" y2="65" stroke="currentColor" stroke-width="1"/>
</svg>
