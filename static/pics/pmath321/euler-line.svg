<svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg" style="max-width:360px;display:block;margin:1.5em auto">
  <!-- Triangle -->
  <polygon points="80,170 310,170 190,30" stroke="currentColor" stroke-width="1.8" fill="none" opacity="0.6"/>
  <!-- Euler line -->
  <line x1="30" y1="182" x2="330" y2="90" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- H (orthocenter) approx x=100, y=175 -->
  <circle cx="110" cy="171" r="5" fill="#ef4444"/>
  <text x="101" y="186" font-size="13" fill="#ef4444" font-family="serif" font-style="italic">H</text>
  <!-- G (centroid) = between H and O, HG:GO = 2:1 -->
  <!-- H at 110,171; O at ~196,147 → G divides HO in ratio 2:1 from H: G = H + 2/3*(O-H) = (110+2/3*86, 171+2/3*(-24)) = (167, 155) -->
  <circle cx="167" cy="155" r="5" fill="#3b82f6"/>
  <text x="170" y="148" font-size="13" fill="#3b82f6" font-family="serif" font-style="italic">G</text>
  <!-- O (circumcenter) -->
  <circle cx="196" cy="147" r="5" fill="#22c55e"/>
  <text x="199" y="142" font-size="13" fill="#22c55e" font-family="serif" font-style="italic">O</text>
  <!-- HG segment (length 2 parts) -->
  <line x1="110" y1="171" x2="167" y2="155" stroke="#ef4444" stroke-width="2.5"/>
  <!-- GO segment (length 1 part) -->
  <line x1="167" y1="155" x2="196" y2="147" stroke="#22c55e" stroke-width="2.5"/>
  <!-- Ratio labels -->
  <text x="126" y="168" font-size="11" fill="currentColor" font-family="sans-serif">2</text>
  <text x="178" y="152" font-size="11" fill="currentColor" font-family="sans-serif">1</text>
  <!-- Euler line label -->
  <text x="260" y="102" font-size="12" fill="#3b82f6" font-family="serif">Euler line</text>
  <text x="10" y="196" font-size="11" fill="currentColor" font-family="sans-serif">HG : GO = 2 : 1</text>
</svg>
