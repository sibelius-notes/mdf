<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg" style="max-width:320px;display:block;margin:1.5em auto">
  <defs>
    <marker id="arrp" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- Two parallel lines in Euclidean sense, converging to vanishing point -->
  <!-- Perspective: two rails going to horizon -->
  <!-- Left rail: from (60,210) to (160,80) -->
  <line x1="60" y1="210" x2="162" y2="82" stroke="currentColor" stroke-width="1.8" stroke-dasharray="none"/>
  <!-- Right rail: from (260,210) to (162,82) -->
  <line x1="260" y1="210" x2="162" y2="82" stroke="currentColor" stroke-width="1.8"/>
  <!-- More parallel lines -->
  <line x1="30" y1="210" x2="162" y2="82" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="290" y1="210" x2="162" y2="82" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <!-- "Point at infinity" -->
  <circle cx="162" cy="80" r="5" fill="#ef4444"/>
  <text x="170" y="76" font-size="12" fill="#ef4444" font-family="serif">P_∞</text>
  <!-- Horizon line -->
  <line x1="20" y1="90" x2="300" y2="90" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="210" y="84" font-size="11" fill="#3b82f6" font-family="serif">line at ∞</text>
  <!-- Cross ties (to suggest railway tracks) -->
  <line x1="80" y1="197" x2="240" y2="197" stroke="currentColor" stroke-width="1.2" opacity="0.35"/>
  <line x1="90" y1="180" x2="232" y2="180" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <line x1="105" y1="160" x2="217" y2="160" stroke="currentColor" stroke-width="1" opacity="0.2"/>
  <line x1="120" y1="140" x2="203" y2="140" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  <!-- Labels -->
  <text x="15" y="225" font-size="11" fill="currentColor" font-family="sans-serif">Parallel lines meet at P_∞ in ℙ²</text>
</svg>
