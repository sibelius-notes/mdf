<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" style="max-width:400px;display:block;margin:1.5em auto">
  <!-- Panel labels -->
  <text x="10" y="16" font-size="12" fill="currentColor" font-family="sans-serif" font-weight="bold">Rotation</text>
  <text x="110" y="16" font-size="12" fill="currentColor" font-family="sans-serif" font-weight="bold">Reflection</text>
  <text x="220" y="16" font-size="12" fill="currentColor" font-family="sans-serif" font-weight="bold">Translation</text>
  <text x="322" y="16" font-size="12" fill="currentColor" font-family="sans-serif" font-weight="bold">Glide Refl.</text>

  <!-- ROTATION panel (center at 50,100) -->
  <!-- Original triangle -->
  <polygon points="35,60 65,60 50,90" stroke="#3b82f6" stroke-width="1.5" fill="#3b82f6" fill-opacity="0.15"/>
  <!-- Rotated triangle (~90deg CCW) -->
  <polygon points="20,100 20,130 50,115" stroke="#ef4444" stroke-width="1.5" fill="#ef4444" fill-opacity="0.12" stroke-dasharray="4,2"/>
  <!-- Center of rotation -->
  <circle cx="50" cy="100" r="3" fill="currentColor"/>
  <!-- Arc arrow -->
  <path d="M 58,68 A 35,35 0 0,1 22,108" stroke="#3b82f6" stroke-width="1.3" fill="none"/>
  <polygon points="22,108 18,100 26,103" fill="#3b82f6"/>
  <text x="42" y="148" font-size="10" fill="currentColor" font-family="serif">center</text>

  <!-- REFLECTION panel (center at 160,90) -->
  <!-- Mirror line -->
  <line x1="160" y1="30" x2="160" y2="160" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Original -->
  <polygon points="125,55 155,55 140,95" stroke="#3b82f6" stroke-width="1.5" fill="#3b82f6" fill-opacity="0.15"/>
  <!-- Reflected -->
  <polygon points="195,55 165,55 180,95" stroke="#ef4444" stroke-width="1.5" fill="#ef4444" fill-opacity="0.12" stroke-dasharray="4,2"/>
  <!-- Correspondence arrows -->
  <line x1="125" y1="55" x2="195" y2="55" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.4"/>
  <line x1="155" y1="55" x2="165" y2="55" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.4"/>
  <text x="148" y="148" font-size="10" fill="#22c55e" font-family="serif">mirror</text>

  <!-- TRANSLATION panel -->
  <!-- Original -->
  <polygon points="228,55 258,55 243,90" stroke="#3b82f6" stroke-width="1.5" fill="#3b82f6" fill-opacity="0.15"/>
  <!-- Translated (shift right 50) -->
  <polygon points="278,55 308,55 293,90" stroke="#ef4444" stroke-width="1.5" fill="#ef4444" fill-opacity="0.12" stroke-dasharray="4,2"/>
  <!-- Translation arrows -->
  <line x1="243" y1="60" x2="290" y2="60" stroke="#3b82f6" stroke-width="1.2" marker-end="none"/>
  <polygon points="290,60 283,57 283,63" fill="#3b82f6"/>
  <text x="250" y="100" font-size="10" fill="currentColor" font-family="serif">→ v</text>

  <!-- GLIDE REFLECTION panel -->
  <!-- Mirror line (horizontal) -->
  <line x1="325" y1="100" x2="400" y2="100" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Original -->
  <polygon points="328,65 355,65 341,92" stroke="#3b82f6" stroke-width="1.5" fill="#3b82f6" fill-opacity="0.15"/>
  <!-- Reflected + translated -->
  <polygon points="358,108 385,108 371,135" stroke="#ef4444" stroke-width="1.5" fill="#ef4444" fill-opacity="0.12" stroke-dasharray="4,2"/>
  <!-- Arrow showing translation component -->
  <line x1="341" y1="92" x2="368" y2="108" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
  <text x="326" y="155" font-size="10" fill="currentColor" font-family="serif">reflect + translate</text>

  <!-- Bottom dividers -->
  <line x1="100" y1="10" x2="100" y2="170" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
  <line x1="210" y1="10" x2="210" y2="170" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
  <line x1="315" y1="10" x2="315" y2="170" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>

  <!-- Legend caption -->
  <text x="10" y="190" font-size="11" fill="currentColor" font-family="sans-serif">Blue: original shape   Red dashed: image under isometry</text>
</svg>
