<svg viewBox="0 0 340 280" xmlns="http://www.w3.org/2000/svg" style="max-width:340px;display:block;margin:1.5em auto">
  <!-- Triangle vertices: A(60,240), B(300,240), C(140,40) -->
  <polygon points="60,240 300,240 140,40" stroke="currentColor" stroke-width="2" fill="none"/>
  <!-- Vertex labels -->
  <text x="46" y="255" font-size="13" fill="currentColor" font-family="serif" font-style="italic">A</text>
  <text x="303" y="255" font-size="13" fill="currentColor" font-family="serif" font-style="italic">B</text>
  <text x="136" y="30" font-size="13" fill="currentColor" font-family="serif" font-style="italic">C</text>

  <!-- Centroid G = average of vertices = ((60+300+140)/3, (240+240+40)/3) = (166.7, 173.3) -->
  <circle cx="167" cy="173" r="4" fill="#3b82f6"/>
  <text x="172" y="178" font-size="12" fill="#3b82f6" font-family="serif" font-style="italic">G</text>
  <!-- Medians -->
  <line x1="60" y1="240" x2="220" y2="140" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="300" y1="240" x2="100" y2="140" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="140" y1="40" x2="180" y2="240" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Circumcenter O ≈ midpoint-perpendicular bisector intersection (~167, 155) -->
  <circle cx="167" cy="152" r="4" fill="#22c55e"/>
  <text x="172" y="150" font-size="12" fill="#22c55e" font-family="serif" font-style="italic">O</text>
  <!-- Circumcircle -->
  <circle cx="167" cy="152" r="100" stroke="#22c55e" stroke-width="1" stroke-dasharray="5,4" fill="none" opacity="0.5"/>

  <!-- Incenter I ~ (166, 196) -->
  <circle cx="166" cy="196" r="4" fill="#ef4444"/>
  <text x="171" y="212" font-size="12" fill="#ef4444" font-family="serif" font-style="italic">I</text>

  <!-- Orthocenter H (altitude intersection) ~ (140+20, 40+160) = (160, 200) → for this triangle approx (100,200) -->
  <circle cx="117" cy="207" r="4" fill="orange"/>
  <text x="103" y="222" font-size="12" fill="orange" font-family="serif" font-style="italic">H</text>
  <!-- Altitudes (dashed) -->
  <line x1="140" y1="40" x2="117" y2="240" stroke="orange" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="60" y1="240" x2="220" y2="207" stroke="orange" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Legend -->
  <circle cx="20" cy="18" r="4" fill="#3b82f6"/>
  <text x="27" y="22" font-size="11" fill="currentColor" font-family="sans-serif">G centroid</text>
  <circle cx="110" cy="18" r="4" fill="#22c55e"/>
  <text x="117" y="22" font-size="11" fill="currentColor" font-family="sans-serif">O circumcenter</text>
  <circle cx="220" cy="18" r="4" fill="#ef4444"/>
  <text x="227" y="22" font-size="11" fill="currentColor" font-family="sans-serif">I incenter</text>
  <circle cx="20" cy="34" r="4" fill="orange"/>
  <text x="27" y="38" font-size="11" fill="currentColor" font-family="sans-serif">H orthocenter</text>
</svg>
