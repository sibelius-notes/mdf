<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" font-family="serif" font-size="13">
  <!-- Axes -->
  <line x1="60" y1="220" x2="470" y2="220" stroke="#ccc" stroke-width="1"/>
  <line x1="80" y1="30" x2="80" y2="230" stroke="#ccc" stroke-width="1"/>
  <text x="475" y="224" fill="#999" font-size="12" font-style="italic">x</text>
  <text x="70" y="25" fill="#999" font-size="12" font-style="italic">y</text>

  <!-- The segment B = {0} x [-1, 1] -->
  <line x1="80" y1="50" x2="80" y2="190" stroke="#dc2626" stroke-width="3"/>
  <text x="30" y="125" fill="#dc2626" font-weight="bold">B</text>
  <text x="85" y="50" fill="#dc2626" font-size="11">y = 1</text>
  <text x="85" y="195" fill="#dc2626" font-size="11">y = -1</text>

  <!-- The curve A = {(x, sin(1/x)) : x > 0} -->
  <!-- Approximate with a polyline: sin(1/x) oscillates rapidly near 0 -->
  <polyline fill="none" stroke="#2563eb" stroke-width="2" points="
    80,120
    82,50
    84,190
    86,50
    89,190
    92,55
    96,185
    101,60
    108,180
    116,70
    127,175
    140,80
    158,165
    178,95
    200,160
    225,100
    252,155
    280,105
    310,150
    340,110
    370,148
    400,118
    430,142
    460,125
  "/>
  <text x="380" y="105" fill="#2563eb" font-weight="bold">A</text>
  <text x="350" y="92" fill="#2563eb" font-size="11">y = sin(1/x)</text>

  <!-- Annotation -->
  <text x="100" y="248" fill="#333" font-size="12">The topologist's sine curve: closure A = A (blue curve) union B (red segment).</text>
  <text x="100" y="262" fill="#333" font-size="12">Connected but NOT path-connected. No path can reach B from A.</text>
</svg>
