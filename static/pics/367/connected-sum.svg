<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 180" font-family="serif" font-size="13">
  <!-- Surface X -->
  <ellipse cx="80" cy="90" rx="65" ry="55" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <!-- Hole in X -->
  <circle cx="115" cy="90" r="15" fill="white" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="60" y="95" fill="#2563eb" font-weight="bold" font-size="16">X</text>

  <!-- Minus sign -->
  <text x="158" y="95" fill="#666" font-size="20">-</text>
  <!-- Small disc -->
  <circle cx="185" cy="90" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Plus sign -->
  <text x="218" y="95" fill="#666" font-size="20">+</text>

  <!-- Surface Y -->
  <ellipse cx="300" cy="90" rx="65" ry="55" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <!-- Hole in Y -->
  <circle cx="265" cy="90" r="15" fill="white" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="310" y="95" fill="#16a34a" font-weight="bold" font-size="16">Y</text>

  <!-- Minus sign -->
  <text x="343" y="95" fill="#666" font-size="20">-</text>
  <!-- Small disc -->
  <circle cx="370" cy="90" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Equals -->
  <text x="400" y="95" fill="#333" font-size="22">=</text>

  <!-- Connected sum X#Y -->
  <g transform="translate(480, 90)">
    <!-- Left blob -->
    <path d="M -15,0 C -15,-45 -60,-50 -60,0 C -60,50 -15,45 -15,0 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <!-- Neck -->
    <path d="M -15,-12 C 0,-15 0,-15 15,-12" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <path d="M -15,12 C 0,15 0,15 15,12" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <rect x="-15" y="-12" width="30" height="24" fill="#f3e8ff" stroke="none"/>
    <!-- Right blob -->
    <path d="M 15,0 C 15,-45 60,-50 60,0 C 60,50 15,45 15,0 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <!-- Neck lines on top -->
    <line x1="-15" y1="-12" x2="15" y2="-12" stroke="#7c3aed" stroke-width="2"/>
    <line x1="-15" y1="12" x2="15" y2="12" stroke="#7c3aed" stroke-width="2"/>

    <text x="-40" y="5" fill="#2563eb" font-size="11" font-weight="bold">X</text>
    <text x="30" y="5" fill="#16a34a" font-size="11" font-weight="bold">Y</text>
  </g>
  <text x="480" y="160" text-anchor="middle" fill="#333" font-weight="bold" font-size="14">X # Y</text>

  <!-- Caption -->
  <text x="10" y="175" fill="#555" font-size="11">Remove a small disc from each surface, then glue along the boundary circles.</text>
</svg>
