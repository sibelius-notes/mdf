<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="serif" font-size="13">
  <!-- The space X (blob) -->
  <path d="M 40,30 C 120,5 360,5 440,40 C 470,80 460,200 430,230 C 360,260 120,260 50,220 C 20,190 15,60 40,30 Z" fill="#f0f9ff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="420" y="55" fill="#94a3b8" font-style="italic" font-size="14">X</text>

  <!-- Point a -->
  <circle cx="100" cy="130" r="5" fill="#dc2626"/>
  <text x="80" y="125" fill="#dc2626" font-weight="bold" font-size="15">a</text>

  <!-- Point b -->
  <circle cx="380" cy="130" r="5" fill="#dc2626"/>
  <text x="390" y="125" fill="#dc2626" font-weight="bold" font-size="15">b</text>

  <!-- Path alpha (top route) -->
  <path d="M 100,130 C 150,50 300,40 380,130" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="230" y="52" fill="#2563eb" font-weight="bold" font-size="14" font-style="italic">alpha</text>

  <!-- Path beta (bottom route) -->
  <path d="M 100,130 C 150,210 300,220 380,130" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <text x="230" y="232" fill="#16a34a" font-weight="bold" font-size="14" font-style="italic">beta</text>

  <!-- Intermediate paths (the deformation) -->
  <path d="M 100,130 C 150,75 300,68 380,130" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M 100,130 C 150,100 300,95 380,130" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M 100,130 C 150,130 300,130 380,130" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M 100,130 C 150,160 300,165 380,130" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M 100,130 C 150,185 300,192 380,130" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Deformation arrow -->
  <path d="M 250,70 C 260,100 260,160 250,190" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="250,195 245,185 255,185" fill="#f59e0b"/>
  <text x="265" y="135" fill="#f59e0b" font-size="12">F(s, t)</text>
  <text x="265" y="150" fill="#f59e0b" font-size="11">homotopy</text>

  <!-- s parameter -->
  <text x="195" y="62" fill="#999" font-size="11">s = 0</text>
  <text x="195" y="224" fill="#999" font-size="11">s = 1</text>
</svg>
