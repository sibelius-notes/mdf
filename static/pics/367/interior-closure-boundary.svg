<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" font-family="serif" font-size="14">
  <!-- The ambient space X -->
  <rect x="20" y="20" width="420" height="240" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="30" y="42" fill="#94a3b8" font-style="italic">X</text>

  <!-- The closure (outermost region of A-bar) -->
  <ellipse cx="220" cy="145" rx="155" ry="95" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="355" y="90" fill="#2563eb" font-size="13">closure A</text>

  <!-- The set A itself (slightly smaller, jagged to suggest non-open non-closed) -->
  <path d="M 100,145 C 105,85 160,65 220,70 C 280,65 340,90 345,145 C 340,195 280,220 220,225 C 160,220 95,195 100,145 Z" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="255" y="195" fill="#3b82f6" font-size="13" font-style="italic">A</text>

  <!-- The interior (innermost, solid boundary) -->
  <ellipse cx="218" cy="143" rx="100" ry="60" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="185" y="148" fill="#1d4ed8" font-size="13">interior A</text>
  <text x="200" y="165" fill="#1d4ed8" font-size="11">(largest open subset)</text>

  <!-- Boundary annotation -->
  <line x1="360" y1="145" x2="395" y2="110" stroke="#dc2626" stroke-width="1"/>
  <text x="365" y="105" fill="#dc2626" font-size="12">boundary</text>
  <text x="378" y="118" fill="#dc2626" font-size="11">= closure \ interior</text>

  <!-- Points -->
  <circle cx="218" cy="130" r="3" fill="#1d4ed8"/>
  <text x="225" y="128" fill="#1d4ed8" font-size="11">interior point</text>

  <circle cx="330" cy="155" r="3" fill="#dc2626"/>
  <text x="300" y="175" fill="#dc2626" font-size="11">boundary point</text>

  <circle cx="130" cy="90" r="3" fill="#7c3aed"/>
  <text x="83" y="85" fill="#7c3aed" font-size="11">limit point</text>
</svg>
