<svg viewBox="0 0 380 160" xmlns="http://www.w3.org/2000/svg" style="max-width:380px;display:block;margin:1.5em auto">
  <!-- The real line -->
  <line x1="10" y1="80" x2="370" y2="80" stroke="currentColor" stroke-width="2"/>
  <text x="360" y="75" font-size="13" fill="currentColor" font-family="serif">ℝ</text>

  <!-- ℝ as big interval label -->
  <text x="10" y="55" font-size="12" fill="currentColor" font-family="sans-serif">ℝ (complete metric space, 2nd category)</text>

  <!-- A "nowhere dense" set: scattered points/dust on the line -->
  <!-- Cantor-like closed set - small filled segments separated by gaps -->
  <line x1="30" y1="80" x2="50" y2="80" stroke="#ef4444" stroke-width="5" opacity="0.7"/>
  <line x1="80" y1="80" x2="95" y2="80" stroke="#ef4444" stroke-width="5" opacity="0.7"/>
  <line x1="150" y1="80" x2="158" y2="80" stroke="#ef4444" stroke-width="5" opacity="0.7"/>
  <line x1="175" y1="80" x2="183" y2="80" stroke="#ef4444" stroke-width="5" opacity="0.7"/>
  <line x1="250" y1="80" x2="255" y2="80" stroke="#ef4444" stroke-width="5" opacity="0.7"/>
  <line x1="263" y1="80" x2="268" y2="80" stroke="#ef4444" stroke-width="5" opacity="0.7"/>
  <line x1="305" y1="80" x2="310" y2="80" stroke="#ef4444" stroke-width="5" opacity="0.7"/>
  <line x1="317" y1="80" x2="322" y2="80" stroke="#ef4444" stroke-width="5" opacity="0.7"/>

  <!-- Label for nowhere dense set -->
  <text x="55" y="100" font-size="11" fill="#ef4444" font-family="sans-serif">N₁ (nowhere dense)</text>

  <!-- A second nowhere dense set (blue, slightly offset) -->
  <line x1="60" y1="80" x2="70" y2="80" stroke="#3b82f6" stroke-width="5" opacity="0.6"/>
  <line x1="108" y1="80" x2="120" y2="80" stroke="#3b82f6" stroke-width="5" opacity="0.6"/>
  <line x1="195" y1="80" x2="205" y2="80" stroke="#3b82f6" stroke-width="5" opacity="0.6"/>
  <line x1="280" y1="80" x2="290" y2="80" stroke="#3b82f6" stroke-width="5" opacity="0.6"/>

  <!-- Baire: countable union of closed nowhere dense ≠ all of ℝ -->
  <text x="10" y="125" font-size="11" fill="currentColor" font-family="sans-serif">Baire Category: ℝ ≠ ⋃ Nₙ for Nₙ nowhere dense</text>
  <text x="10" y="142" font-size="11" fill="currentColor" font-family="sans-serif">ℝ is 2nd category (not meager)</text>
</svg>
