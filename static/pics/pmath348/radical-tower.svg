<svg viewBox="0 0 260 360" xmlns="http://www.w3.org/2000/svg" style="max-width:260px;display:block;margin:1.5em auto">
  <!-- Radical tower from F up to K -->
  <!-- Boxes at each level -->
  <rect x="85" y="290" width="90" height="32" rx="5" stroke="currentColor" stroke-width="1.5" fill="currentColor" fill-opacity="0.05"/>
  <text x="115" y="311" font-size="14" fill="currentColor" font-family="serif">F = F₀</text>

  <rect x="75" y="220" width="110" height="32" rx="5" stroke="#3b82f6" stroke-width="1.5" fill="#3b82f6" fill-opacity="0.06"/>
  <text x="80" y="241" font-size="13" fill="#3b82f6" font-family="serif">F₁ = F₀(α₁)</text>

  <rect x="75" y="150" width="110" height="32" rx="5" stroke="#3b82f6" stroke-width="1.4" fill="#3b82f6" fill-opacity="0.05"/>
  <text x="80" y="171" font-size="13" fill="#3b82f6" font-family="serif">F₂ = F₁(α₂)</text>

  <!-- Dots -->
  <text x="125" y="120" font-size="18" fill="currentColor" font-family="serif">⋮</text>

  <rect x="75" y="55" width="110" height="32" rx="5" stroke="#22c55e" stroke-width="1.5" fill="#22c55e" fill-opacity="0.06"/>
  <text x="95" y="76" font-size="13" fill="#22c55e" font-family="serif">Fₘ = F(α)</text>

  <!-- Lines and labels -->
  <line x1="130" y1="290" x2="130" y2="252" stroke="currentColor" stroke-width="1.5"/>
  <text x="137" y="275" font-size="12" fill="#ef4444" font-family="serif">α₁ⁿ¹ ∈ F₀</text>

  <line x1="130" y1="220" x2="130" y2="182" stroke="currentColor" stroke-width="1.5"/>
  <text x="137" y="205" font-size="12" fill="#ef4444" font-family="serif">α₂ⁿ² ∈ F₁</text>

  <line x1="130" y1="150" x2="130" y2="130" stroke="currentColor" stroke-width="1.5"/>

  <line x1="130" y1="110" x2="130" y2="87" stroke="currentColor" stroke-width="1.5"/>
  <text x="137" y="100" font-size="12" fill="#ef4444" font-family="serif">αₘⁿᵐ ∈ Fₘ₋₁</text>

  <!-- Caption -->
  <text x="10" y="340" font-size="11" fill="currentColor" font-family="sans-serif">Each αᵢ is an nᵢ-th root</text>
  <text x="10" y="354" font-size="11" fill="currentColor" font-family="sans-serif">Solvable by radicals ⟺ Gal is solvable</text>
</svg>
