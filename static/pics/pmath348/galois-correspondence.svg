<svg viewBox="0 0 380 320" xmlns="http://www.w3.org/2000/svg" style="max-width:380px;display:block;margin:1.5em auto">
  <!-- Left: subgroup lattice of Gal(K/F) -->
  <!-- Right: subfield lattice K/F -->

  <!-- Left side header -->
  <text x="30" y="18" font-size="12" fill="currentColor" font-family="serif" font-weight="bold">Subgroups of Gal(K/F)</text>
  <!-- Right side header -->
  <text x="220" y="18" font-size="12" fill="currentColor" font-family="serif" font-weight="bold">Subfields F ⊆ E ⊆ K</text>

  <!-- LEFT lattice (subgroups): {e} at top, G at bottom -->
  <!-- {e} -->
  <rect x="50" y="35" width="60" height="28" rx="4" stroke="#3b82f6" stroke-width="1.5" fill="#3b82f6" fill-opacity="0.08"/>
  <text x="63" y="53" font-size="12" fill="#3b82f6" font-family="serif">{e}</text>
  <!-- H1, H2 (intermediate) -->
  <rect x="20" y="120" width="50" height="28" rx="4" stroke="#3b82f6" stroke-width="1.2" fill="#3b82f6" fill-opacity="0.05"/>
  <text x="30" y="138" font-size="11" fill="#3b82f6" font-family="serif">H₁</text>
  <rect x="90" y="120" width="50" height="28" rx="4" stroke="#3b82f6" stroke-width="1.2" fill="#3b82f6" fill-opacity="0.05"/>
  <text x="100" y="138" font-size="11" fill="#3b82f6" font-family="serif">H₂</text>
  <!-- G at bottom -->
  <rect x="50" y="210" width="60" height="28" rx="4" stroke="#3b82f6" stroke-width="1.5" fill="#3b82f6" fill-opacity="0.08"/>
  <text x="65" y="228" font-size="12" fill="#3b82f6" font-family="serif">G</text>

  <!-- Lines in left lattice -->
  <line x1="80" y1="63" x2="45" y2="120" stroke="#3b82f6" stroke-width="1.2" opacity="0.6"/>
  <line x1="80" y1="63" x2="115" y2="120" stroke="#3b82f6" stroke-width="1.2" opacity="0.6"/>
  <line x1="45" y1="148" x2="80" y2="210" stroke="#3b82f6" stroke-width="1.2" opacity="0.6"/>
  <line x1="115" y1="148" x2="80" y2="210" stroke="#3b82f6" stroke-width="1.2" opacity="0.6"/>

  <!-- RIGHT lattice (subfields): K at top, F at bottom -->
  <!-- K -->
  <rect x="240" y="35" width="60" height="28" rx="4" stroke="#22c55e" stroke-width="1.5" fill="#22c55e" fill-opacity="0.08"/>
  <text x="256" y="53" font-size="12" fill="#22c55e" font-family="serif">K</text>

  <!-- E1, E2 (intermediate) -->
  <rect x="210" y="120" width="55" height="28" rx="4" stroke="#22c55e" stroke-width="1.2" fill="#22c55e" fill-opacity="0.05"/>
  <text x="220" y="138" font-size="11" fill="#22c55e" font-family="serif">K^H₁</text>
  <rect x="285" y="120" width="55" height="28" rx="4" stroke="#22c55e" stroke-width="1.2" fill="#22c55e" fill-opacity="0.05"/>
  <text x="295" y="138" font-size="11" fill="#22c55e" font-family="serif">K^H₂</text>

  <!-- F at bottom -->
  <rect x="240" y="210" width="60" height="28" rx="4" stroke="#22c55e" stroke-width="1.5" fill="#22c55e" fill-opacity="0.08"/>
  <text x="256" y="228" font-size="12" fill="#22c55e" font-family="serif">F</text>

  <!-- Lines in right lattice -->
  <line x1="270" y1="63" x2="237" y2="120" stroke="#22c55e" stroke-width="1.2" opacity="0.6"/>
  <line x1="270" y1="63" x2="312" y2="120" stroke="#22c55e" stroke-width="1.2" opacity="0.6"/>
  <line x1="237" y1="148" x2="270" y2="210" stroke="#22c55e" stroke-width="1.2" opacity="0.6"/>
  <line x1="312" y1="148" x2="270" y2="210" stroke="#22c55e" stroke-width="1.2" opacity="0.6"/>

  <!-- Correspondence arrows (bidirectional) -->
  <!-- Top level: {e} ↔ K -->
  <line x1="115" y1="49" x2="235" y2="49" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="4,3"/>
  <polygon points="235,49 228,46 228,52" fill="#ef4444"/>
  <polygon points="115,49 122,46 122,52" fill="#ef4444"/>
  <!-- Middle level -->
  <line x1="75" y1="134" x2="205" y2="134" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
  <polygon points="205,134 198,131 198,137" fill="#ef4444" opacity="0.7"/>
  <!-- Bottom: G ↔ F -->
  <line x1="115" y1="224" x2="235" y2="224" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="4,3"/>
  <polygon points="235,224 228,221 228,227" fill="#ef4444"/>
  <polygon points="115,224 122,221 122,227" fill="#ef4444"/>

  <!-- Caption -->
  <text x="30" y="280" font-size="11" fill="currentColor" font-family="sans-serif">H ↔ K^H = {x∈K : σ(x)=x for all σ∈H}</text>
  <text x="30" y="295" font-size="11" fill="currentColor" font-family="sans-serif">Order-reversing bijection (Galois correspondence)</text>
</svg>
